name: Deploy Edge Function

# Deliberate, manual deploys of the ticket-suggester Edge Function via the
# Supabase CLI — replacing the hand-carried bundle path used on 2026-07-31.
# Deploying code does NOT change runtime behaviour gates: DRY_RUN and the
# paused scheduler are env/config, untouched by a deploy.
#
# Required repo secret: SUPABASE_ACCESS_TOKEN — a Supabase personal access
# token (dashboard → Account → Access Tokens). NOT the service-role key.

on:
  workflow_dispatch:
    inputs:
      function:
        description: Which Edge Function to deploy
        type: choice
        required: true
        default: ticket-suggester
        options:
          - ticket-suggester
          - feedback
          - review-ui

concurrency:
  group: deploy-function
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pqwnpcibymtmcpnqlkle
    steps:
      - uses: actions/checkout@v4

      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing repo secret SUPABASE_ACCESS_TOKEN — create a personal access token in the Supabase dashboard (Account → Access Tokens) and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Secret present."

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          IN_FUNCTION: ${{ inputs.function }}
        run: |
          set -euo pipefail
          # verify_jwt stays false: the function is invoked by pg_cron with an
          # x-cron-secret header, not a JWT (matches the deployed config).
          supabase functions deploy "$IN_FUNCTION" \
            --project-ref "$PROJECT_REF" \
            --no-verify-jwt
          {
            echo "### Deployed \`$IN_FUNCTION\` ✅"
            echo ""
            echo "Project \`$PROJECT_REF\` · commit \`${GITHUB_SHA::7}\` · DRY_RUN/env untouched by deploys."
          } >> "$GITHUB_STEP_SUMMARY"
