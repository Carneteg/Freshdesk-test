name: Batch jobs (replay / score-history / sync-tickets)

# Run the Gate 1 batch jobs from GitHub instead of locally in PowerShell.
# Trigger manually: Actions → "Batch jobs" → Run workflow → pick a job.
#
# None of these post to Freshdesk — they only read Freshdesk + OpenAI and write
# results to Supabase (the same as running them on a laptop). Real ticket text is
# sent to OpenAI for scoring; the DPA position is cleared for that (CLAUDE.md §11).
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   FRESHDESK_DOMAIN, FRESHDESK_API_KEY, OPENAI_API_KEY,
#   MY_AGENT_ID, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# Optional: OPENAI_MODEL (defaults to gpt-4o if unset)

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which batch job to run
        type: choice
        required: true
        default: score-history
        options:
          - score-history   # QA-score agents' historical replies (triage). Posts nothing.
          - csat-scan       # Sync Freshdesk CSAT ratings into Supabase. Read-only, no OpenAI.
          - ticket-landscape # Probe ticket fields: company, product, group. Read-only, writes nothing.
          - replay          # Replay closed tickets through the pipeline (evaluation).
          - sync-tickets    # Refresh the semantic past-ticket precedent index.
          - assign-cohorts  # Lock tickets into learning/development/holdout sets (Supabase only).
          - knowledge-gaps  # Report the top undocumented topics to write KB for (Supabase only).
          - verify-api      # Probe the Freshdesk API + print the customer KB links. Read-only, no OpenAI.
      ticket_ids:
        description: "Explicit ticket ids (space-separated). Leave empty to auto-pick by agent/count."
        type: string
        required: false
        default: ""
      agent:
        description: "Agent to pick tickets for (name / email / numeric id). Empty = MY_AGENT_ID secret."
        type: string
        required: false
        default: ""
      count:
        description: "How many closed tickets to auto-pick (replay/score-history). Empty = script default."
        type: string
        required: false
        default: ""
      since:
        description: "csat-scan only — earliest rating date (YYYY-MM-DD). Empty = 2 years back."
        type: string
        required: false
        default: ""
      cohort:
        description: "replay only — run one locked cohort. 'none' = pick by ids/agent."
        type: choice
        required: false
        default: none
        options:
          - none
          - learning
          - development
          - holdout
      learning_loop:
        description: "replay only — feed reviewer gold answers in as exemplars (+gold run)"
        type: boolean
        required: false
        default: false
      qa_coach:
        description: "replay only — also run the QA coach on each draft"
        type: boolean
        required: false
        default: true
      approved_sample:
        description: "replay only — confirm the previewed ticket sample may be sent to OpenAI"
        type: boolean
        required: false
        default: false

# Don't let two batch runs overlap — they write the same Supabase rows.
concurrency:
  group: batch-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRESHDESK_DOMAIN: ${{ secrets.FRESHDESK_DOMAIN }}
      FRESHDESK_API_KEY: ${{ secrets.FRESHDESK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MY_AGENT_ID: ${{ secrets.MY_AGENT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # replay reads these as strings; empty is fine (LEARNING_LOOP!=="true", QA_COACH!=="false")
      LEARNING_LOOP: ${{ inputs.learning_loop }}
      QA_COACH: ${{ inputs.qa_coach }}
      REPLAY_APPROVED: ${{ inputs.approved_sample }}
      # csat-scan reuses the `agent` input to focus its report on one agent.
      CSAT_AGENT: ${{ inputs.agent }}
      # csat-scan: how far back to look. Empty = the script's own wide default,
      # never Freshdesk's silent 30-day one.
      CSAT_SINCE: ${{ inputs.since }}
      # Never print subjects, customer/agent text, drafts, or source excerpts in
      # Actions logs/Summary. Local replay remains detailed by default.
      CLOUD_LOG_MODE: safe
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          IN_JOB: ${{ inputs.job }}
        run: |
          # verify-api touches Freshdesk only — it calls no LLM and writes no
          # Supabase rows, so demanding the other secrets would block a probe
          # that does not need them.
          if [ "$IN_JOB" = "verify-api" ]; then
            required="FRESHDESK_DOMAIN FRESHDESK_API_KEY"
          elif [ "$IN_JOB" = "ticket-landscape" ]; then
            # Pure read probe: Freshdesk only, no Supabase write, no LLM.
            required="FRESHDESK_DOMAIN FRESHDESK_API_KEY"
          elif [ "$IN_JOB" = "csat-scan" ]; then
            # CSAT is a read + a Supabase write. No LLM, so no OpenAI key needed.
            required="FRESHDESK_DOMAIN FRESHDESK_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY"
          else
            required="FRESHDESK_DOMAIN FRESHDESK_API_KEY OPENAI_API_KEY MY_AGENT_ID SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY"
          fi
          missing=""
          for v in $required; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing — add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.4

      - name: Run batch job
        # Inputs come in via env (never interpolated into the script) to avoid shell injection.
        env:
          IN_JOB: ${{ inputs.job }}
          IN_IDS: ${{ inputs.ticket_ids }}
          IN_AGENT: ${{ inputs.agent }}
          IN_COUNT: ${{ inputs.count }}
          IN_COHORT: ${{ inputs.cohort }}
          OPENAI_MODEL_SECRET: ${{ secrets.OPENAI_MODEL }}
        run: |
          # No -e: we want to write the run summary even when the script exits non-zero.
          set -uo pipefail

          # OpenAI model: fall back to gpt-4o when the secret is unset (empty string
          # would otherwise reach the client as an invalid model name).
          model="$OPENAI_MODEL_SECRET"
          [ -z "$model" ] && model="gpt-4o"
          export OPENAI_MODEL="$model"

          # Optional selectors — only export when provided, so the scripts' own
          # defaults (e.g. REPLAY_COUNT=10, SCORE_COUNT=50) are not overridden by
          # an empty string (Number("") === 0 would pick zero tickets).
          if [ -n "$IN_AGENT" ]; then export REPLAY_AGENT="$IN_AGENT" SCORE_AGENT="$IN_AGENT"; fi
          if [ -n "$IN_COUNT" ]; then export REPLAY_COUNT="$IN_COUNT" SCORE_COUNT="$IN_COUNT"; fi
          # COHORT selects a locked cohort for replay; 'none' (the default) leaves it unset.
          if [ -n "$IN_COHORT" ] && [ "$IN_COHORT" != "none" ]; then export COHORT="$IN_COHORT"; fi

          echo "Running '$IN_JOB' (model=$OPENAI_MODEL, ids='${IN_IDS:-<auto>}', agent='${IN_AGENT:-MY_AGENT_ID}', count='${IN_COUNT:-default}', cohort='${COHORT:-none}')"

          # $IN_IDS is intentionally unquoted so space-separated numeric ids become
          # separate args; empty expands to nothing → the script auto-picks by agent.
          # Tee output to a file so we can surface the tail in the run Summary tab.
          rc=0
          {
            case "$IN_JOB" in
              replay)         deno run --allow-env --allow-net scripts/replay.ts $IN_IDS ;;
              score-history)  deno run --allow-env --allow-net scripts/score_history.ts $IN_IDS ;;
              csat-scan)      deno run --allow-env --allow-net scripts/csat_scan.ts ;;
              ticket-landscape) deno run --allow-env --allow-net scripts/ticket_landscape.ts ;;
              sync-tickets)   deno run --allow-env --allow-net scripts/sync_tickets.ts ;;
              assign-cohorts) deno run --allow-env --allow-net scripts/assign_cohorts.ts $IN_IDS ;;
              knowledge-gaps) deno run --allow-env --allow-net scripts/knowledge_gaps.ts ;;
              # Read-only probe. It only WRITES if POST_TEST_NOTE_TICKET_ID is set,
              # which this workflow deliberately never sets.
              verify-api)     deno run --allow-env --allow-net scripts/verify_api.ts ;;
              *)              echo "::error::Unknown job '$IN_JOB'"; exit 1 ;;
            esac
          } 2>&1 | tee /tmp/batch-out.log || rc=$?

          # Human-readable result in the Actions "Summary" tab — no need to open the log.
          {
            echo "### Batch job: \`$IN_JOB\` $( [ "$rc" -eq 0 ] && echo '✅' || echo "❌ (exit $rc)")"
            echo ""
            echo "model \`$OPENAI_MODEL\` · agent \`${IN_AGENT:-MY_AGENT_ID}\` · count \`${IN_COUNT:-default}\` · cohort \`${COHORT:-none}\` · ids \`${IN_IDS:-<auto>}\`"
            echo ""
            echo '```text'
            # the "Done. scored=… / Cohort … / distribution" tail is what matters.
            # verify-api prints six probes, so 30 lines would cut off the KB links.
            lines=30; [ "$IN_JOB" = "verify-api" ] && lines=120
            tail -n "$lines" /tmp/batch-out.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$rc"
