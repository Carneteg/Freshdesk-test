// internal_check is the only type with no signal by design. Everything else is
// observable in this dataset — the point of the demo is a fully connected world.
function demoObservable(type) { return type !== "internal_check"; }

function demoSteps() {
  var seen = {};
  return DEMO_ROWS.map(function (r, i) {
    var id = r[0], subject = r[1], type = r[2], followed = !!r[3], flags = r[4] || "";
    var texts = DEMO_TEXT[type] || [""];
    var obs = demoObservable(type);
    var via = DEMO_VIA[type] || "—";
    if (followed && DEMO_REF[type]) {
      seen[type] = (seen[type] || 0);
      via += " · " + DEMO_REF[type][seen[type]++ % DEMO_REF[type].length];
    }
    return {
      ticket_id: id,
      ticket_url: "https://simployer.freshdesk.com/a/tickets/" + id,
      subject: subject,
      step_type: type,
      step_text: texts[i % texts.length],
      observed_via: obs ? via : "—",
      observable: obs,
      observed: obs ? followed : null,
      delivery_status: flags.indexOf("l") !== -1 ? "late" : "in_time",
      cohort: flags.indexOf("h") !== -1 ? "holdout" : "development",
      judged_unusable: flags.indexOf("x") !== -1,
    };
  });
}

// Computed from the rows above, never typed twice — so the summary table and
// the per-ticket table cannot drift apart.
function demoMix(steps) {
  var by = {}, order = [];
  steps.forEach(function (s) {
    if (!by[s.step_type]) { by[s.step_type] = { step_type: s.step_type, steps: 0, observable: 0, followed: 0 }; order.push(s.step_type); }
    var m = by[s.step_type];
    m.steps++;
    if (s.observable) { m.observable++; if (s.observed) m.followed++; }
  });
  return order.map(function (k) {
    var m = by[k];
    m.followed_pct = m.observable ? Math.round(1000 * m.followed / m.observable) / 10 : null;
    return m;
  }).sort(function (a, b) { return b.steps - a.steps; });
}

// Follow-through read against the outcome, holdout kept separate. The bucket
// SIZES are counted from the rows above, so the totals always reconcile with
// the two tables. The outcome rates are fixed per bucket and deliberately
// unimpressive — a demo where following the advice yields 96% usable does not
// look like support data, it looks like a sales slide. The story it should tell
// is the modest one: following good advice correlates with a usable draft.
var DEMO_OUTCOME = {
  followed: { usable: 0.64, unusable: 0.14 },
  not_followed: { usable: 0.33, unusable: 0.30 },
  not_observable: { usable: 0.45, unusable: 0.20 },
};

function demoPairing(steps) {
  var by = {}, order = [];
  steps.forEach(function (s) {
    var ft = !s.observable ? "not_observable" : s.observed ? "followed" : "not_followed";
    var key = ft + "|" + s.cohort;
    if (!by[key]) { by[key] = { follow_through: ft, cohort: s.cohort, suggestions: 0 }; order.push(key); }
    by[key].suggestions++;
  });
  return order.map(function (k) {
    var p = by[k], rate = DEMO_OUTCOME[p.follow_through];
    // Not every generation gets judged, here as in the real data.
    p.judged = Math.round(p.suggestions * 0.88);
    p.usable = Math.round(p.judged * rate.usable);
    p.unusable = Math.round(p.judged * rate.unusable);
    // judged > usable + unusable on purpose: the remainder is 'edited'.
    p.usable_pct = p.judged ? Math.round(1000 * p.usable / p.judged) / 10 : null;
    return p;
  }).sort(function (a, b) {
    return a.follow_through.localeCompare(b.follow_through) || a.cohort.localeCompare(b.cohort);
  });
}

// Followed and it still went wrong, or it never reached the agent in time. The
// late ones are labelled a DELIVERY failure so they are never misread as bad
// advice — that distinction is the whole reason this section exists.
function demoFailed(steps) {
  return steps.filter(function (s) {
    return s.judged_unusable || s.delivery_status === "late";
  }).map(function (s) {
    return {
      ticket_id: s.ticket_id,
      subject: s.subject,
      step_text: s.step_text,
      delivery_status: s.delivery_status,
      failure_kind: s.delivery_status === "late"
        ? "note posted after the agent had already replied"
        : "step was followed and the suggestion was still judged unusable",
    };
  });
}

// Step-type mix — and the unobservable share, which judges the PROMPT, not the agent.
function stepMixEl() {
  var box = el("div", "cmix");
  if (!coach.mix.length) {
    box.appendChild(set(el("p", "chint"),
      "No steps classified yet. Run `deno task observe-coaching` to populate them."));
    return box;
  }
  var total = coach.mix.reduce(function (n, m) { return n + m.steps; }, 0);
  var blind = coach.mix.reduce(function (n, m) { return n + (m.steps - m.observable); }, 0);
  var share = total ? Math.round(1000 * blind / total) / 10 : 0;

  var warn = el("div", "cbudget" + (share > 15 ? " over" : ""));
  warn.innerHTML = "<b>" + share + "%</b> of recommendations have no observable signal " +
    "(budget 15%). " + (share > 15
      ? "Over budget — the prompt is producing advice that cannot be evaluated. That is a prompt " +
        "problem to fix, not an agent problem to chase."
      : "Within budget.");
  box.appendChild(warn);

  var t = document.createElement("table");
  t.className = "ctable";
  t.innerHTML = "<thead><tr><th>Step type</th><th>Steps</th><th>Observable</th>" +
    "<th>Followed</th><th>Signal</th></tr></thead>";
  var tb = document.createElement("tbody");
  coach.mix.forEach(function (m) {
    var tr = document.createElement("tr");
    tr.appendChild(set(document.createElement("td"), m.step_type));
    tr.appendChild(set(document.createElement("td"), String(m.steps)));
    tr.appendChild(set(document.createElement("td"), String(m.observable)));
    tr.appendChild(set(document.createElement("td"),
      m.observable ? (m.followed + (m.followed_pct != null ? " (" + m.followed_pct + "%)" : "")) : "—"));
    var sig = document.createElement("td");
    // internal_check has no system signal BY DESIGN — it is not a missing
    // integration, and labelling it "not connected" invites someone to go and
    // connect something.
    sig.appendChild(m.observable
      ? tag("observable", "p-yes")
      : m.step_type === "internal_check"
      ? tag("no signal by design", "p-na")
      : tag("not connected", "p-na"));
    tr.appendChild(sig);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  box.appendChild(t);
  return box;
}

    td4.appendChild(r.observable === true

  }
  // status null = "just save my edits" — the RPC then leaves the status and the
  // approver stamp alone, so fixing a typo on an approved article cannot silently
  // unapprove it or overwrite who signed off.
  async function save(status) {
    st.textContent = "Sparar…";
    try {
      var res = await api("/rest/v1/rpc/review_kb_article", {
        method: "POST",
        body: JSON.stringify({
          p_article_id: a.article_id,
          p_status: status || null,
          p_title: titleIn.value.trim(),
          p_summary: summaryIn.value.trim(),
          p_steps: lines(stepsIn),
          p_notes: lines(notesIn),
        }),
      });
      if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
      var out = await res.json(), saved = out && out[0];
      a.title = titleIn.value.trim(); a.summary = summaryIn.value.trim();
      a.steps = lines(stepsIn); a.notes = lines(notesIn);
      if (saved) {
        a.status = saved.status;
        a.reviewed_by = saved.reviewed_by; a.reviewed_at = saved.reviewed_at;
        a.updated_at = saved.updated_at;
      }
      st.textContent = status === "approved" ? "godkänd — klar att publiceras för hand"
        : status === "rejected" ? "avvisad" : "sparat";
      render();
    } catch (e) { st.textContent = "kunde inte spara: " + e.message; }
  }

  function button(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn small" + (cls ? " " + cls : "");
    b.textContent = label; b.onclick = fn; btns.appendChild(b);
  }
  // "Spara" keeps the article where it is — editing an approved article must not
  // unapprove it, nor rewrite who approved it (the RPC only stamps on a decision).
  button("Spara", "", function () { save(null); });
  if (a.status !== "approved") button("Godkänn", "sel", function () { save("approved"); });
  if (a.status !== "rejected") button("Avvisa", "", function () { save("rejected"); });
  card.appendChild(btns);
  card.appendChild(st);
  card.appendChild(articleTrace(a));
  return card;
}

// The traceability line. An article outlives the ticket it came from, so where it
// came from has to travel with it.
function articleTrace(a) {
  var d = document.createElement("details");
  d.className = "arttrace";
  var sum = document.createElement("summary");
  sum.textContent = "Ursprung och historik";
  d.appendChild(sum);
  var body = el("div", "qabody");

  function line(label, value) {
    if (!value) return;
    var row = el("div", "qarow");
    row.appendChild(set(el("span", "qn"), label));
    row.appendChild(set(el("span", "qr"), String(value)));
    body.appendChild(row);
  }
  line("Ärende", "#" + a.ticket_id + (a.ticket_subject ? " — " + a.ticket_subject : ""));
  line(
    "Skriven utifrån",
    a.resolution_source === "gold_answer"
      ? "en granskares idealsvar (guldstandard)"
      : a.resolution_source === "agent_reply"
      ? "svaret agenten faktiskt skickade"
      : "",
  );
  line("AI:ns förslag", a.proposed_title);
  line("Varför", a.proposed_reason || a.gap_filled);
  line("Borttagna kunduppgifter",
    (a.removed_specifics || []).length ? a.removed_specifics.join(", ") : "");
  line("Begärd av", a.requested_by + (a.requested_at ? " · " + fmtDate(a.requested_at) : ""));
  line("Utkast skrivet", a.drafted_at ? fmtDate(a.drafted_at) : "");
  line("Beslut", a.reviewed_by ? a.reviewed_by + " · " + fmtDate(a.reviewed_at) : "");
  line("Senast ändrad", a.updated_at ? fmtDate(a.updated_at) : "");
  line("Version", [a.article_version, a.model].filter(Boolean).join(" · "));
  d.appendChild(body);
  return d;
}

function fmtDate(iso) {
  try { return new Date(iso).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" }); }
  catch (_e) { return iso; }
}

// ── KB article (2026-08-03) ─────────────────────────────────────────────────
//
// Gate 1's root cause was knowledge nobody wrote down, so the loop closes here:
// the AI FLAGS a ticket whose answer would generalise, the reviewer decides, and
// a separate job drafts the article from a resolution a HUMAN stood behind (an
// ideal answer, or the reply that was actually sent) — never from the AI's own
// draft. Nothing is published anywhere; approved articles are exported for a
// human to paste into the help centre.
function articlePanel(r) {
  var opp = r.article_opportunity || {};
  var proposed = opp.worth_writing === true && opp.proposed_title;
  var existing = articlesByTicket[r.ticket_id];

  // Nothing to show unless the AI proposed one or somebody already asked — the
  // reviewer's screen is for judging replies first.
  if (!proposed && !existing) return el("div", "arthidden");

  var box = el("div", "artbox");
  var head = el("div", "arthead");
  head.appendChild(set(el("span", "sl"), "📝 Kunskapsartikel"));
  if (existing) head.appendChild(tag(ART_LABEL[existing.status] || existing.status, "a-" + existing.status));
  box.appendChild(head);

  if (proposed && !existing) {
    box.appendChild(set(el("div", "artprop"), "Förslag: \u201d" + opp.proposed_title + "\u201d"));
    if (opp.reason) box.appendChild(set(el("div", "artwhy"), opp.reason));
  }

  var st = el("span", "st"); st.setAttribute("aria-live", "polite");

  // The drafted article, if the writer has run. Editable — the reviewer's words win.
  var titleIn, summaryIn, stepsIn;
  if (existing && existing.status !== "requested") {
    if (existing.publishable === false) {
      box.appendChild(set(el("div", "artblocked"),
        "Kunde inte skrivas: " + (existing.blocked_reason || "okänd orsak")));
    } else {
      titleIn = document.createElement("input");
      titleIn.type = "text"; titleIn.className = "arttitle";
      titleIn.setAttribute("aria-label", "Artikelrubrik för ticket " + r.ticket_id);
      titleIn.value = existing.title || "";
      box.appendChild(titleIn);

      summaryIn = document.createElement("textarea");
      summaryIn.className = "artsum"; summaryIn.rows = 2;
      summaryIn.setAttribute("aria-label", "Artikelsammanfattning för ticket " + r.ticket_id);
      summaryIn.value = existing.summary || "";
      box.appendChild(summaryIn);

      stepsIn = document.createElement("textarea");
      stepsIn.className = "artsteps"; stepsIn.rows = 4;
      stepsIn.placeholder = "Ett steg per rad";
      stepsIn.setAttribute("aria-label", "Artikelsteg för ticket " + r.ticket_id);
      stepsIn.value = (existing.steps || []).join("\n");
      box.appendChild(stepsIn);

      // What the writer says it stripped. Shown because an article that silently
      // kept a customer name is a data-protection problem, not a style one.
      if ((existing.removed_specifics || []).length) {
        box.appendChild(set(el("div", "artwhy"),
          "Borttagna kunduppgifter: " + existing.removed_specifics.join(", ")));
      }
    }
  }

  var btns = el("div", "artbtns");
  function button(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn small" + (cls ? " " + cls : "");
    b.textContent = label; b.onclick = fn; btns.appendChild(b); return b;
  }

  if (!existing || existing.status === "rejected" || existing.status === "failed") {
    button("Skriv en artikel av detta", "", async function () {
      st.textContent = "Sparar…";
      try {
        var res = await api("/rest/v1/rpc/request_kb_article", {
          method: "POST",
          body: JSON.stringify({ p_ticket_id: r.ticket_id, p_generation_id: r.id }),
        });
        if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
        var out = await res.json(), saved = out && out[0];
        if (saved) {
          var row = { article_id: saved.article_id, ticket_id: r.ticket_id, status: saved.status,
                      steps: [], notes: [], removed_specifics: [] };
          articlesByTicket[r.ticket_id] = row; articles.unshift(row);
        }
        st.textContent = "i kö — artikeln skrivs vid nästa körning";
        btns.innerHTML = "";
      } catch (e) { st.textContent = "kunde inte spara: " + e.message; }
    });
  } else if (existing.status === "drafted" && existing.publishable !== false) {
    async function review(status) {
      st.textContent = "Sparar…";
      try {
        var body = { p_article_id: existing.article_id, p_status: status };
        if (status === "approved") {
          body.p_title = titleIn ? titleIn.value.trim() : null;
          body.p_summary = summaryIn ? summaryIn.value.trim() : null;
          body.p_steps = stepsIn
            ? stepsIn.value.split("\n").map(function (x) { return x.trim(); })
                .filter(function (x) { return x; })
            : null;
        }
        var res = await api("/rest/v1/rpc/review_kb_article", {
          method: "POST", body: JSON.stringify(body),
        });
        if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
        existing.status = status;
        st.textContent = status === "approved" ? "godkänd — klar att publiceras" : "avvisad";
        btns.innerHTML = "";
      } catch (e) { st.textContent = "kunde inte spara: " + e.message; }
    }
    button("Godkänn", "sel", function () { review("approved"); });
    button("Avvisa", "", function () { review("rejected"); });
  } else if (existing.status === "requested") {
    box.appendChild(set(el("div", "artwhy"), "I kö — artikeln skrivs vid nästa körning."));
  }

  box.appendChild(btns);
  box.appendChild(st);
  return box;
}

var ART_LABEL = {
  requested: "i kö", drafted: "utkast klart", approved: "godkänd",
  rejected: "avvisad", failed: "misslyckades",
};

// ── Agent note (2026-08-04) — a tab of its own ──────────────────────────────
//
// TWO DIFFERENT JOBS, kept apart on purpose:
//
//   To review / Judged / Rewrite  →  TRAINING THE AI. A reviewer judges the
//                                    draft and writes the ideal answer. Dense,
//                                    full of metadata, built for judging.
//   🤝 Agent note                 →  COACHING THE AGENT. What the agent reads
//                                    on the ticket to do their job. Calm, scannable,
//                                    no evaluation controls at all.
//
// Merging them would make each worse: the reviewer loses the metadata they judge
// on, and the agent gets a judging tool when they wanted an answer. So this tab
// carries NO verdict buttons — recording a verdict is training, and it lives in
// the other tabs.
//
// Freshdesk itself keeps the plain HTML note; its sanitiser strips most styling,
// so this and the posted note deliberately differ.

var NOTE_MODE = {
  REPLY_READY: { cls: "", badge: "Ready to send" },
  COACH_AGENT: { cls: "amber", badge: "Check before replying" },
  AGENT_ACTION_REQUIRED: { cls: "red", badge: "Action required first" },
};

// Confidence as a five-bar meter. Grounding verification counts against it: an
// asserting draft that never resolved a source is not a confident answer, it is
// a confident-sounding one.
function confBars(r) {
  if (r.confidence === "high") return r.grounding_verified === false ? 3 : 4;
  if (r.confidence === "low") return 2;
  return 0;
}
function confWord(r) {
  if (r.confidence === "high") {
    return r.grounding_verified === false ? "Confident, sources unverified" : "Grounded";
  }
  if (r.confidence === "low") return "Partly grounded";
  return "Not grounded";
}

// Which match tier found the CRM account, and how far to trust it.
var NV_MATCH_NOTE = {
  account_map: "via a verified account mapping",
  contact_email: "matched on the requester's e-mail",
  company_name: "matched via the ticket's company",
  company_name_prefix: "matched via the company name — it differs slightly, verify this is the right account",
  email_domain: "matched via the e-mail domain — verify this is the right account",
};

// ── Planhat: DEMO DATA ──────────────────────────────────────────────────────
//
// Planhat is not connected. These three cells are placeholders so the note reads
// as designed, and every one of them is visibly marked so nobody acts on them.
//
// That marking is not decoration. An agent who believes "Health: Green · CSM A.
// Beck" may decline to escalate an account that is actually at risk, or name a
// colleague who has nothing to do with the customer. A placeholder that looks
// like data is worse than an empty cell — so these are drawn muted and dashed
// with a DEMO chip, not styled to match the real ones.
//
// Flip to false the moment a Planhat client exists; the real values then flow
// through the same cells.
var PLANHAT_DEMO = true;

// Derived from the ticket id, so a given ticket always shows the SAME sample.
// Random-per-render would churn on every repaint and read as a bug.
function demoPlanhat(ticketId) {
  var n = Number(ticketId) || 0;
  var health = ["Green", "Amber", "Green", "Green", "Amber", "Red"][n % 6];
  var csm = ["A. Beck", "M. Lund", "S. Haugen", "K. Ericsson"][n % 4];
  return { health: health, csm: csm, alsoOpen: n % 4 };
}

// Rendered exactly like a real cell, by request — same rule as the Coaching
// tab: a strip that is half hatched reads as a broken strip, not a populated
// one. The disclosure is one line above the list, not a chip on every cell.
function demoCell(label, value, dotClass) {
  var cell = document.createElement("div");
  var dt = el("dt", "");
  dt.appendChild(document.createTextNode(label));
  dt.appendChild(set(el("span", "nv-demotag"), "sample"));
  cell.appendChild(dt);
  var dd = el("dd", "");
  if (dotClass) dd.appendChild(el("span", "nv-dot " + dotClass));
  dd.appendChild(document.createTextNode(value));
  cell.appendChild(dd);
  return cell;
}

// The Planhat cells, appended to whichever strip is on screen.
function appendDemoCells(strip, r) {
  if (!PLANHAT_DEMO) return;
  var d = demoPlanhat(r.ticket_id);
  strip.appendChild(demoCell("Health", d.health + " · CSM " + d.csm, d.health.toLowerCase()));
  strip.appendChild(demoCell(
    "Also open",
    d.alsoOpen ? d.alsoOpen + " ticket" + (d.alsoOpen === 1 ? "" : "s") : "none",
  ));
}

// ACCOUNT and RENEWAL come from Freshworks CRM when it matched. It is opt-in and
// currently off, so every stored lookup reads no_match — without these the strip
// collapses to two cells and stops looking like a strip at all.
//
// The account NAME is the honest gap here: the CRM client stores accountId and
// the subscriptions but never the name, so even a real match could not fill this
// cell today. Capturing it is a pipeline change, not a styling one.
function appendAccountCells(strip, r) {
  var c = r.customer_subscriptions;
  var subs = (c && Array.isArray(c.subscriptions)) ? c.subscriptions : [];

  if (c && c.status === "found" && subs.length) {
    var products = subs.map(function (x) { return x.productName; }).filter(Boolean);
    var cell = document.createElement("div");
    cell.appendChild(set(el("dt", ""), "Account"));
    cell.appendChild(set(el("dd", ""), products.join(" + ") || "—"));
    strip.appendChild(cell);

    var renew = subs.map(function (x) { return x.endDate; }).filter(Boolean)[0];
    var rc = document.createElement("div");
    rc.appendChild(set(el("dt", ""), "Renewal"));
    rc.appendChild(set(el("dd", ""), renew || subs[0].renewalStatus || "—"));
    strip.appendChild(rc);
    return;
  }
  if (!PLANHAT_DEMO) return;
  var d = demoAccount(r.ticket_id);
  strip.appendChild(demoCell("Account", d.plan));
  strip.appendChild(demoCell("Renewal", d.renewal));
}

// Same rule as demoPlanhat: derived from the ticket id, so a ticket always shows
// the same sample and a repaint never churns it.
// Deliberately plain, plainly fictional names — the point is to show the layout
// working, not to look like a real customer record. Derived from the ticket id
// so a ticket always shows the same person and a repaint never churns it.
function demoRequester(ticketId, draft) {
  var n = Number(ticketId) || 0;
  var first = [
    "Anna", "Erik", "Johanna", "Mikael", "Sofia", "Petter", "Kristin", "Lars",
  ][n % 8];
  var surnames = ["Lind", "Sandvik", "Berg", "Haugen", "Nyman", "Dahl", "Aas", "Wikström"];
  var companies = [
    "Nordvik AS", "Bergås AB", "Fjordkraft Nord AS", "Lindqvist Group AB",
    "Sundby Industri AS", "Kvist & Sønner AS",
  ];
  // If the draft greets the customer by name, use THAT first name. It is already
  // on the card two inches below, so this exposes nothing new — and a header
  // reading "Anna Lind" above a reply opening "Hej Kari!" would make the sample
  // look broken rather than illustrative.
  var greeted = /^\s*(?:hej|hei|hi|hello|hallå|god dag)\s+([A-Za-zÅÄÖÆØåäöæø][\wÅÄÖÆØåäöæø'’-]{1,20})/i
    .exec(draft || "");
  if (greeted) first = greeted[1].replace(/[,!.]+$/, "");
  return {
    name: first + " " + surnames[n % surnames.length],
    company: companies[n % companies.length],
  };
}

function demoAccount(ticketId) {
  var n = Number(ticketId) || 0;
  var plan = ["One + Survey", "One", "One + Expert", "One + Survey + Expert"][n % 4];
  var year = 2027 + (n % 2);
  var month = ["14 Mar", "1 Jun", "30 Sep", "14 Mar", "22 Jan", "9 Nov"][n % 6];
  return { plan: plan, renewal: month + " " + year };
}

// Every CRM outcome renders, not only the happy one. "Found nothing" and
// "several accounts match" are the cases the agent most needs to act on.
function crmStripEl(r) {
  var c = r.customer_subscriptions;

  // With no real CRM answer we still show the strip, so the layout holds — but
  // it is then demo cells ONLY, and says so.
  function demoOnlyStrip(note) {
    var box = el("div", "nv-crm");
    var strip = el("div", "nv-cust");
    appendAccountCells(strip, r);
    appendDemoCells(strip, r);
    if (strip.children.length) box.appendChild(strip);
    // The "we found nothing" line is worth saying when the strip is empty and
    // misleading under a strip that is visibly full. Ambiguity still speaks up
    // below — that one an agent has to act on.
    else box.appendChild(set(el("div", "nv-matched"), note));
    return box;
  }

  if (!c) return demoOnlyStrip("No CRM lookup for this ticket.");
  if (c.status === "unavailable") {
    return demoOnlyStrip("📦 CRM temporarily unavailable — check it manually.");
  }
  if (c.status === "no_match") {
    return demoOnlyStrip(
      "📦 No CRM account matched. Not necessarily an error — the customer may not be linked.");
  }
  if (c.status === "ambiguous") {
    var cands = Array.isArray(c.candidates)
      ? c.candidates.filter(function (n) { return typeof n === "string" && n.trim(); })
      : [];
    return set(el("div", "nv-warn"),
      "⚠️ Several similar CRM accounts match — check the CRM yourself before relying on this." +
      (cands.length ? " Candidates: " + cands.join(" · ") + "." : ""));
  }

  var subs = Array.isArray(c.subscriptions) ? c.subscriptions : [];
  if (!subs.length) return demoOnlyStrip("📦 Account matched, but it holds no subscriptions.");

  var box = el("div", "nv-crm");
  var strip = el("div", "nv-cust");
  // appendAccountCells already condenses the subscriptions into Account +
  // Renewal, as the design does. A cell per subscription on top of that repeated
  // the same products twice in one strip.
  appendAccountCells(strip, r);
  appendDemoCells(strip, r);
  box.appendChild(strip);
  if (c.matchedBy && NV_MATCH_NOTE[c.matchedBy]) {
    box.appendChild(set(el("div", "nv-matched"), "Account " + NV_MATCH_NOTE[c.matchedBy] + "."));
  }
  return box;
}

// Jira and Linear rows, so the design's per-system tags are visible. Neither
// system has a client here, so these are sample rows and chipped as such.
//
// TWO JUDGEMENT CALLS worth stating:
//
//  - They are STATUS statements ("an issue exists", "a request is open"), never
//    product facts. A sampled renewal date is a low-risk placeholder; a sampled
//    "here is how the product behaves" is precisely the Gate 1 failure mode —
//    asserting something with nothing behind it — and an agent could send it.
//  - Confluence is NOT sampled, though the tag renders if such a source ever
//    appears. CLAUDE.md records that the Atlassian wiki is an internal
//    engineering space with no customer-facing content, so a Confluence fact
//    would contradict a decision already taken rather than preview a future one.
function appendSampleSystemFacts(list, r) {
  if (!PLANHAT_DEMO) return;
  var n = Number(r.ticket_id) || 0;
  var rows = [
    { kind: "jira", hit: n % 3 === 0,
      text: n % 3 === 0
        ? "Open issue touching this area — TIMEPLAN-" + (4100 + (n % 60)) + "."
        : "No open issue matches this ticket's topic." },
    { kind: "linear", hit: n % 2 === 0,
      text: n % 2 === 0
        ? "Request open — " + (1 + (n % 5)) + " customers asking. No committed date."
        : "No product request covers this." },
  ];
  rows.forEach(function (row) {
    var li = document.createElement("li");
    var tag = el("span", "nv-src" + (row.hit ? " hit" : ""));
    tag.appendChild(document.createTextNode(sourceTag(row.kind)));
    li.appendChild(tag);
    var txt = el("span", "nv-fact");
    txt.appendChild(document.createTextNode(row.text));
    txt.appendChild(set(el("span", "nv-demotag"), "sample"));
    li.appendChild(txt);
    list.appendChild(li);
  });
}

function noteViewEl(r) {
  var mode = NOTE_MODE[r.coach_mode] || NOTE_MODE.COACH_AGENT;
  var wrap = el("div", "nv");

  // ── the ticket, above the note ──
  //
  // The design leads with WHO is asking, because that is what an agent reads
  // first. Requester name and company are not stored on `suggestions` — and the
  // CRM client keeps accountId and the subscriptions but never the account name
  // — so the name line is sample data, chipped as such.
  //
  // The real identifiers do not disappear: the ticket id (linked) and subject
  // move to the line below, so a reviewer can still find the actual ticket. A
  // sampled name that displaced the real reference would be a trap.
  var tk = el("div", "nv-ticket");
  var who = el("div", "nv-who");
  if (PLANHAT_DEMO) {
    var person = demoRequester(r.ticket_id, r.draft);
    var nameEl = el("span", "nv-subj");
    nameEl.appendChild(document.createTextNode(person.name + " · " + person.company));
    nameEl.appendChild(set(el("span", "nv-demotag"), "sample"));
    who.appendChild(nameEl);
  } else {
    who.appendChild(set(el("span", "nv-subj"), r.subject || "(no subject)"));
  }
  tk.appendChild(who);

  var meta = el("div", "nv-meta");
  var a = document.createElement("a");
  a.className = "nv-id"; a.target = "_blank"; a.rel = "noopener";
  a.href = r.ticket_url || ("https://simployer.freshdesk.com/a/tickets/" + r.ticket_id);
  a.textContent = "#" + r.ticket_id;
  meta.appendChild(a);
  meta.appendChild(document.createTextNode(" · " + [
    PLANHAT_DEMO ? (r.subject || "(no subject)") : null,
    "Freshdesk", (r.language || "").toUpperCase(), r.ticket_type,
    r.created_at ? fmtDate(r.created_at) : "",
  ].filter(Boolean).join(" · ")));
  tk.appendChild(meta);

  var cust = (r.customer_message && r.customer_message.trim())
    ? r.customer_message
    : (Array.isArray(r.questions) && r.questions.length ? r.questions.join("\n") : "");
  if (cust.trim()) {
    var body = el("div", "nv-body");
    body.appendChild(conversationEl(r));
    tk.appendChild(body);
  }
  wrap.appendChild(tk);

  // ── the note ──
  var note = el("div", "nv-note");
  note.appendChild(el("div", "nv-rail" + (mode.cls ? " " + mode.cls : "")));
  var inner = el("div", "nv-inner");

  var head = el("div", "nv-head");
  head.appendChild(set(el("span", "nv-mode" + (mode.cls ? " " + mode.cls : "")), mode.badge));
  var conf = el("span", "nv-conf");
  conf.appendChild(document.createTextNode(confWord(r)));
  var bars = el("span", "nv-bars" + (mode.cls ? " " + mode.cls : ""));
  var filled = confBars(r);
  for (var i = 0; i < 5; i++) bars.appendChild(el("i", i < filled ? "on" : ""));
  conf.appendChild(bars);
  head.appendChild(conf);

  var stamp = [];
  if (r.latency_ms) stamp.push("drafted in " + Math.round(r.latency_ms / 1000) + "s");
  var nSrc = Array.isArray(r.sources) ? r.sources.length : 0;
  stamp.push(nSrc + " source" + (nSrc === 1 ? "" : "s") + " checked");
  head.appendChild(set(el("span", "nv-stamp"), stamp.join(" · ")));
  inner.appendChild(head);

  inner.appendChild(crmStripEl(r));

  // ── what we know ──
  // Only systems that actually answered get a chip. A system with no client is
  // absent entirely: "we looked and found nothing" and "we cannot look" are
  // different claims, and the agent acts differently on each.
  if (nSrc) {
    inner.appendChild(set(el("h4", "nv-h"), "What we know"));
    var facts = el("ul", "nv-facts");
    r.sources.forEach(function (src) {
      var li = document.createElement("li");
      li.appendChild(set(el("span", "nv-src hit"), sourceTag(src.kind)));
      var txt = el("span", "nv-fact");
      var link = document.createElement("a");
      link.href = src.url || "#"; link.target = "_blank"; link.rel = "noopener";
      link.textContent = src.title || ("#" + src.id);
      txt.appendChild(link);
      if (src.publicUrl) {
        txt.appendChild(document.createTextNode(" · "));
        var pub = document.createElement("a");
        pub.href = src.publicUrl; pub.target = "_blank"; pub.rel = "noopener";
        pub.className = "nv-send";
        pub.textContent = "send to customer";
        txt.appendChild(pub);
      }
      li.appendChild(txt);
      facts.appendChild(li);
    });
    appendSampleSystemFacts(facts, r);
    inner.appendChild(facts);
  } else {
    var only = el("ul", "nv-facts");
    appendSampleSystemFacts(only, r);
    if (only.children.length) inner.appendChild(only);
    inner.appendChild(set(el("div", "nv-quiet"),
      "No sources found — possible knowledge-base gap."));
  }

  // ── suggested reply ──
  if (r.draft && r.draft.trim()) {
    var h = el("h4", "nv-h");
    h.appendChild(document.createTextNode("Suggested reply"));
    h.appendChild(set(el("span", "nv-lang"), (r.language || "").toUpperCase()));
    inner.appendChild(h);
    var d = el("div", "nv-draft");
    d.appendChild(proseEl(r.draft));
    inner.appendChild(d);
  } else {
    inner.appendChild(set(el("div", "nv-quiet"),
      "No send-ready reply — the coach abstained and handed the judgement back to you."));
  }

  // ── do this first ──
  var steps = Array.isArray(r.resolution_steps) ? r.resolution_steps : [];
  if (steps.length) {
    inner.appendChild(set(el("h4", "nv-h"), "Do this first"));
    var sl = el("ul", "nv-facts");
    steps.forEach(function (st, i) {
      var li = document.createElement("li");
      li.appendChild(set(el("span", "nv-src"), "Step " + (i + 1)));
      li.appendChild(set(el("span", "nv-fact"), st));
      sl.appendChild(li);
    });
    inner.appendChild(sl);
  }

  if (r.agent_analysis && r.agent_analysis.trim()) {
    inner.appendChild(set(el("h4", "nv-h"), "Read of the situation"));
    inner.appendChild(set(el("div", "nv-analysis"), r.agent_analysis));
  }

  inner.appendChild(noteActionsEl(r));

  note.appendChild(inner);
  wrap.appendChild(note);
  return wrap;
}

// The action row from the design. THREE OF THE FOUR ARE INERT, deliberately and
// visibly: this app is read-only + RLS, and sending a customer reply or writing
// to Linear would be new external writes that CLAUDE.md §3 deliberately does not
// have. Rendering live-looking buttons that quietly do nothing is worse than
// rendering none, so they are disabled and the row says why in one line.
//
// "Wrong — tell us why" DOES act: judging a draft is a thing this app really
// does, so it jumps to the ticket in To review, where the verdict is recorded.
function noteActionsEl(r) {
  var box = el("div", "");
  var row = el("div", "nv-actions");

  function btn(label, cls) {
    var b = document.createElement("button");
    b.className = "nv-btn" + (cls ? " " + cls : "");
    b.textContent = label;
    b.disabled = true;
    b.title = "Preview only — this app never writes to Freshdesk or Linear.";
    return b;
  }
  row.appendChild(btn("Send reply", "primary"));
  row.appendChild(btn("Edit first"));
  row.appendChild(btn("Add to Linear request"));

  var wrong = document.createElement("button");
  wrong.className = "nv-wrong";
  wrong.textContent = "Wrong — tell us why";
  wrong.onclick = function () {
    // The one real action: go and judge it.
    tab = "todo";
    search = String(r.ticket_id);
    render();
    window.scrollTo(0, 0);
  };
  row.appendChild(wrong);
  box.appendChild(row);

  box.appendChild(set(el("p", "nv-preview"),
    "Send / Edit / Linear are a preview of the in-Freshdesk widget — this review app " +
    "never writes to Freshdesk or Linear. \u201CWrong\u201D opens the ticket in To review."));
  return box;
}

function noteControlsEl() {
  var box = el("div", "controls");
  var inp = document.createElement("input");
  inp.type = "search"; inp.className = "search";
  inp.placeholder = "Sök ticket, ämne eller svar…";
  inp.setAttribute("aria-label", "Search notes");
  inp.value = search;
  inp.oninput = function () { search = inp.value; renderList(); };
  box.appendChild(inp);
  return box;
}

function renderAgentNotes() {
  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";
  cardEls = []; activeIdx = -1;

  var q = search.trim().toLowerCase();
  var list = rows.filter(function (r) {
    if (r.prompt_version === "agent-scan") return false; // history scans carry no note
    if (!q) return true;
    return (String(r.ticket_id) + " " + (r.subject || "") + " " + (r.draft || ""))
      .toLowerCase().indexOf(q) >= 0;
  });

  var intro = el("div", "nv-intro");
  intro.innerHTML = "This is the private note as the <b>agent</b> reads it on the ticket — " +
    "coaching, not evaluation. Judging a draft and writing the ideal answer happen in " +
    "<b>To review</b>; nothing here records a verdict." +
    (PLANHAT_DEMO
      // The cells are no longer chipped individually, so this line is the only
      // disclosure — it has to name every field it covers.
      ? " Fields chipped <b>sample</b> are placeholder data — the requester name and " +
        "company, and the account, renewal, health, CSM and open-ticket cells. Those are " +
        "not stored or not connected, so they are illustrative and must not be acted on. " +
        "The ticket id, subject, customer message, sources and draft are all real."
      : "");
  lw.appendChild(intro);

  if (!list.length) {
    lw.appendChild(set(el("div", "empty"), "Nothing matches."));
    return;
  }
  list.forEach(function (r) { lw.appendChild(noteViewEl(r)); });
}

// QA score → colour band: red < 60, amber 60-74, green 75+ (or red if flagged).
function qaCls(score, needsReview) {
  return (needsReview || score < 60) ? "bad" : score < 75 ? "c-low" : "c-high";
}
// Coach mode (Fas 3) → short label + colour class.
function modeLabel(m) {
  return m === "REPLY_READY" ? "🟢 Reply ready"
    : m === "AGENT_ACTION_REQUIRED" ? "🔴 Action required"
    : "🟡 Coach";
}
function modeCls(m) {
  return m === "REPLY_READY" ? "m-ready" : m === "AGENT_ACTION_REQUIRED" ? "m-action" : "m-coach";
}
// QA-coach breakdown: an expandable per-criterion 1–5 table + top improvements.
function qaDetailsEl(a, label) {
  var d = document.createElement("details");
  var sum = document.createElement("summary");
  sum.textContent = label + (a.totalScore != null ? " · " + a.totalScore + "/100" : "") + (a.verdict ? " " + a.verdict : "");
  d.appendChild(sum);
  var body = el("div", "qabody");
  for (var i = 0; i < a.scorecard.length; i++) {
    var c = a.scorecard[i];
    var row = el("div", "qarow");
    var sc = el("span", "qs s" + (c.score || 0)); sc.textContent = (c.score != null ? c.score : "–") + "/5";
    row.appendChild(sc);
    row.appendChild(set(el("span", "qn"), c.criterion || c.criterionId || "—"));
    if (c.rationale) row.appendChild(set(el("span", "qr"), c.rationale));
    body.appendChild(row);
  }
  if (Array.isArray(a.topThreeImprovements) && a.topThreeImprovements.length) {
    var imp = el("div", "qaimp");
    imp.appendChild(set(el("span", "qn"), "Top improvements:"));
    var ul = document.createElement("ul");
    a.topThreeImprovements.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
    imp.appendChild(ul); body.appendChild(imp);
  }
  d.appendChild(body); return d;
}
function tag(text, cls) { return set(el("span", "tag" + (cls ? " " + cls : "")), esc(text)); }
function set(node, text) { node.textContent = text; return node; }
function el(t, cls) { var e = document.createElement(t); if (cls) e.className = cls; return e; }
</script>
</body>
