<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Review — Simployer Gate 1</title>
<style>
  /* ── ONE palette (2026-08-05) ────────────────────────────────────────────
     The private note's design is now the standard for the whole app, per
     Tobias. It previously had its own --nv-* palette, on the reasoning that
     training the AI and coaching the agent are different jobs and restyling
     one must not disturb the other. That separation of FUNCTION stands — they
     are still separate tabs. The separation of visual LANGUAGE does not: two
     palettes in one app read as two half-finished apps.

     The design statement is the three-state scale. Positive is the TEAL, not a
     separate green: "ready to send" and "grounded" are the same signal as the
     primary action, so they are the same colour. Amber is burnt rather than
     yellow, red is brick rather than crimson — both readable on paper, neither
     shouting.

     The --nv-* names are kept as ALIASES rather than search-replaced, so the
     note's ~60 rules keep reading in their own vocabulary and a future
     re-divergence is one block of edits, not sixty. */
  :root{
    --ink:#16232E;--ink-2:#41535F;--ink-3:#7B8C96;
    --bg:#EDF1F2;--surface:#FFFFFF;--surface-2:#F1F5F5;--border:#E2E8EA;
    --accent:#0F7173;--accent-soft:#E4EFEF;--accent-edge:#BFD8D8;
    /* good IS the accent teal — see above */
    --good:#0F7173;--good-soft:#E4EFEF;
    --warn:#B45A09;--warn-soft:#FBEDDD;
    --crit:#9E3227;--crit-soft:#F8E6E3;
    --info:#5B7089;
    /* The one thing that stays specific to a note: the warm paper that makes it
       read as a NOTE rather than as another panel of the review tool. */
    --paper-warm:#FFFDF4;--paper-warm-edge:#F0E4C3;
    --bar-off:#D8E1E3;
    /* Text on a solid teal/amber/red fill. White in light mode; in dark the
       accents are bright enough that white on them is unreadable, so it flips
       to the page ink. One token, so every solid badge and button flips with
       it instead of each being remembered separately. */
    --on-solid:#fff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --radius:8px;--shadow:0 1px 2px rgba(22,35,46,.05),0 4px 16px rgba(22,35,46,.05);

    --nv-ink:var(--ink);--nv-ink-2:var(--ink-2);--nv-ink-3:var(--ink-3);
    --nv-rule:var(--border);--nv-paper:var(--surface);--nv-canvas:var(--bg);
    --nv-note:var(--paper-warm);--nv-note-edge:var(--paper-warm-edge);
    --nv-teal:var(--accent);--nv-teal-soft:var(--accent-soft);--nv-teal-edge:var(--accent-edge);
    --nv-amber:var(--warn);--nv-amber-soft:var(--warn-soft);
    --nv-red:var(--crit);--nv-red-soft:var(--crit-soft);
    --nv-bar:var(--bar-off);
  }
  @media(prefers-color-scheme:dark){:root{
    --ink:#E8EDF1;--ink-2:#A5B2BD;--ink-3:#7C8B96;
    --bg:#0E1319;--surface:#151C24;--surface-2:#1C252F;--border:#2A3540;
    --accent:#4FD1C5;--accent-soft:#123A38;--accent-edge:#1C4C49;
    --good:#4FD1C5;--good-soft:#123A38;
    --warn:#E0A64B;--warn-soft:#33280F;
    --crit:#E86B5C;--crit-soft:#38191A;
    --info:#8AA0B5;
    /* Warm-TINTED panel rather than the literal cream. A #FFFDF4 slab in dark
       mode is a torch, not a note — the warmth carries the design across, not
       the exact hex. */
    --paper-warm:#1B1E1C;--paper-warm-edge:#3A3524;
    --bar-off:#2A3540;
    --on-solid:#0E1319;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-variant-numeric:tabular-nums}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-size:22px;margin:2px 0 0;letter-spacing:-.02em}
  .who{margin-left:auto;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:10px}
  button{font-family:inherit;cursor:pointer}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.small{padding:4px 9px;font-size:12px}
  .link{background:none;border:0;color:var(--accent);font-size:13px;padding:0;text-decoration:underline;cursor:pointer}

  .auth{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .auth h2{margin:0 0 4px;font-size:19px}
  .auth p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  input{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-solid);width:100%;padding:11px;font-size:14px}
  .btn.primary:hover{filter:brightness(1.06)}
  .msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:6px}
  .msg.ok{background:var(--good-soft);color:var(--good)}
  .msg.err{background:var(--crit-soft);color:var(--crit)}

  .help{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:0 16px;margin:16px 0 0}
  .help>summary{cursor:pointer;padding:14px 0;font-weight:650;font-size:14px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  .help>summary::-webkit-details-marker{display:none}
  .help>summary::before{content:"❔";font-size:15px}
  .help .hbody{padding:0 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .help .hbody>p{margin:0 0 6px}
  .help h4{margin:14px 0 4px;font-size:11.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .help ul{margin:2px 0;padding-left:18px}
  .help li{margin:3px 0}
  .help b{color:var(--ink)}
  .bar{display:flex;gap:8px;align-items:center;margin:18px 0 16px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
  .count{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}

  /* Every card carries the note's coloured rail. It is the design's one
     load-bearing element: the state of the thing is legible before a word is
     read, and it is the same teal/amber/red scale everywhere. */
  .card{--rail:var(--border);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:inset 5px 0 0 var(--rail),var(--shadow);
    padding:16px 18px 16px 22px;margin-bottom:14px}
  .card.m-ready{--rail:var(--accent)}
  .card.m-coach{--rail:var(--warn)}
  .card.m-action{--rail:var(--crit)}
  /* Articles use the same scale: teal = settled, amber = your decision is
     wanted, red = it went wrong. */
  .card.art.a-approved{--rail:var(--accent)}
  .card.art.a-drafted{--rail:var(--warn)}
  .card.art.a-rejected,.card.art.a-failed{--rail:var(--crit)}
  .chead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
  .chead .id{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-decoration:none}
  .chead a.id:hover{color:var(--accent);text-decoration:underline}
  .chead .subj{font-weight:650;font-size:15px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--ink-2)}
  .tag.c-high{background:var(--good-soft);color:var(--good)}
  .tag.c-low{background:var(--warn-soft);color:var(--warn)}
  .tag.c-none{background:var(--surface-2);color:var(--ink-3)}
  .tag.qa{background:var(--accent-soft);color:var(--accent)}
  .tag.review,.tag.bad{background:var(--crit-soft);color:var(--crit)}
  /* coach mode (Fas 3): green ready / amber coach / red action-required */
  .tag.m-ready,.tag.m-coach,.tag.m-action{color:var(--on-solid);font-family:var(--sans);
    font-weight:700;letter-spacing:.08em;border-radius:4px;padding:3px 9px}
  .tag.m-ready{background:var(--accent)}
  .tag.m-coach{background:var(--warn)}
  .tag.m-action{background:var(--crit)}
  /* reason-code summary on judged cards */
  .reasonline{font-size:12.5px;color:var(--warn);margin:-4px 0 12px}
  /* QA-coach per-criterion breakdown */
  .qabody{padding:4px 12px 10px}
  .qarow{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:13px;flex-wrap:wrap}
  .qarow .qn{font-weight:600;color:var(--ink)}
  .qarow .qr{color:var(--ink-2);font-size:12.5px}
  .qs{font-family:var(--mono);font-size:11.5px;font-weight:700;min-width:34px;text-align:center;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
  .qs.s1,.qs.s2{background:var(--crit-soft);color:var(--crit)}
  .qs.s3{background:var(--warn-soft);color:var(--warn)}
  .qs.s4,.qs.s5{background:var(--good-soft);color:var(--good)}
  .qaimp ul{margin:4px 0;padding-left:18px}
  .qaimp li{font-size:12.5px;color:var(--ink-2)}
  /* readable prose: real paragraphs, comfortable size, capped line length (#1) */
  .prose{font-size:15px;line-height:1.65;max-width:70ch;color:var(--ink)}
  .prose p{margin:0 0 10px;white-space:pre-wrap}
  .prose p:last-child{margin:0}
  /* customer's original question, distinct + at the top of the card (#2) */
  .custq{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--info);border-radius:6px;padding:10px 14px;margin:2px 0 12px}
  .custq .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--info);display:block;margin-bottom:6px}
  /* Key takeaways + the collapsed raw thread. */
  .tk-qs{margin:0 0 6px;padding-left:20px}
  .tk-qs li{font-size:14.5px;line-height:1.55;margin:0 0 4px;color:var(--ink)}
  .tk-fallback{margin:0 0 6px;font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
  .tk-un{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .tk-toggle{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.03em;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
  .tk-toggle:hover{text-decoration:underline}
  .tk-full{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .tk-full .prose{font-size:13.5px;color:var(--ink-2)}
  .tk-note{margin:8px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .subs{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:12px 14px;margin:0 0 12px;overflow-x:auto}
  .subs .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px}
  .subs .sstate{font-size:13.5px;color:var(--ink-2);margin:0}
  .subs table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px}
  .subs th,.subs td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
  .subs th{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
  .draftlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin:2px 0 5px}
  .draft{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:14px 16px;margin:0 0 12px}
  .refbox{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:12px 14px;margin:0 0 12px}
  .refbox .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--good);display:block;margin-bottom:6px}
  .gold{margin:2px 0 12px}
  .gold .gl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
  textarea{width:100%;min-height:88px;font-family:inherit;font-size:14.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .fmtbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
  .fbtn{font-size:12.5px;padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink);cursor:pointer}
  .fbtn:hover{border-color:var(--accent)}
  .goldedit{width:100%;min-height:88px;font-family:inherit;font-size:14.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);overflow:auto;white-space:pre-wrap}
  .goldedit:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .goldedit:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
  .goldedit ul,.goldedit ol{margin:4px 0 4px 22px;white-space:normal}
  .crmverdict{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .crmhint{flex:1 1 240px;min-width:200px;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink)}
  .crmverdict .btn.sel{outline:2px solid var(--accent)}
  /* Coaching tab (2026-08-04) — read-only measurement of the coaching half */
  .cbanner{display:flex;align-items:center;gap:9px;margin:0 0 18px;background:var(--accent-soft);
    border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12.5px;color:var(--ink)}
  .csec{margin:28px 0 10px}
  .chead{font-size:13px;font-weight:700;letter-spacing:.02em;margin:0 0 4px}
  .chint{font-size:12.5px;color:var(--ink-3);margin:0 0 12px;line-height:1.55}
  .chint.bad{color:var(--crit)}
  .ctiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .ctiles.three{grid-template-columns:repeat(3,1fr)}
  .ctile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
  .ctile.pending .cv{color:var(--ink-3)}
  .ck{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:7px}
  .cv{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .cd{font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.4}
  .ctiming{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px}
  .cbar{display:flex;height:26px;border-radius:4px;overflow:hidden;margin:4px 0 9px}
  .cbar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;color:#fff;min-width:0}
  .clegend{display:flex;gap:18px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;margin-bottom:6px}
  .clegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
  .ctable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;margin-bottom:8px}
  .ctable th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
    font-weight:650;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .ctable td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top}
  .ctable tr:last-child td{border-bottom:none}
  .ctable tr.hold{background:var(--surface-2)}
  .cstep{color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.45}
  .cmix{margin-bottom:18px}
  .cbudget{border:1px solid var(--border);border-left:3px solid var(--good);border-radius:6px;
    padding:10px 14px;margin-bottom:10px;font-size:12.5px;background:var(--surface);line-height:1.55}
  .cbudget.over{border-left-color:var(--crit)}
  .tag.p-yes{background:var(--good-soft);color:var(--good)}
  .tag.p-no{background:var(--crit-soft);color:var(--crit)}
  .tag.p-na{background:var(--surface-2);color:var(--ink-3)}
  .cfail{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--crit);
    border-radius:6px;padding:12px 14px;margin-bottom:9px}
  .cfail.late{border-left-color:var(--warn)}
  .cfail .fh{font-size:12.5px;font-weight:650;margin-bottom:4px}
  .cfail .fb{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .cfail .fm{font-size:11.5px;color:var(--ink-3);margin-top:6px}
  .cfoot{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--ink-3);line-height:1.7}
  .tag.c-meas{background:var(--accent-soft);color:var(--accent)}
  .tag.c-wait{background:var(--surface-2);color:var(--ink-3)}
  @media (max-width:880px){ .ctiles,.ctiles.three{grid-template-columns:repeat(2,1fr)} }
  /* ── Agent note tab: the private note as the agent reads it ──────────────
     Its own palette (--nv-*), because coaching an agent and training the AI are
     different jobs for different readers. */
  .nv-intro{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0 0 16px;
    padding-left:12px;border-left:2px solid var(--border)}
  .nv{margin:0 0 22px;color:var(--nv-ink)}
  .nv-ticket{background:var(--nv-paper);border:1px solid var(--nv-rule);
    border-radius:10px 10px 0 0;border-bottom:none;padding:16px 20px}
  .nv-who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .nv-id{font-family:var(--mono);font-size:12px;color:var(--nv-ink-3);text-decoration:none}
  .nv-id:hover{color:var(--nv-teal);text-decoration:underline}
  .nv-subj{font-size:13px;font-weight:650;color:var(--nv-ink)}
  .nv-meta{font-size:11.5px;color:var(--nv-ink-3);margin-top:2px}
  .nv-body{font-size:13.5px;color:var(--nv-ink-2);line-height:1.55;margin-top:10px}
  .nv-body p{margin:0 0 6px}
  .nv-body p:last-child{margin-bottom:0}
  /* The customer's own words, quoted — it is a quotation, and the marks stop it
     reading as the app's prose. */
  .nv-body.quoted p:first-child::before{content:"\201C"}
  .nv-body.quoted p:last-child::after{content:"\201D"}

  .nv-note{display:flex;background:var(--nv-note);border:1px solid var(--nv-note-edge);
    border-radius:0 0 10px 10px;box-shadow:0 1px 2px rgba(22,35,46,.05);overflow:hidden}
  .nv-rail{width:5px;flex:0 0 5px;background:var(--nv-teal)}
  .nv-rail.amber{background:var(--nv-amber)}
  .nv-rail.red{background:var(--nv-red)}
  .nv-inner{flex:1;min-width:0;padding:16px 20px 15px}

  .nv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .nv-mode{display:inline-flex;align-items:center;background:var(--nv-teal);color:var(--on-solid);
    border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
    padding:4px 9px;text-transform:uppercase}
  .nv-mode.amber{background:var(--nv-amber)}
  .nv-mode.red{background:var(--nv-red)}
  .nv-conf{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--nv-ink-2)}
  .nv-bars{display:flex;gap:2px}
  .nv-bars i{width:12px;height:5px;border-radius:1px;background:var(--nv-bar);display:block}
  .nv-bars i.on{background:var(--nv-teal)}
  .nv-bars.amber i.on{background:var(--nv-amber)}
  .nv-bars.red i.on{background:var(--nv-red)}
  .nv-stamp{margin-left:auto;font-size:11px;color:var(--nv-ink-3)}

  .nv-crm{margin-bottom:14px}
  .nv-cust{display:flex;flex-wrap:wrap;border:1px solid var(--nv-rule);
    background:var(--nv-paper);border-radius:7px;padding:2px 0}

     "WHAT WE KNOW" / "SUGGESTED REPLY" in the note are sans, 700, widely

<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>

<script>
// No external libraries and no module imports — pure fetch, so this renders and
// runs from a local file (file://) without CORS/module issues. Auth is email +
// password (no email round-trip or redirect). Security is unchanged: the anon key
// is public, and RLS lets an allowlisted reviewer read drafts + update only the
// verdict/gold_answer columns.
var SB_URL = "https://pqwnpcibymtmcpnqlkle.supabase.co";
var SB_ANON = "sb_publishable_EfplAQ5QfMOuu1Y5PWPf6g_psU9lNGA";
var TOKEN_KEY = "coach_review_token";
// Bump on each deploy so we can tell from the page which build is loaded (cache check).
var APP_VERSION = "v2026-08-05g-conversation-summary";

var app = document.getElementById("app");
var esc = function (s) { return (s == null ? "" : String(s)); };
var rows = [], tab = "todo", token = null, refreshToken = null, meEmail = null;

// Columns fetched for each suggestion (used by loadData AND single-row reloads).
var articlesByTicket = {};   // ticket_id -> the article row, for the per-card panel
var articles = [];           // every article, for the Articles tab (article_library)
// Coaching tab state. All read-only: the tab observes, it never writes anywhere.
var coach = { baselines: [], dist: [], steps: [], delivery: null, mix: [], pairing: [], failed: [], knowledge: null, loaded: false };
var COLS = "id,ticket_id,ticket_url,subject,customer_message,conversation_context,latest_unresolved_request,customer_subscriptions,ticket_type,language,confidence,coach_mode,draft,resolution_steps,grounding_verified,latency_ms,agent_analysis,rationale,sources,questions,detected_intent,qa_score,qa_verdict,qa_needs_review,qa_assessment,agent_qa_score,agent_qa_verdict,agent_qa_needs_review,agent_qa_assessment,verdict,verdict_at,verdict_by,verdict_reasons,critical_flag,review_version,agent_sent_reply,gold_answer,gold_answer_by,is_spam,crm_account_correct,crm_account_hint,article_opportunity,prompt_version,created_at";

// Why an edited/unusable reply fell short — slug + Swedish label (CLAUDE.md / plan 1.3).
var REASONS = [
  ["wrong_fact", "Felaktig fakta"], ["unfounded_assumption", "Obelagt antagande"],
  ["wrong_cause", "Felaktig problemorsak"], ["wrong_solution", "Fel lösning"],
  ["wrong_incident", "Fel incident"], ["stale_incident", "Föråldrad incidentstatus"],
  ["wrong_routing", "Fel routning"], ["missed_question", "Missad kundfråga"],
  ["missed_check", "Missad kontrollpunkt"], ["wrong_language", "Fel språk"],
  ["weak_tone", "Svag ton"], ["too_long", "För långt/otydligt"],
  ["security_privacy", "Säkerhets-/integritetsrisk"], ["should_have_abstained", "AI borde ha avstått"],
  ["attachment_unreadable", "Bilaga kunde inte granskas"], ["insufficient_source", "Otillräcklig kunskapskälla"],
];
// Severe errors — any one of these forces the verdict to unusable (enforced in the DB).
var CRITICALS = [
  ["legal_advice", "Felaktig juridisk rådgivning"], ["wrongful_deletion", "Felaktig radering"],
  ["unauthorized_access", "Obehörig åtkomst"], ["pii_risk", "Personuppgiftsrisk"],
  ["false_promise", "Felaktigt kundlöfte"], ["invented_feature", "Påhittad produktfunktion"],
];
var reasonLabel = function (slug) { for (var i = 0; i < REASONS.length; i++) if (REASONS[i][0] === slug) return REASONS[i][1]; return slug; };

// Rows with unsaved ideal-answer edits — used to warn before leaving the page.
var dirtyGold = {};
window.addEventListener("beforeunload", function (e) {
  for (var k in dirtyGold) { if (dirtyGold[k]) { e.preventDefault(); e.returnValue = ""; return ""; } }
});
// view state for search / filter / sort / keyboard (Fas 2)
var search = "", fLang = "", fType = "", fConf = "", sortBy = "newest";
var fMode = "", fCrit = "", fCohort = "";
var holdoutIds = {}; // ticket_id -> 1 for the locked holdout cohort (reviewer-readable)
var shown = [], cardEls = [], activeIdx = -1;

// Reason-code slug -> Swedish label (mirror of the write-side list) + critical labels,
// so judged cards can show back what was picked without re-opening the panel.
var REASON_LABELS = {
  wrong_fact: "Felaktig fakta", unfounded_assumption: "Obelagt antagande",
  wrong_cause: "Felaktig problemorsak", wrong_solution: "Fel lösning",
  wrong_incident: "Fel incident", stale_incident: "Föråldrad incidentstatus",
  wrong_routing: "Fel routning", missed_question: "Missad kundfråga",
  missed_check: "Missad kontrollpunkt", wrong_language: "Fel språk",
  weak_tone: "Svag ton", too_long: "För långt/otydligt",
  security_privacy: "Säkerhets-/integritetsrisk", should_have_abstained: "AI borde ha avstått",
  attachment_unreadable: "Bilaga kunde inte granskas", insufficient_source: "Otillräcklig kunskapskälla",
};
var CRITICAL_LABELS = {
  legal_advice: "Felaktig juridisk rådgivning", wrongful_deletion: "Felaktig radering",
  unauthorized_access: "Obehörig åtkomst", pii_risk: "Personuppgiftsrisk",
  false_promise: "Felaktigt kundlöfte", invented_feature: "Påhittad produktfunktion",
};
function reasonText(slug) {
  if (typeof slug === "string" && slug.indexOf("other:") === 0) return slug.slice(6);
  return REASON_LABELS[slug] || slug;
}

boot();
function boot() {
  var saved = null;
  try { saved = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (saved) {
    var o = null; try { o = JSON.parse(saved); } catch (e) {}
    if (o && o.access_token) { token = o.access_token; refreshToken = o.refresh_token || null; meEmail = o.email; return loadData(); }
  }
  renderAuth();
}

async function api(path, opts, _retried) {
  opts = opts || {};
  var headers = { apikey: SB_ANON, "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
  var res = await fetch(SB_URL + path, { method: opts.method || "GET", headers: headers, body: opts.body });
  // Access token expired? Silently renew with the refresh token and retry once, so
  // the session survives past the ~1h token lifetime — no re-typing credentials.
  if (res.status === 401 && !_retried && refreshToken) {
    if (await refresh()) return api(path, opts, true);
  }
  return res;
}

async function refresh() {
  try {
    var res = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) return false;
    var data = await res.json();
    if (!data.access_token) return false;
    token = data.access_token;
    refreshToken = data.refresh_token || refreshToken; // Supabase rotates it
    persist();
    return true;
  } catch (e) { return false; }
}

function persist() {
  try {
    localStorage.setItem(TOKEN_KEY, JSON.stringify({ access_token: token, refresh_token: refreshToken, email: meEmail }));
  } catch (e) {}
}

// ---- auth ----
function renderAuth(msg, cls) {
  app.innerHTML =
    '<div class="auth">' +
    '  <div class="eyebrow">Simployer · Gate 1</div>' +
    '  <h2>Coach review</h2>' +
    '  <p>Sign in with your agent email and password to review AI coach drafts and record your verdict.</p>' +
    '  <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@simployer.com"></div>' +
    '  <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
    '  <button class="btn primary" id="signin">Sign in</button>' +
    '  <div id="authmsg" aria-live="assertive"></div>' +
    '</div>';
  if (msg) setAuthMsg(msg, cls);
  var emEl = document.getElementById("em"), pwEl = document.getElementById("pw");
  function submit() { doLogin(emEl.value.trim(), pwEl.value); }
  document.getElementById("signin").onclick = submit;
  pwEl.onkeydown = function (e) { if (e.key === "Enter") submit(); };
}
function setAuthMsg(t, cls) {
  var m = document.getElementById("authmsg");
  if (m) m.innerHTML = '<div class="msg ' + cls + '">' + esc(t) + "</div>";
}
async function doLogin(email, password) {
  if (!email || !password) return setAuthMsg("Enter your email and password.", "err");
  setAuthMsg("Signing in…", "ok");
  try {
    var res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password }),
    });
    var data = await res.json();
    if (!res.ok) return setAuthMsg(data.error_description || data.msg || data.error || "Sign-in failed.", "err");
    token = data.access_token; refreshToken = data.refresh_token || null; meEmail = (data.user && data.user.email) || email;
    persist();
    loadData();
  } catch (e) { setAuthMsg("Network error: " + e.message, "err"); }
}
function signOut() {
  token = null; refreshToken = null; meEmail = null;
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  renderAuth();
}

// ---- data ----
async function loadData() {
  app.innerHTML = '<div class="empty">Loading tickets…</div>';
  try {
    var res = await api("/rest/v1/suggestions?select=" + COLS + "&order=created_at.desc&limit=300");
    if (res.status === 401) { signOut(); return; }
    var data = await res.json();
    if (!res.ok) {
      app.innerHTML = '<div class="empty">Couldn\'t load (' + esc((data && data.message) || res.status) +
        ").<br>If this says permission denied, your email isn't on the reviewer allowlist yet.</div>";
      return;
    }
    var all = Array.isArray(data) ? data : [];
    await loadMyReviews(all);
    // hide reviewer-flagged spam (is_spam) and any auto-reply noise the ingest missed
    rows = all.filter(function (r) { return !r.is_spam && !isSpam(r.subject); });
    await loadHoldout(); // best-effort; enables the holdout progress + filter
    await loadArticles(); // best-effort; drives the KB-article panel on each card
    var deep = (window.location.hash || "").match(/^#generation=(\d+)$/);
    if (deep) { search = deep[1]; tab = "all"; }
    render();
  } catch (e) {
    app.innerHTML = '<div class="empty">Network error: ' + esc(e.message) + "</div>";
  }
}

// Review rows are separate from immutable generations. Load the signed-in
// reviewer's own optimistic-lock version; the flattened fields on suggestions
// remain the shared/latest read projection used by the cards.
async function loadMyReviews(targetRows) {
  if (!meEmail) return;
  try {
    var res = await api(
      "/rest/v1/suggestion_reviews?select=generation_id,review_version" +
      "&reviewer_email=eq." + encodeURIComponent(meEmail.toLowerCase()),
    );
    if (!res.ok) return;
    var mine = await res.json(), versions = {};
    for (var i = 0; i < (mine || []).length; i++) {
      versions[mine[i].generation_id] = mine[i].review_version;
    }
    for (var j = 0; j < targetRows.length; j++) {
      targetRows[j].my_review_version = versions[targetRows[j].id] || 0;
    }
  } catch (e) { /* a save will surface a real access error */ }
}

// Fetch the locked holdout ticket ids (reviewer-readable per migration 27). If the
// grant/policy isn't there, this fails quietly and the holdout features stay hidden.
async function loadHoldout() {
  holdoutIds = {};
  try {
    var res = await api("/rest/v1/ticket_cohorts?select=ticket_id&cohort=eq.holdout");
    if (!res.ok) return;
    var data = await res.json();
    for (var i = 0; i < (data || []).length; i++) holdoutIds[data[i].ticket_id] = 1;
  } catch (e) { /* holdout features simply won't show */ }
}
// KB article drafts, keyed by ticket. Best-effort: RLS lets an allowlisted
// reviewer read them, and a failure here must never stop the review list loading.
async function loadArticles() {
  articlesByTicket = {}; articles = [];
  try {
    // article_library carries the provenance the tab exists to show: which ticket,
    // which human-validated resolution, who asked, who signed off.
    var res = await api("/rest/v1/article_library?select=*&limit=1000");
    if (!res.ok) return;
    var data = await res.json();
    articles = Array.isArray(data) ? data : [];
    articles.forEach(function (a) {
      a.steps = a.steps || []; a.notes = a.notes || [];
      a.removed_specifics = a.removed_specifics || [];
      articlesByTicket[a.ticket_id] = a;
    });
  } catch (_e) { /* best-effort */ }
}

// distinct non-empty values of a field across all rows, for filter dropdowns
function distinct(field) {
  var seen = {}, out = [];

    var v = rows[i][field];
    if (v && !seen[v]) { seen[v] = 1; out.push(v); }

}

// A <select> whose first option is the "all/default" label, then [value,label] pairs.
function selectEl(allLabel, opts, cur, onchange) {

  var o0 = document.createElement("option"); o0.value = ""; o0.textContent = allLabel; sel.appendChild(o0);

    if (opts[i][0] === cur) o.selected = true;

function progressEl() {
  var reviewable = rows.filter(function (r) { return r.prompt_version !== "agent-scan"; });
  var judged = reviewable.filter(function (r) { return r.verdict; }).length;
  var total = reviewable.length;
  var pct = total ? Math.round(100 * judged / total) : 0;
  // Holdout progress (the locked eval set) — the number that actually gates Gate 1.
  var hoLab = "";
  if (hasHoldout()) {
    var ho = reviewable.filter(function (r) { return holdoutIds[r.ticket_id]; });
    var hoJudged = ho.filter(function (r) { return r.verdict; }).length;
    hoLab = ' · 🔒 holdout: ' + hoJudged + " av " + ho.length + " granskade";
  }
  var box = el("div", "progress");
  box.innerHTML =
    '<span class="lab">' + judged + " av " + total + " granskade · " + pct + "%" + hoLab + "</span>" +
    '<div class="track" role="progressbar" aria-label="Judging progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="fill" style="width:' + pct + '%"></div></div>';
  return box;
}

// renderList() rebuilds ONLY the card list, applying search + filters + sort on top
// of the active tab. Called on every keystroke/filter change; leaves controls intact.
function renderList() {
  if (tab === "note") return renderAgentNotes();
  if (tab === "articles") return renderArticleList();
  if (tab === "coaching") return renderCoaching();
  var base = tabRows();
  var q = search.trim().toLowerCase();
  shown = base.filter(function (r) {
    if (fLang && r.language !== fLang) return false;
    if (fType && r.ticket_type !== fType) return false;
    if (fConf && (r.confidence || "none") !== fConf) return false;
    if (fMode && r.coach_mode !== fMode) return false;
    if (fCrit === "yes" && !(r.critical_flag && r.critical_flag.trim())) return false;
    if (fCohort === "holdout" && !holdoutIds[r.ticket_id]) return false;
    if (q) {
      var products = r.customer_subscriptions && Array.isArray(r.customer_subscriptions.subscriptions)
        ? r.customer_subscriptions.subscriptions.map(function (s) {
          return [s.productName, s.renewalStatus, s.endDate].filter(Boolean).join(" ");
        }).join(" ")
        : "";
      var hay = (String(r.id) + " " + String(r.ticket_id) + " " + (r.subject || "") + " " + (r.draft || "") + " " + (r.customer_message || "") + " " + products).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  shown.sort(sortFn);

  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";
  cardEls = []; activeIdx = -1;
  if (!shown.length) {
    var e = el("div", "empty");
    e.textContent = tab === "todo" ? "Nothing left to review 🎉" : "Nothing matches.";
    lw.appendChild(e);
    return;
  }
  for (var i = 0; i < shown.length; i++) {
    var card = cardEl(shown[i]);
    cardEls.push(card); lw.appendChild(card);
  }
}

function sortFn(a, b) {
  if (sortBy === "qa") return (a.qa_score == null ? 999 : a.qa_score) - (b.qa_score == null ? 999 : b.qa_score);
  if (sortBy === "agentqa") return (a.agent_qa_score == null ? 999 : a.agent_qa_score) - (b.agent_qa_score == null ? 999 : b.agent_qa_score);
  if (sortBy === "conf") { var rank = { high: 3, medium: 2, low: 1, none: 0 }; return (rank[b.confidence] || 0) - (rank[a.confidence] || 0); }
  return String(b.created_at || "").localeCompare(String(a.created_at || "")); // newest
}

function tabEl(id, label, n) {
  var b = el("button", "tab" + (tab === id ? " on" : ""));
  b.textContent = label + " · " + n;
  b.onclick = function () { tab = id; render(); };
  return b;
}

// ---- keyboard navigation (#4): j/k move, u/e/n verdict, g focus ideal answer ----
function setActive(idx) {
  if (activeIdx >= 0 && cardEls[activeIdx]) cardEls[activeIdx].classList.remove("active");
  activeIdx = idx;
  var c = cardEls[activeIdx];
  if (c) { c.classList.add("active"); c.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function moveActive(delta) {
  if (!cardEls.length) return;
  var next = activeIdx < 0 ? 0 : activeIdx + delta;
  if (next < 0) next = 0;
  if (next > cardEls.length - 1) next = cardEls.length - 1;
  setActive(next);
}
document.addEventListener("keydown", function (e) {
  if (!token || !shown.length) return;
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
  else if (k === "u" || k === "e" || k === "n") {
    if (activeIdx < 0) return;
    var v = k === "u" ? "usable" : k === "e" ? "edited" : "unusable";
    var c = cardEls[activeIdx];
    e.preventDefault(); if (c && c._setVerdict) c._setVerdict(v);
  } else if (k === "g") {
    if (activeIdx < 0) return;
    var ta = cardEls[activeIdx].querySelector(".goldedit") ||
      cardEls[activeIdx].querySelector("textarea");
    if (ta) { e.preventDefault(); ta.focus(); }
  }
});

function cardEl(r) {

  tags.appendChild(tag(r.prompt_version || ""));

  card.appendChild(tags);

  // Reason-code summary on judged cards — scannable in the Judged tab without
  // re-opening the reasons panel.
  if (r.verdict && ((Array.isArray(r.verdict_reasons) && r.verdict_reasons.length) || r.critical_flag)) {
    var parts = (r.verdict_reasons || []).map(reasonText);
    var rl = el("div", "reasonline");
    rl.textContent = "Skäl: " + (r.critical_flag ? "⚠ " + (CRITICAL_LABELS[r.critical_flag] || r.critical_flag) + (parts.length ? " · " : "") : "") + parts.join(" · ");
    card.appendChild(rl);
  }

  // #2 — the customer's actual question, at the top, distinct from the AI draft.
  var custText = (r.customer_message && r.customer_message.trim())
    ? r.customer_message
    : (Array.isArray(r.questions) && r.questions.length ? r.questions.join("\n") : (r.detected_intent || ""));
  if (custText && custText.trim()) {
    var cq = el("div", "custq");
    cq.appendChild(set(el("span", "rl"), "What they are asking"));
    // Summary first, raw thread on demand: a mail arriving as 4,000 characters
    // of quoted history and signature images hides the one line that matters.
    cq.appendChild(conversationEl(r));
    card.appendChild(cq);
  }

  if (r.latest_unresolved_request && r.latest_unresolved_request.trim()) {
    var ur = el("div", "refbox");
    ur.appendChild(set(el("span", "rl"), "AI-identified latest unresolved request"));
    ur.appendChild(proseEl(r.latest_unresolved_request));
    card.appendChild(ur);
  }

  card.appendChild(subscriptionContextEl(r));

  if (r.conversation_context && r.conversation_context.trim()) {
    card.appendChild(detail("Full conversation seen by the AI", r.conversation_context));
  }

  if (r.draft && r.draft.trim()) {
    var dr = el("div", "draft");
    dr.appendChild(set(el("span", "draftlab"), "AI draft reply"));
    dr.appendChild(proseEl(r.draft));

  } else {

  }

  var qaA = r.qa_assessment || r.agent_qa_assessment;
  if (qaA && Array.isArray(qaA.scorecard) && qaA.scorecard.length) {

  }

  if (r.agent_sent_reply && r.agent_sent_reply.trim()) {
    var ref = el("div", "refbox");

    card.appendChild(ref);
  }

  var gold = el("div", "gold");
  gold.appendChild(set(el("span", "gl"), "Ideal answer (training material)"));
  // Rich-text editor (agent request): formatting toolbar + understands pasted
  // HTML. The shim is textarea-compatible, so the save plumbing is unchanged.
  var ta = richEditor(
    r.agent_sent_reply ? "Write the ideal answer, or start from the agent's reply above…" : "Write the ideal answer the AI should learn from…",
    "Ideal answer (training material) for ticket " + r.ticket_id,
  );
  ta.value = r.gold_answer || "";
  var st = el("span", "st"); st.setAttribute("aria-live", "polite");
  st.textContent = r.gold_answer ? ("saved" + (r.gold_answer_by ? " · " + r.gold_answer_by : "")) : "";
  // autosave (#5): debounce ~1s after typing stops; the manual button stays as a fallback.
  ta.oninput = function () { scheduleGoldSave(r, ta, st, mark); };
  gold.appendChild(ta.root);

  var gbar = el("div", "goldbar");
  var gactions = el("div", "goldactions");
  // "Mark as golden" is the primary, always-visible action. It saves whatever is in
  // the box; if the box is empty it adopts the best reply we already have (agent's
  // sent reply → AI suggestion → draft), so one click is enough on most tickets.
  var best = (r.agent_sent_reply && r.agent_sent_reply.trim()) ? r.agent_sent_reply
    : (r.agent_qa_assessment && r.agent_qa_assessment.recommendedReply) ? r.agent_qa_assessment.recommendedReply
    : (r.draft && r.draft.trim()) ? r.draft : "";
  var mark = el("button", "btn golden" + (hasGold ? " is-set" : ""));
  mark.textContent = hasGold ? "★ Golden — saved" : "★ Mark as golden";
  mark.title = "Save this as the ideal training answer for the AI";
  mark.onclick = function () {
    if (r._goldTimer) { clearTimeout(r._goldTimer); r._goldTimer = null; }
    var val = ta.value.trim() ? ta.value : best;
    if (!val) { ta.focus(); st.textContent = "write the ideal answer first"; return; }
    ta.value = val; saveGold(r, val, st, mark);
  };
  gactions.appendChild(mark);
  var save = el("button", "btn small"); save.textContent = "Save";
  save.title = "Save the text in the box";
  save.onclick = function () { if (r._goldTimer) { clearTimeout(r._goldTimer); r._goldTimer = null; } saveGold(r, ta.value, st, mark); };
  gactions.appendChild(save);
  if (r.agent_sent_reply) {
    var useSent = el("button", "link"); useSent.textContent = "use agent's reply";
    useSent.onclick = function () { ta.value = r.agent_sent_reply; };
    gactions.appendChild(useSent);
  }
  var rec = r.agent_qa_assessment && r.agent_qa_assessment.recommendedReply;
  if (rec) {

    gactions.appendChild(useRec);
  }
  gbar.appendChild(gactions);
  gbar.appendChild(st); gold.appendChild(gbar); card.appendChild(gold);

  // ---- structured verdict: buttons + reason codes + critical flag ----
  // Per-card review state (kept in closure; committed together via saveReview).
  var arr = Array.isArray(r.verdict_reasons) ? r.verdict_reasons : [];
  var selReasons = {};
  var otherText = "";
  for (var ri = 0; ri < arr.length; ri++) {
    if (typeof arr[ri] === "string" && arr[ri].indexOf("other:") === 0) otherText = arr[ri].slice(6);

  }
  var critical = r.critical_flag || "";

  function reasonsArray() {
    var out = [];
    for (var i = 0; i < REASONS.length; i++) if (selReasons[REASONS[i][0]]) out.push(REASONS[i][0]);
    if (otherText.trim()) out.push("other:" + otherText.trim());
    return out;
  }
  // Commit verdict + reasons + critical together, with optimistic locking.
  function commit(newVerdict) {

    if (critical) verdict = "unusable"; // the DB enforces this too
    // instant feedback: highlight the chosen verdict and reveal the reasons panel

    var show = verdict === "edited" || verdict === "unusable" || reasonsArray().length > 0 || !!critical;
    var panel = card._reasonsPanel; if (panel) panel.style.display = show ? "" : "none";

  }
  card._setVerdict = commit; // so keyboard shortcuts can trigger it

  var actions = el("div", "actions");
  actions.appendChild(set(el("span", "lab"), "Would you have sent this?"));
  ["usable", "edited", "unusable"].forEach(function (v) {
    var b = el("button", "vbtn" + (r.verdict === v ? " sel" : ""));
    b.setAttribute("data-v", v); b.textContent = v.charAt(0).toUpperCase() + v.slice(1);

  });
  var state = el("span", "vstate"); state.setAttribute("aria-live", "polite");
  state.textContent = r.verdict ? ("recorded: " + r.verdict + (r.verdict_by ? " · " + r.verdict_by : "")) : "";
  actions.appendChild(state);
  var spam = el("button", "spambtn"); spam.textContent = "Spam"; spam.title = "Mark as spam / noise and hide it";
  spam.onclick = function () { markSpam(r); };

    link.textContent = "Open in Freshdesk ↗";

  // Reasons panel — shown for edited/unusable (or whenever reasons/critical exist).
  var rp = el("div", "reasons-panel");

  rp.style.display = panelVisible() ? "" : "none";

  CRITICALS.forEach(function (cc) {

// Save verdict + reasons + critical atomically, with optimistic locking so a second
// reviewer can't silently overwrite. Filters on the review_version we last read; a
// stale write matches 0 rows → we reload and tell the reviewer.
async function saveReview(r, card, patch) {
  var vs = card.querySelector(".vstate");
  vs.textContent = "sparar…";
  var body = {
    p_generation_id: r.id,
    p_expected_version: r.my_review_version || 0,
    p_verdict: patch.verdict,
    p_verdict_reasons: patch.verdict_reasons,
    p_critical_flag: patch.critical_flag
  };
  try {
    var res = await api("/rest/v1/rpc/submit_generation_verdict", {
      method: "POST",
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      var msg = await res.text();
      if (msg.indexOf("review version conflict") >= 0) {
        vs.textContent = "en nyare egen bedömning finns — laddar om…";
        await reloadRow(r, card);
      } else {
        vs.textContent = "kunde inte spara: " + msg;
      }
      return;
    }
    var out = await res.json();
    if (!out.length) { vs.textContent = "inget sparades — laddar om…"; await reloadRow(r, card); return; }
    var saved = out[0];
    r.verdict = saved.verdict;
    r.verdict_reasons = saved.verdict_reasons;
    r.critical_flag = saved.critical_flag;
    r.verdict_by = saved.reviewer_email;
    r.verdict_at = saved.updated_at;
    r.review_version = saved.review_version;
    r.my_review_version = saved.review_version;
    // reflect verdict button selection + state text
    var btns = card.querySelectorAll(".vbtn");
    for (var i = 0; i < btns.length; i++) btns[i].className = "vbtn" + (btns[i].getAttribute("data-v") === r.verdict ? " sel" : "");
    vs.textContent = "sparat: " + (r.verdict || "—") + (r.verdict_by ? " · " + r.verdict_by : "");
    card.classList.toggle("critical", !!r.critical_flag);
    if (card._reasonsPanel && card._panelVisible) card._reasonsPanel.style.display = card._panelVisible() ? "" : "none";
  } catch (e) { vs.textContent = "kunde inte spara: " + e.message; }
}

// Re-fetch one row and swap its card in place (after a save conflict).
async function reloadRow(r, card) {
  try {
    var res = await api("/rest/v1/suggestions?id=eq." + r.id + "&select=" + COLS);
    var out = await res.json();
    if (out && out[0]) {
      await loadMyReviews(out);
      Object.assign(r, out[0]);
      var fresh = cardEl(r);
      var i = cardEls.indexOf(card);
      if (i >= 0) cardEls[i] = fresh;
      card.replaceWith(fresh);
    }
  } catch (e) { /* leave the stale card; the status line already told the reviewer */ }
}

async function saveGold(r, text, st, mark, _retried) {
  st.textContent = "Sparar…";
  dirtyGold[r.id] = true; // unsaved until the write confirms
  try {
    var res = await api("/rest/v1/rpc/save_generation_gold_answer", {
      method: "POST",
      body: JSON.stringify({ p_generation_id: r.id, p_gold_answer: text }),
    });
    if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
    var out = await res.json(), saved = out && out[0];
    r.gold_answer = text;
    if (saved) {
      r.gold_answer_by = saved.reviewer_email;
      r.my_review_version = saved.review_version;
      r.review_version = Math.max(r.review_version || 0, saved.review_version || 0);
    }
    delete dirtyGold[r.id];
    var has = !!text.trim();
    st.textContent = has ? "Sparat ✓" : "Rensat";
    if (mark) {
      mark.className = "btn golden" + (has ? " is-set" : "");
      mark.textContent = has ? "★ Golden — saved" : "★ Mark as golden";
      var card = mark.closest(".card");
      if (card) card.classList.toggle("golden", has);
    }
  } catch (e) {
    // network blip → one automatic retry after a short pause; text is kept (dirty).
    if (!_retried) {
      st.textContent = "Nätverksfel — försöker igen…";
      setTimeout(function () { saveGold(r, text, st, mark, true); }, 1500);
    } else {
      st.textContent = "Kunde inte spara (nätverksfel) — texten är kvar, försök igen.";
    }
  }
}

// Debounced autosave: save ~1s after the reviewer stops typing (per-row timer).
function scheduleGoldSave(r, ta, st, mark) {
  st.textContent = "Ändrat…"; dirtyGold[r.id] = true;
  if (r._goldTimer) clearTimeout(r._goldTimer);
  r._goldTimer = setTimeout(function () { r._goldTimer = null; saveGold(r, ta.value, st, mark); }, 1000);
}

// Mark a ticket as spam/noise: persist is_spam=true, then drop it from the list.
async function markSpam(r) {
  if (!window.confirm("Mark #" + r.ticket_id + " as spam and hide it? It stays out of the eval and rewrite queue.")) return;
  try {
    var res = await api("/rest/v1/rpc/mark_generation_spam", {
      method: "POST",
      body: JSON.stringify({ p_generation_id: r.id }),
    });
    if (!res.ok) { window.alert("Couldn't mark as spam: " + (await res.text())); return; }
    r.is_spam = true;
    rows = rows.filter(function (x) { return x.id !== r.id; });
    render();
  } catch (e) { window.alert("Network error: " + e.message); }
}

function isSpam(subject) {
  var s = (subject || "").toLowerCase();
  if (/^\s*(automatic reply|automatisk svar|automatiskt svar|autosvar|automaattinen vastaus|out of office|out-of-office|frånvaro|frånvarande|ute av kontoret|auto[- ]?reply|feriesvar|semestersvar|fraværsmelding|fraværsassistent)\b/.test(s)) return true;
  var mk = ["det sier mye om deg at du bruker simployer expert", "smarte måter å få mer ut av simployer expert", "dette venter på deg i simployer expert", "oppdag alt simployer expert har å tilby", "slik får du mest ut av simployer expert", "upptäck allt som simployer expert har att erbjuda"];
  return mk.some(function (m) { return s.indexOf(m) >= 0; });
}
// Split text into readable paragraphs (blank line = new paragraph); keeps single
// newlines inside a paragraph via white-space:pre-wrap. Avoids the "wall of text".
function proseEl(text) {
  var box = el("div", "prose");
  var paras = String(text == null ? "" : text).split(/\n\s*\n/);
  for (var i = 0; i < paras.length; i++) {
    var t = paras[i].replace(/^\s+|\s+$/g, "");
    if (t) box.appendChild(set(document.createElement("p"), t));
  }
  if (!box.childNodes.length) box.appendChild(document.createElement("p"));
  return box;
}
// Which system a fact came from. The agent acts differently on each — a KB

  ticket: "Past ticket",

  incident: "Known incident",

// ── Email artifact cleanup ──────────────────────────────────────────────────
//
// Freshdesk hands us the plain-text rendering of an HTML email, and it arrives
// carrying everything the mail client put there: inline-image placeholders,
// numbered signature images, mailto duplicates of every address, corporate
// link-rewriting (Proofpoint, Outlook safelinks) that turns a facebook.com link
// into 300 characters of tracking, and the whole quoted thread repeated on each
// reply. On #84342 the actual question is ONE line inside 1251 characters of
// that. On #87033 it is two questions inside 4304.
//
// Nothing here guesses at meaning — every rule removes a known machine-generated
// artifact or unwraps a wrapper back to what it wrapped. The count of removals
// is returned and shown, so text disappearing is visible rather than silent.

function unwrapProofpoint(u) {
  // Proofpoint v2 encodes the target with its own escapes rather than percent
  // encoding: -3A for ':', -2D for '-', _ for '/'.
  try {
    return decodeURIComponent(u)
      .replace(/-3A/g, ":").replace(/-2D/g, "-").replace(/-2F/g, "/")
      .replace(/-5F/g, "_").replace(/_/g, "/").replace(/-26/g, "&");
  } catch (_e) { return u; }
}

function cleanEmailText(raw) {
  var text = String(raw == null ? "" : raw);
  var removed = 0;
  function cut(re, replacement) {
    text = text.replace(re, function () {
      removed++;
      if (typeof replacement === "function") return replacement.apply(null, arguments);
      // A callback's return value is used verbatim, so "$1" would land as the
      // literal text "$1". Substitute the capture groups ourselves.
      var args = arguments;
      return replacement.replace(/\$([1-9])/g, function (_d, n) { return args[Number(n)] ?? ""; });
    });
  }

  text = text.replace(/\r\n/g, "\n");

  // Inline-image placeholders and the numbered signature images beside them.
  cut(/\[cid:[^\]\n]*\]/gi, "");
  cut(/\[signature_\d+\]/gi, "");
  // Alt text the mail client generated for a picture, in any of our languages.
  cut(/\[(?:Et bilde som inneholder|En bild som innehåller|Kuva, joka sisältää|A picture containing|Image|Bilde|Bild)[^\]\n]*\]/gi, "");

  // Corporate link rewriting, unwrapped back to the link it replaced.
  cut(/https?:\/\/urldefense\.proofpoint\.com\/v2\/url\?u=([^&\s>]+)[^\s>]*/gi,
    function (_m, u) { return unwrapProofpoint(u); });
  cut(/https?:\/\/[a-z0-9.-]*safelinks\.protection\.outlook\.com\/[^\s>]*[?&]url=([^&\s>]+)[^\s>]*/gi,
    function (_m, u) { try { return decodeURIComponent(u); } catch (_e) { return u; } });

  // "name@x<mailto:name@x>" is the same address twice. Keep one.
  cut(/([^\s<>]+@[^\s<>]+?)\s*<mailto:[^>\n]*>/gi, "$1");
  cut(/<mailto:[^>\n]*>/gi, "");
  // Phone artifacts: "(+47) 9<(+47)%2091185661>2626796" — the angle part is a
  // tel: link the client inlined mid-number.
  cut(/<(?:tel:|callto:)?\(?\+?[\d\s()%]{6,}>/gi, "");
  // A URL wrapped in angle brackets is just a URL.
  cut(/<(https?:\/\/[^>\s]+)>/gi, "$1");

  // The same paragraph repeated down a thread — keep the first occurrence. This
  // is what makes a five-reply chain readable.
  var seen = {};
  var paras = text.split(/\n\s*\n/);
  var kept = [];
  for (var i = 0; i < paras.length; i++) {
    var p = paras[i].replace(/^\s+|\s+$/g, "");
    if (!p) continue;
    var key = p.toLowerCase().replace(/\s+/g, " ");
    // Short lines ("Hei", "Takk") legitimately repeat; only dedupe real content.
    if (key.length > 24 && seen[key]) { removed++; continue; }
    seen[key] = true;
    kept.push(p);
  }
  text = kept.join("\n\n");

  return { text: text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim(), removed: removed };
}

// The quoted history below the new message. Cut for the EXCERPT only — the full
// view keeps it, because sometimes the answer is down there.
var QUOTED_HEAD = /^\s*(?:fra|från|from|sendt|sent|skickat|til|to|emne|subject|cc|kopi)\s*:\s/i;

function newestMessageOnly(text) {
  var lines = String(text || "").split("\n");
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (/^\s*(?:-{3,}\s*(?:original message|opprinnelig melding|ursprungligt meddelande)|_{10,}|-{10,})/i.test(l)
      || QUOTED_HEAD.test(l)) {
      var head = lines.slice(0, i).join("\n").replace(/\s+$/, "");
      // Only trust the cut if something substantial survives it.
      if (head.replace(/\s/g, "").length > 40) return head;
    }
  }
  return text;
}

// ── Key takeaways ───────────────────────────────────────────────────────────
//
// Built entirely from what the pipeline already extracted at generation time —
// the questions it found, the request it judged still unresolved, the intent it
// classified. No new model call, and nothing invented: if the analysis produced
// nothing, this falls back to the first cleaned paragraph of the mail.

function takeawaysEl(r, cleaned) {
  var box = el("div", "tk-sum");
  var qs = Array.isArray(r.questions) ? r.questions.filter(Boolean) : [];

  if (qs.length) {
    var ul = document.createElement("ul");
    ul.className = "tk-qs";
    qs.forEach(function (q) { ul.appendChild(set(document.createElement("li"), q)); });
    box.appendChild(ul);
  } else {
    // Nothing extracted — show the newest message rather than an empty box, and
    // skip the greeting: "Hei," is not what the ticket is about.
    var paras = newestMessageOnly(cleaned).split(/\n\s*\n/)
      .map(function (t) { return t.replace(/^\s+|\s+$/g, ""); })
      .filter(function (t) {
        return t.length > 30 && !/^(?:hei|hej|hallå|hi|hello|god dag|takk|tack)\b[\s,!.]*$/i.test(t);
      });
    box.appendChild(set(el("p", "tk-fallback"),
      paras.slice(0, 2).join("\n\n") || newestMessageOnly(cleaned) || "(no message text)"));
  }

  if (r.latest_unresolved_request && r.latest_unresolved_request.trim()) {
    var un = el("p", "tk-un");
    un.appendChild(set(el("b", ""), "Still unresolved: "));
    un.appendChild(document.createTextNode(r.latest_unresolved_request));
    box.appendChild(un);
  }
  return box;
}

// Summary first, raw thread behind a toggle. The default view is what the
// ticket is ABOUT; the full conversation is one click away for when it matters.
function conversationEl(r) {
  var raw = (r.customer_message && r.customer_message.trim())
    ? r.customer_message
    : (Array.isArray(r.questions) && r.questions.length ? r.questions.join("\n\n") : "");
  var c = cleanEmailText(raw);

  var box = el("div", "");
  box.appendChild(takeawaysEl(r, c.text));

  // Only offer the toggle when there is meaningfully more to see.
  var trimmed = newestMessageOnly(c.text);
  var hasMore = c.text.length > trimmed.length + 40 || c.removed > 0 || c.text.length > 400;
  if (!hasMore) return box;

  var btn = document.createElement("button");
  btn.className = "tk-toggle";
  var full = el("div", "tk-full");
  full.style.display = "none";
  full.appendChild(proseEl(c.text));
  if (c.removed) {
    full.appendChild(set(el("p", "tk-note"),
      c.removed + " email artifact" + (c.removed === 1 ? "" : "s") +
      " removed (inline images, signature blocks, mailto duplicates, tracking " +
      "links, repeated quoted text)."));
  }

  var open = false;
  function paint() {
    btn.textContent = (open ? "▾ Hide" : "▸ Show") + " full conversation";
    btn.setAttribute("aria-expanded", open ? "true" : "false");
    full.style.display = open ? "" : "none";
  }
  btn.onclick = function () { open = !open; paint(); };
  paint();

  box.appendChild(btn);
  box.appendChild(full);
  return box;
}

// Verified Freshworks CRM context is rendered directly from stored structured
// data. It is not AI output, and only the three approved subscription fields are
// accepted here.
// ---- rich-text ideal-answer editor (agent request): a formatter that also ----
// ---- understands pasted HTML. Everything rendered goes through the        ----
// ---- allowlist sanitizer below -- gold answers are reviewer-written data  ----
// ---- shown to other reviewers, so no script/style/attribute may survive.  ----
var FMT_ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, P:1, BR:1, DIV:1, UL:1, OL:1, LI:1, A:1, H3:1, H4:1, BLOCKQUOTE:1 };
var FMT_DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|LINK|META|FORM|INPUT|BUTTON|TEXTAREA|SELECT|VIDEO|AUDIO|IMG|HEAD|TITLE)$/;

function sanitizeHtml(html) {
  // DOMParser documents are inert: scripts never execute during parsing.
  var doc = new DOMParser().parseFromString("<div>" + String(html || "") + "</div>", "text/html");
  var root = doc.body.firstChild;
  (function clean(node) {
    var kids = Array.prototype.slice.call(node.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var child = kids[i];
      if (child.parentNode !== node) continue;
      if (child.nodeType === 3) continue;             // text
      if (child.nodeType !== 1) { node.removeChild(child); continue; } // comments etc
      var tag = child.nodeName;
      if (FMT_DROP.test(tag)) { node.removeChild(child); continue; }
      if (!FMT_ALLOWED[tag]) {
        clean(child); // sanitize inside first, then unwrap (keep the content)
        while (child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        continue;
      }
      for (var a = child.attributes.length - 1; a >= 0; a--) {
        var an = child.attributes[a].name;
        if (!(tag === "A" && an === "href")) child.removeAttribute(an);
      }
      if (tag === "A") {
        var href = child.getAttribute("href") || "";
        if (!/^(https?:|mailto:)/i.test(href)) child.removeAttribute("href");
        else { child.setAttribute("rel", "noopener noreferrer"); child.setAttribute("target", "_blank"); }
      }
      clean(child);
    }
  })(root);
  return root.innerHTML;
}

function escHtml(text) {
  return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function domToPlain(node) {
  var out = "";
  for (var i = 0; i < node.childNodes.length; i++) {
    var c = node.childNodes[i];
    if (c.nodeType === 3) out += c.nodeValue;
    else if (c.nodeName === "BR") out += "\n";
    else { out += domToPlain(c); if (/^(DIV|P|LI|H3|H4|BLOCKQUOTE)$/.test(c.nodeName)) out += "\n"; }
  }
  return out;
}

// Plain answers stay plain (the training corpus should not fill with markup
// nobody asked for); only real formatting (bold/lists/links/...) is stored as HTML.
function editorValue(ed) {
  var html = sanitizeHtml(ed.innerHTML);
  var probe = document.createElement("div");
  probe.innerHTML = html;
  if (!probe.querySelector("b,strong,i,em,u,ul,ol,li,a,h3,h4,blockquote")) {
    return domToPlain(probe).replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").trim();
  }
  return html.trim();
}

function setEditorValue(ed, v) {
  v = v || "";
  if (/<[a-z][^>]*>/i.test(v)) ed.innerHTML = sanitizeHtml(v);
  else ed.innerHTML = escHtml(v).replace(/\r?\n/g, "<br>");
}

// Returns a textarea-compatible shim ({value, focus, oninput}) so the save/
// autosave plumbing is unchanged.
function richEditor(placeholder, ariaLabel) {
  var wrap = el("div", "goldwrap");
  var bar = el("div", "fmtbar");
  var ed = el("div", "goldedit");
  ed.contentEditable = "true";
  ed.setAttribute("role", "textbox");
  ed.setAttribute("aria-multiline", "true");
  ed.setAttribute("aria-label", ariaLabel);
  ed.setAttribute("data-placeholder", placeholder);

  function fmtBtn(labelHtml, title, run) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "fbtn"; b.innerHTML = labelHtml; b.title = title;
    b.setAttribute("aria-label", title);
    b.onmousedown = function (e) { e.preventDefault(); }; // keep the text selection
    b.onclick = function (e) {
      e.preventDefault(); ed.focus(); run();
      ed.dispatchEvent(new Event("input", { bubbles: false })); // trigger autosave
    };
    bar.appendChild(b);
  }
  fmtBtn("<b>B</b>", "Bold", function () { document.execCommand("bold"); });
  fmtBtn("<i>I</i>", "Italic", function () { document.execCommand("italic"); });
  fmtBtn("<u>U</u>", "Underline", function () { document.execCommand("underline"); });
  fmtBtn("&bull; list", "Bullet list", function () { document.execCommand("insertUnorderedList"); });
  fmtBtn("1. list", "Numbered list", function () { document.execCommand("insertOrderedList"); });
  fmtBtn("link", "Insert link (https://...)", function () {
    var url = window.prompt("Link URL (https://...)");
    if (url && /^https?:\/\//i.test(url)) document.execCommand("createLink", false, url);
  });
  fmtBtn("&times; format", "Remove formatting", function () {
    document.execCommand("removeFormat"); document.execCommand("unlink");
  });

  // Pasted HTML (e.g. copied from Freshdesk) is understood: sanitized and kept
  // formatted. Plain text keeps its line breaks.
  ed.addEventListener("paste", function (e) {
    e.preventDefault();
    var html = e.clipboardData && e.clipboardData.getData("text/html");
    var text = e.clipboardData && e.clipboardData.getData("text/plain");
    if (html) document.execCommand("insertHTML", false, sanitizeHtml(html));
    else if (text) document.execCommand("insertHTML", false, escHtml(text).replace(/\r?\n/g, "<br>"));
  });

  wrap.appendChild(bar); wrap.appendChild(ed);
  return {
    root: wrap,
    get value() { return editorValue(ed); },
    set value(v) { setEditorValue(ed, v); },
    focus: function () { ed.focus(); },
    set oninput(fn) { ed.addEventListener("input", fn); },
  };
}

function subscriptionContextEl(r) {
  var context = r.customer_subscriptions;
  var box = el("section", "subs");
  box.appendChild(set(el("span", "sl"), "Customer subscriptions · verified Freshworks CRM data"));

  if (!context) {
    box.appendChild(set(el("p", "sstate"), "Not collected for this generation. Run a new test after the CRM integration is enabled."));
    return box;
  }
  if (context.status === "unavailable") {
    box.appendChild(set(el("p", "sstate"), "Temporarily unavailable — verify manually."));
    box.appendChild(crmVerdictRow(r));
    return box;
  }
  if (context.status === "no_match") {
    box.appendChild(set(el("p", "sstate"), "No CRM account matched the requester email or the ticket's company."));
    box.appendChild(crmVerdictRow(r));
    return box;
  }
  if (context.status === "ambiguous") {
    var msg = "⚠️ Several similar CRM accounts match this customer — check the CRM manually before relying on subscription data.";
    var candidates = Array.isArray(context.candidates) ? context.candidates.filter(function (n) { return typeof n === "string" && n.trim(); }) : [];
    if (candidates.length) msg += " Candidates: " + candidates.join(" · ") + ".";
    box.appendChild(set(el("p", "sstate"), msg));
    box.appendChild(crmVerdictRow(r));
    return box;
  }

  var matchNotes = {
    account_map: "Via a verified account mapping.",
    company_name: "Matched via the ticket's company.",
    company_name_prefix: "Matched via the ticket's company — the name differs slightly, verify it is the right account.",
    email_domain: "Matched via the requester's email domain — verify it is the right account."
  };
  if (context.matchedBy && matchNotes[context.matchedBy]) {
    box.appendChild(set(el("p", "sstate"), matchNotes[context.matchedBy]));
  }

  var subscriptions = Array.isArray(context.subscriptions) ? context.subscriptions : [];
  if (!subscriptions.length) {
    box.appendChild(set(el("p", "sstate"), "No subscriptions found for the matched account."));
    box.appendChild(crmVerdictRow(r));
    return box;
  }

  var table = document.createElement("table");

    hr.appendChild(set(document.createElement("th"), label));
  });

  table.appendChild(head);
  var body = document.createElement("tbody");
  subscriptions.forEach(function (subscription) {
    var row = document.createElement("tr");
    [subscription.productName, subscription.renewalStatus, subscription.endDate].forEach(function (value) {
      row.appendChild(set(document.createElement("td"), value == null || String(value).trim() === "" ? "—" : String(value)));
    });
    body.appendChild(row);
  });
  table.appendChild(body);
  box.appendChild(table);
  box.appendChild(crmVerdictRow(r));
  return box;
}

// Micro-verdict on the MATCH itself — shown on EVERY outcome, because the
// silent ones carry the information we cannot get anywhere else: when the
// lookup found nothing, only the agent knows whether the customer actually
// exists in the CRM. Coverage alone measures nothing without that.
// Saved via submit_crm_match_verdict; never bumps the reply-verdict version,
// but syncs the returned version so the judging lock stays correct.
function crmVerdictRow(r) {
  var found = r.customer_subscriptions && r.customer_subscriptions.status === "found";
  var row = el("div", "crmverdict");
  row.appendChild(set(el("span", "sl"), found ? "Right CRM account?" : "Is this customer in the CRM?"));

  // "wrong" and "missed" are the actionable answers — both mean a human knows
  // the right account, so we ask which one and feed the curation queue.
  var opts = found
    ? [["correct", "Yes"], ["wrong", "No — wrong customer"], ["unsure", "Unsure"]]
    : [["missed", "Yes — we missed it"], ["not_in_crm", "No"], ["unsure", "Unsure"]];

  var st = el("span", "st"); st.setAttribute("aria-live", "polite");
  var hint = document.createElement("input");
  hint.type = "text";
  hint.className = "crmhint";
  hint.placeholder = "Which account is the right one? (optional)";
  hint.setAttribute("aria-label", "Correct CRM account for ticket " + r.ticket_id);
  hint.value = r.crm_account_hint || "";
  var needsHint = function (v) { return v === "wrong" || v === "missed"; };
  hint.style.display = needsHint(r.crm_account_correct) ? "" : "none";

  var btns = [];
  async function save(value) {
    st.textContent = "Sparar…";
    try {
      var res = await api("/rest/v1/rpc/submit_crm_match_verdict", {
        method: "POST",
        body: JSON.stringify({
          p_generation_id: r.id,
          p_correct: value,
          p_hint: hint.value.trim() || null,
        }),
      });
      if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
      var out = await res.json(), saved = out && out[0];
      r.crm_account_correct = value;
      if (saved) {
        r.crm_account_hint = saved.crm_account_hint;
        r.my_review_version = saved.review_version;
        r.review_version = Math.max(r.review_version || 0, saved.review_version || 0);
      }
      btns.forEach(function (b) { b.className = "btn small" + (b._val === value ? " sel" : ""); });
      hint.style.display = needsHint(value) ? "" : "none";
      st.textContent = "sparat";
    } catch (e) { st.textContent = "kunde inte spara: " + e.message; }
  }

  opts.forEach(function (opt) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn small" + (r.crm_account_correct === opt[0] ? " sel" : "");
    b.textContent = opt[1];
    b.setAttribute("aria-label", (found ? "Right CRM account: " : "Customer in CRM: ") + opt[1]);
    b._val = opt[0];
    b.onclick = function () { save(opt[0]); };
    btns.push(b);
    row.appendChild(b);
  });
  row.appendChild(hint);
  row.appendChild(st);
  // Typing the account name is only useful once a verdict exists to attach it to.
  hint.onblur = function () { if (r.crm_account_correct) save(r.crm_account_correct); };
  if (r.crm_account_correct) st.textContent = "sparat";
  return row;
}
// ── Coaching tab (2026-08-04) ───────────────────────────────────────────────
//
// The pivot said the product is a COACH, but only the drafting half is measured.
// This tab measures the other half: did the note arrive before the agent started
// writing, and was the recommended next step actually followed?
//
// READ-ONLY, and that is structural, not a promise: every table it reads is
// granted SELECT only, so there is no path from this browser to a write. There
// is also deliberately NO control for an agent to declare they followed the
// advice — follow-through is observed or it is unknown, never self-reported.

async function loadCoaching() {
  if (coach.loaded) return;
  async function get(path) {
    try {
      var res = await api("/rest/v1/" + path);
      if (!res.ok) return null;
      return await res.json();
    } catch (_e) { return null; }
  }
  var r = await Promise.all([
    get("coaching_baselines?select=*"),
    get("coaching_reply_distribution?select=*&order=bucket_order"),
    get("coaching_next_steps?select=*&limit=300"),
    get("coaching_delivery_summary?select=*"),
    get("coaching_step_mix?select=*"),
    get("coaching_value_pairing?select=*"),
    get("coaching_failed_advice?select=*&limit=40"),
    get("coaching_knowledge_produced?select=*"),
  ]);
  coach.baselines = r[0] || [];
  coach.dist      = r[1] || [];
  coach.steps     = r[2] || [];
  coach.delivery  = (r[3] || [])[0] || null;
  coach.mix       = r[4] || [];
  coach.pairing   = r[5] || [];
  coach.failed    = r[6] || [];
  coach.knowledge = (r[7] || [])[0] || null;

  // Demo mode REPLACES the follow-through sections rather than mixing with
  // them, so no figure on screen is part real and part sample. Baselines, note
  // timing and Knowledge produced are left exactly as the database has them —
  // those come from measure-baselines / observe-coaching and are real.
  if (COACH_DEMO) {
    coach.steps = demoSteps();
    coach.mix = demoMix(coach.steps);
    coach.pairing = demoPairing(coach.steps);
    coach.failed = demoFailed(coach.steps);
  }
  coach.loaded = true;
}

// ── Demo mode for the Coaching tab ──────────────────────────────────────────
//
// Three of the eight step types have their follow-through signal in Linear or
// Planhat, and neither has a client in this codebase — so those rows can never
// be filled from real data, and the tab could not be shown working.
//
// With COACH_DEMO on, the Next steps / pairing / failed-advice sections render
// ONE coherent demo dataset instead of the real rows: 48 recommended steps
// across all eight types, on real tickets, with realistic follow-through. It
// replaces rather than mixes, so no number on screen is half-real — a blended
// denominator was the thing that produced a misleading headline before.
//
// Baselines, note timing and Knowledge produced are NOT faked: those come from
// `deno task measure-baselines` and `observe-coaching` and are real.
//
// The rows are styled exactly like real ones, by request — this is a
// demonstrable tab, not a warning. The single disclosure is one line in the
// footer. COACH_DEMO = false restores every real number with no other edit.
var COACH_DEMO = true;

  link_linear: "Linear",
