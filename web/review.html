  box.appendChild(flow);

  // The three outcomes, so the badge on every card below is already explained.
  var out = el("div", "wf-outcomes");
  out.appendChild(set(el("div", "wf-outh"), "What the status on each note means"));
  [
    ["", "🟢", "Ready to send", "Grounded, high confidence, and every question answered. Read it, then send it."],
    ["amber", "🟡", "Review before sending", "Useful, but not send-ready — a routing message, a partial answer, or thin sourcing."],
    ["red", "🔴", "Action needed before replying", "Check the system, verify identity, open the attachment or escalate FIRST. Do not send a reply yet."],
  ].forEach(function (o) {
    var r = el("div", "wf-out " + o[0]);
    r.appendChild(set(el("span", "wf-outicon"), o[1]));
    r.appendChild(set(el("span", "wf-outname"), o[2]));
    r.appendChild(set(el("span", "wf-outtext"), o[3]));
    out.appendChild(r);
  });
  box.appendChild(out);

  box.appendChild(set(el("p", "wf-foot"),
    "Two writes ever reach Freshdesk: this private note, and up to three keyword tags on " +
    "the same ticket. Nothing else in any system is touched."));
  return box;
}

function noteViewEl(r) {
  var mode = NOTE_MODE[r.coach_mode] || NOTE_MODE.COACH_AGENT;
  var wrap = el("div", "nv");

  // ── the ticket, above the note ──
  //
  // The design leads with WHO is asking, because that is what an agent reads
  // first. Requester name and company are not stored on `suggestions` — and the
  // CRM client keeps accountId and the subscriptions but never the account name
  // — so the name line is sample data, chipped as such.
  //
  // The real identifiers do not disappear: the ticket id (linked) and subject
  // move to the line below, so a reviewer can still find the actual ticket. A
  // sampled name that displaced the real reference would be a trap.
  var tk = el("div", "nv-ticket");
  var who = el("div", "nv-who");
  if (PLANHAT_DEMO) {
    var person = demoRequester(r.ticket_id, r.draft);
    var nameEl = el("span", "nv-subj");
    nameEl.appendChild(document.createTextNode(person.name + " · " + person.company));
    nameEl.appendChild(set(el("span", "nv-demotag"), "sample"));
    who.appendChild(nameEl);
  } else {
    who.appendChild(set(el("span", "nv-subj"), r.subject || "(no subject)"));
  }
  tk.appendChild(who);

  var meta = el("div", "nv-meta");
  var a = document.createElement("a");
  a.className = "nv-id"; a.target = "_blank"; a.rel = "noopener";
  a.href = r.ticket_url || ("https://simployer.freshdesk.com/a/tickets/" + r.ticket_id);
  a.textContent = "#" + r.ticket_id;
  meta.appendChild(a);
  meta.appendChild(document.createTextNode(" · " + [
    PLANHAT_DEMO ? (r.subject || "(no subject)") : null,
    "Freshdesk", (r.language || "").toUpperCase(), r.ticket_type,
    r.created_at ? fmtDate(r.created_at) : "",
  ].filter(Boolean).join(" · ")));
  tk.appendChild(meta);

  var cust = (r.customer_message && r.customer_message.trim())
    ? r.customer_message
    : (Array.isArray(r.questions) && r.questions.length ? r.questions.join("\n") : "");
  if (cust.trim()) {
    var body = el("div", "nv-body");
    body.appendChild(conversationEl(r));
    tk.appendChild(body);
  }
  wrap.appendChild(tk);

  // ── the note ──
  var note = el("div", "nv-note");
  note.appendChild(el("div", "nv-rail" + (mode.cls ? " " + mode.cls : "")));
  var inner = el("div", "nv-inner");

  // ── EN beslutsrad, högst upp ──
  // Chipet bär ikon + text (färg är förstärkning), grundningen som bisats, och
  // mätaren har en tooltip eftersom "4 av 5 staplar" annars inte betyder något.
  var head = el("div", "nv-head");
  var chip = el("span", "nv-mode" + (mode.cls ? " " + mode.cls : ""));
  chip.appendChild(document.createTextNode(mode.icon + " " + mode.badge));
  head.appendChild(chip);

  var conf = el("span", "nv-conf");
  conf.title = GROUNDING_HELP;
  conf.appendChild(document.createTextNode(groundingPhrase(r)));
  var bars = el("span", "nv-bars" + (mode.cls ? " " + mode.cls : ""));
  bars.setAttribute("role", "img");
  bars.setAttribute("aria-label", "Grundning " + confBars(r) + " av 5. " + GROUNDING_HELP);
  var filled = confBars(r);
  for (var i = 0; i < 5; i++) bars.appendChild(el("i", i < filled ? "on" : ""));
  conf.appendChild(bars);
  head.appendChild(conf);

  if (usedTraining(r)) head.appendChild(set(el("span", "nv-trained"), "★ trained"));

  var stamp = [];
  if (r.latency_ms) stamp.push("written in " + Math.round(r.latency_ms / 1000) + " s");
  var nSrcAll = Array.isArray(r.sources) ? r.sources.length : 0;
  stamp.push(nSrcAll + " source" + (nSrcAll === 1 ? "" : "s") + " checked");
  head.appendChild(set(el("span", "nv-stamp"), stamp.join(" · ")));
  inner.appendChild(head);

  // ── Var uppmärksam på ──
  // Hälsan var passiv: fyra siffror i en remsa som ingen agerar på. Är kontot
  // gult/rött eller har öppna ärenden är det en UPPMANING, och den hör hemma
  // ovanför svaret — inte i en remsa man läser efteråt.
  var watch = watchOutEl(r);
  if (watch) inner.appendChild(watch);

  if (r.coverage) inner.appendChild(renderCoverageEl(r.coverage));

  // Därefter två spalter: HANDLING till vänster, UNDERLAG till höger.
  var cols = el("div", "nv-cols");
  var act = el("div", "nv-act");
  var side = el("div", "nv-side");

  // ── vänster: det agenten ska göra ──
  var recSteps = Array.isArray(r.resolution_steps) ? r.resolution_steps : [];
  if (recSteps.length) {
    var rec = el("div", "nv-rec");
    rec.appendChild(set(el("span", "rl"), "Recommended · next step"));
    rec.appendChild(set(el("p", ""), recSteps[0]));
    act.appendChild(rec);
  }

  if (r.draft && r.draft.trim()) {
    var h = el("h4", "nv-h");
    h.appendChild(document.createTextNode("Suggested reply"));
    h.appendChild(set(el("span", "nv-lang"), (r.language || "").toUpperCase()));
    act.appendChild(h);
    var d = el("div", "nv-draft");
    d.appendChild(proseEl(r.draft));
    act.appendChild(d);
  } else {
    act.appendChild(set(el("div", "nv-quiet"),
      "No send-ready reply — the coach abstained and handed the judgement back to you."));
  }

  var ups = upsellEl(r);
  if (ups) act.appendChild(ups);

  // Steg 2 och framåt: steg 1 står redan som rekommendationen ovan.
  if (recSteps.length > 1) {
    act.appendChild(set(el("h4", "nv-h"), "Then"));
    var sl = el("ul", "nv-facts");
    recSteps.slice(1).forEach(function (st, i) {
      var li = document.createElement("li");
      li.appendChild(set(el("span", "nv-src na"), "Step " + (i + 2)));
      li.appendChild(set(el("span", "nv-fact"), st));
      sl.appendChild(li);
    });
    act.appendChild(sl);
  }

  // ── höger: varför ──
  //
  // EN RAD PER SYSTEM, hopfälld. Förut listades varje enskild källa, vilket blev
  // tio rader att läsa igenom för att svara på en fråga som egentligen är
  // binär: hittade vi något, och var? Nu syns svaret direkt och detaljerna
  // ligger ett klick bort.
  //
  // Confluence saknades helt. "Inte ansluten" är ett svar agenten behöver —
  // utan raden går det inte att skilja från "kollad, hittade inget".
  side.appendChild(set(el("h4", "nv-h"), "What we know"));
  side.appendChild(sourceSystemsEl(r));

  // Kund- och kontokontexten hör ihop med källorna — den är underlag, inte
  // efterord. Den låg sist av allt och hittades därför inte.
  var crm = crmStripEl(r);
  if (crm) side.appendChild(crm);
  var demo = demoContextEl(r);
  if (demo) side.appendChild(demo);

  // Modellens läsning av situationen är bakgrund, inte beslut. Den låg tidigare
  // i full längd direkt under källorna och konkurrerade med dem om blicken;
  // hopfälld finns den kvar för den som vill kontrollera resonemanget.
  if (r.agent_analysis && r.agent_analysis.trim()) {
    var an = document.createElement("details");
    an.className = "nv-secondary";
    an.appendChild(set(document.createElement("summary"), "Read of the situation"));
    an.appendChild(set(el("div", "nv-analysis"), r.agent_analysis));
    side.appendChild(an);
  }

  cols.appendChild(act);
  cols.appendChild(side);
  inner.appendChild(cols);

  inner.appendChild(noteActionsEl(r, wrap));

  note.appendChild(inner);
  wrap.appendChild(note);
  return wrap;
}

// The action row from the design. THREE OF THE FOUR ARE INERT, deliberately and
// visibly: this app is read-only + RLS, and sending a customer reply or writing
// to Linear would be new external writes that CLAUDE.md §3 deliberately does not
// have. Rendering live-looking buttons that quietly do nothing is worse than
// rendering none, so they are disabled and the row says why in one line.
//
// "Wrong — tell us why" DOES act: judging a draft is a thing this app really
// does, so it jumps to the ticket in To review, where the verdict is recorded.
// The action row. Send / Edit stay INERT — this app is read-only + RLS, and
// sending a customer reply would be a new external write that CLAUDE.md §3
// deliberately does not have.
//
// The rest are DEMO ACTIONS, per Tobias. Scribe, Planhat and Linear have no
// client in this codebase (Scribe also needs MBL consultation and a DPA before
// a single recording is made — the decision paper says so itself). The buttons
// exist so the loop from the walkthrough can be shown end to end; they change
// nothing outside this page, and each says "demo" when it acts.
function noteActionsEl(r, wrap) {
  var box = el("div", "");
  var row = el("div", "nv-actions");
  var out = el("div", "nv-demoout");   // where a demo action reports back

  // Två grupper. Vänster handlar om KUNDEN och är det enda som skulle lämna
  // huset; höger handlar om att RAPPORTERA VIDARE internt. Att blanda dem gav
  // sex likvärdiga knappar där bara en har verkliga konsekvenser.
  function group(title) {
    var g = el("div", "nv-grp");
    g.appendChild(set(el("span", "nv-grp-h"), title));
    var btns = el("div", "nv-grp-btns");
    g.appendChild(btns);
    row.appendChild(g);
    return btns;
  }
  var toCust = group("Reply to customer");
  var onward = group("Report onward");

  function say(text, cls) {
    out.innerHTML = "";   // this app has no clear() helper
    var line = el("div", "nv-said" + (cls ? " " + cls : ""));
    line.appendChild(document.createTextNode(text));
    line.appendChild(set(el("span", "nv-demotag"), "demo"));
    out.appendChild(line);
  }

  // ── inert: a customer reply is a real external write ──
  function inert(label, cls) {
    var b = document.createElement("button");
    b.className = "nv-btn" + (cls ? " " + cls : "");
    b.appendChild(document.createTextNode(label));
    b.appendChild(set(el("span", "dm"), "preview"));
    b.disabled = true;
    b.title = "Preview of the in-Freshdesk widget. This page never sends anything " +
      "to a customer.";
    return b;
  }
  // Send reply förblir inert: det är den enda riktiga externa skrivningen.
  toCust.appendChild(inert("Send reply", "primary"));

  // Edit first FÅR agera. Att redigera texten stannar på sidan, och då gäller
  // samma regel som för de andra demoknapparna. En knapp som inte gör något
  // alls är sämre än ingen knapp — det var därför den kändes trasig.
  var editBtn = demoBtn("Edit first", "on this page", function () {
    var box = wrap.querySelector(".nv-draft");
    if (!box) { say("There is no draft to edit in this note."); return; }
    if (box.querySelector("textarea")) return;   // redan öppen

    var current = box.innerText.replace(/\n{3,}/g, "\n\n").trim();
    var ta = document.createElement("textarea");
    ta.className = "nv-edit";
    ta.value = current;
    ta.setAttribute("aria-label", "Edit the draft");
    box.innerHTML = "";
    box.appendChild(ta);
    ta.style.height = Math.max(120, ta.scrollHeight) + "px";
    ta.focus();

    var bar = el("div", "nv-editbar");
    var copy = document.createElement("button");
    copy.className = "nv-btn";
    copy.textContent = "Copy the text";
    copy.onclick = function () {
      ta.select();
      var done = false;
      try { done = document.execCommand("copy"); } catch (_e) { done = false; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(function () {
          say("Text copied. Paste it into Freshdesk when you reply.", "ok");
        }, function () {
          say(done ? "Text copied." : "Could not copy — select and copy manually.");
        });
      } else {
        say(done ? "Texten kopierad." : "Kunde inte kopiera — markera och kopiera manuellt.");
      }
    };
    bar.appendChild(copy);
    box.appendChild(bar);

    say("The draft is open for editing. Changes are not saved here — copy the text " +
      "and paste it into Freshdesk, where the reply is actually sent.");
  });
  toCust.appendChild(editBtn);

  // ── demo: Linear ──
  var lin = "LIN-" + (2100 + ((Number(r.ticket_id) || 0) % 140));
  var votes = 4 + ((Number(r.ticket_id) || 0) % 9);
  onward.appendChild(demoBtn("Attach to " + lin, "demo", function () {
    say("Ticket attached to " + lin + " · " + (votes + 1) +
      " votes. The customer can vote via the link in the reply.", "ok");
  }));

  // ── demo: Planhat ──
  onward.appendChild(demoBtn("Copy in CSM", "demo", function () {
    var d = demoPlanhat(r.ticket_id);
    say("CSM " + d.csm + " copied in. Activity created on the account.", "ok");
  }));

  // ── demo: Confluence ──
  // Från genomgången: "Start Confluence draft" står på tre av scenarioslidesen.
  // Det är loopens första steg — luckan blir en uppgift i samma ögonblick den
  // hittas, i stället för att glömmas bort när ärendet stängs.
  onward.appendChild(demoBtn("Start Confluence draft", "demo", function () {
    say("Draft started in Confluence · Customer Care — \u201C" +
      (r.subject || "The ticket") + "\u201D. It sits under 📝 Artiklar until " +
      "someone reviews and approves it.", "ok");
  }));

  // ── demo: Scribe ──
  // Placed with the others rather than hidden behind a gap check: the point of a
  // demo button is that it can be found.
  onward.appendChild(scribeBtn(r, say));

  var wrong = document.createElement("button");
  wrong.className = "nv-wrong";
  wrong.textContent = "Wrong — tell us why";
  wrong.onclick = function () {
    // The one action that is not a demo: go and judge it.
    tab = "todo";
    search = String(r.ticket_id);
    render();
    window.scrollTo(0, 0);
  };
  row.appendChild(wrong);

  box.appendChild(row);
  box.appendChild(out);
  // EN rad kvar, inte fyra: etiketten sitter numera på knappen den gäller.
  box.appendChild(set(el("p", "nv-preview"),
    "None of these buttons leave this page."));
  return box;
}

// `tag` är knappens standardetikett — "demo" när systemet inte är anslutet,
// "på sidan" när handlingen är verklig men stannar i webbläsaren. Den ersätter
// fotnoten som räknade upp samma sak i löptext.
function demoBtn(label, tag, onClick) {
  var b = document.createElement("button");
  b.className = "nv-btn";
  b.appendChild(document.createTextNode(label));
  if (tag) b.appendChild(set(el("span", "dm"), tag));
  b.title = tag === "demo"
    ? "Demo — the system is not connected. Nothing leaves this page."
    : "Happens in the browser. Nothing leaves this page.";
  b.onclick = function () { b.classList.add("used"); onClick(); };
  return b;
}

// The documentation loop from the walkthrough: a gap is found, the agent solves
// it while Scribe captures the steps, and the recording becomes a draft article.
// Here it is a timer and a confirmation — enough to show the loop, and nothing
// is captured, because recording an agent's screen needs MBL consultation and a
// DPA with Scribe as a processor before it may start at all.
function scribeBtn(r, say) {
  var b = document.createElement("button");
  b.className = "nv-btn nv-rec";
  b.title = "Demo — no screen is recorded. Recording requires MBL consultation and a DPA first.";
  var timer = null, seconds = 0;

  // Etiketten skrivs om varje sekund, så den standardiserade "demo"-brickan
  // måste sättas tillbaka varje gång — annars försvinner den vid första ticket.
  function label(text) {
    b.textContent = text;
    b.appendChild(set(el("span", "dm"), "demo"));
  }
  function idle() {
    b.classList.remove("on");
    label("⏺ Record the solution");
  }
  function tick() {
    seconds++;
    var m = String(Math.floor(seconds / 60)).padStart(2, "0");
    var ss = String(seconds % 60).padStart(2, "0");
    label("⏹ Recording " + m + ":" + ss + " — click to stop");
  }

  b.onclick = function () {
    if (timer) {
      clearInterval(timer); timer = null;
      var mins = Math.max(1, Math.round(seconds / 60));
      idle();
      say("Recording stopped (" + seconds + " s). Draft article created in " +
        "Confluence — \u201C" + (r.subject || "The ticket") + "\u201D — awaiting review. " +
        "Estimated reading time " + mins + " min.", "ok");
      seconds = 0;
      return;
    }
    seconds = 0;
    b.classList.add("on");
    tick();
    timer = setInterval(tick, 1000);
    say("Recording started. Scribe captures every step and system while you solve " +
      "the ticket. Nothing is actually recorded here.", "rec");
  };

  idle();
  return b;
}

var fTrained = "";

function noteControlsEl() {
  var box = el("div", "controls");

  // The point of the filter: put a trained note beside an untrained one for the
  // same kind of ticket, and see whether the training shows.
  var nTrained = rows.filter(usedTraining).length;
  if (nTrained) {
    box.appendChild(selectEl("Trained and untrained", [
      ["gold", "★ Trained only (" + nTrained + ")"],
      ["base", "Untrained only (" + (rows.length - nTrained) + ")"],
    ], fTrained, function (v) { fTrained = v; renderList(); }));
  }

  var inp = document.createElement("input");
  inp.type = "search"; inp.className = "search";
  inp.placeholder = "Search ticket, subject or reply…";
  inp.setAttribute("aria-label", "Search notes");
  inp.value = search;
  inp.oninput = function () { search = inp.value; renderList(); };
  box.appendChild(inp);
  return box;
}

function renderAgentNotes() {
  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";
  cardEls = []; activeIdx = -1;

  var q = search.trim().toLowerCase();
  var list = rows.filter(function (r) {
    if (r.prompt_version === "agent-scan") return false; // history scans carry no note
    if (fTrained === "gold" && !usedTraining(r)) return false;
    if (fTrained === "base" && usedTraining(r)) return false;
    if (!q) return true;
    return (String(r.ticket_id) + " " + (r.subject || "") + " " + (r.draft || ""))
      .toLowerCase().indexOf(q) >= 0;
  });

  var intro = el("div", "nv-intro");
  intro.innerHTML = "This is the private note as the <b>agent</b> reads it on the ticket — " +
    "coaching, not evaluation. Judging a draft and writing the ideal answer happen in " +
    "<b>To review</b>; nothing here records a verdict." +
    (PLANHAT_DEMO
      // The cells are no longer chipped individually, so this line is the only
      // disclosure — it has to name every field it covers.
      ? " Fields chipped <b>sample</b> are placeholder data — the requester name and " +
        "company, and the account, renewal, health, CSM and open-ticket cells. Those are " +
        "not stored or not connected, so they are illustrative and must not be acted on. " +
        "The ticket id, subject, customer message, sources and draft are all real."
      : "");
  lw.appendChild(intro);

  if (!list.length) {
    lw.appendChild(set(el("div", "empty"), "Nothing matches."));
    return;
  }

  lw.appendChild(workflowEl());
  lw.appendChild(sourcesEl());
  if (!dataStatus.loaded) {
    // Counts arrive a beat later; re-render once so the panel is never wrong,
    // only briefly less specific.
    loadDataStatus().then(function () { if (tab === "note") renderAgentNotes(); });
  }

  lw.appendChild(set(el("p", "nv-hint"),
    "One ticket is open at a time. Click a row to open it — arrow keys (or j/k) move " +
    "between rows."));

  // ETT KORT ÅT GÅNGEN. Hundra utfällda kort är inte en lista, det är hundra
  // sidor på rad: man tappar överblicken över vilka ärenden som finns och kan
  // inte jämföra dem. Hopfällt bär raden det som avgör om man vill öppna den —
  // läget, kunden, ämnet, och en mening om vad AI:n rekommenderar.
  var openIdx = -1;
  list.forEach(function (r, i) {
    var row = compactRowEl(r, function () { openAt(i); });
    row._activate = function () { openAt(i); };
    cardEls.push(row);
    lw.appendChild(row);
  });

  function openAt(i) {
    if (openIdx === i) return;
    if (openIdx >= 0) {
      var prev = cardEls[openIdx];
      prev.classList.remove("open");
      var body = prev.querySelector(".nv-rowbody");
      if (body) prev.removeChild(body);
      prev.querySelector(".nv-rowhead").setAttribute("aria-expanded", "false");
    }
    openIdx = i;
    // Klick och piltangenter måste peka på SAMMA rad. Utan den här raden
    // fortsatte tangentnavigeringen från den senast piltangent-valda raden,
    // så första piltryckningen efter ett klick hoppade tillbaka.
    if (activeIdx !== i) {
      if (activeIdx >= 0 && cardEls[activeIdx]) cardEls[activeIdx].classList.remove("active");
      activeIdx = i;
      cardEls[i].classList.add("active");
    }
    var cur = cardEls[i];
    cur.classList.add("open");
    var wrapEl = el("div", "nv-rowbody");
    wrapEl.appendChild(noteViewEl(list[i]));
    cur.appendChild(wrapEl);
    cur.querySelector(".nv-rowhead").setAttribute("aria-expanded", "true");
  }

  openAt(0);
  activeIdx = 0;
  cardEls[0].classList.add("active");
}

// Den hopfällda raden. Den ska svara på "är det här ärendet värt att öppna?"
// och ingenting mer — därför läge, kund, ämne och EN mening, inte en
// sammanfattning av notisen.
function compactRowEl(r, onOpen) {
  var mode = NOTE_MODE[r.coach_mode] || NOTE_MODE.COACH_AGENT;
  var row = el("div", "nv-row" + (mode.cls ? " " + mode.cls : ""));

  var head = document.createElement("button");
  head.type = "button";
  head.className = "nv-rowhead";
  head.setAttribute("aria-expanded", "false");
  head.onclick = onOpen;

  head.appendChild(set(el("span", "nv-rowmode" + (mode.cls ? " " + mode.cls : "")),
    mode.icon + " " + mode.badge));

  var who = PLANHAT_DEMO ? demoRequester(r.ticket_id, r.draft).company : null;
  head.appendChild(set(el("span", "nv-rowwho"), who || ("#" + r.ticket_id)));
  head.appendChild(set(el("span", "nv-rowsubj"), r.subject || "(no subject)"));

  // En mening om rekommendationen: första steget om det finns, annars första
  // meningen i utkastet, annars att coachen avstod.
  var steps = Array.isArray(r.resolution_steps) ? r.resolution_steps : [];
  var line = steps.length ? steps[0]
    : (r.draft && r.draft.trim()) ? firstSentence(r.draft)
    : "The coach abstained — the judgement is yours.";
  head.appendChild(set(el("span", "nv-rowrec"), line));

  head.appendChild(set(el("span", "nv-caret"), "▸"));
  row.appendChild(head);
  return row;
}

// Första MENINGSBÄRANDE meningen. Nästan varje utkast öppnar med "Hej!" eller
// "Hei," — som enradssammanfattning säger den ingenting, så korta inledningar
// slås ihop med nästa mening tills raden faktiskt bär innehåll.
function firstSentence(text) {
  var t = String(text).replace(/\s+/g, " ").trim();
  var out = "";
  var re = /[^.!?]*[.!?]|[^.!?]+$/g, m;
  while ((m = re.exec(t)) !== null) {
    out = (out ? out + " " : "") + m[0].trim();
    if (out.length >= 40) break;
  }
  if (!out) out = t;
  return out.length > 150 ? out.slice(0, 147) + "…" : out;
}

// QA score → colour band: red < 60, amber 60-74, green 75+ (or red if flagged).
function qaCls(score, needsReview) {
  return (needsReview || score < 60) ? "bad" : score < 75 ? "c-low" : "c-high";
}
// Coach mode (Fas 3) → short label + colour class.
function modeLabel(m) {
  return m === "REPLY_READY" ? "🟢 Reply ready"
    : m === "AGENT_ACTION_REQUIRED" ? "🔴 Action required"
    : "🟡 Coach";
}
function modeCls(m) {
  return m === "REPLY_READY" ? "m-ready" : m === "AGENT_ACTION_REQUIRED" ? "m-action" : "m-coach";
}
// QA-coach breakdown: an expandable per-criterion 1–5 table + top improvements.
function qaDetailsEl(a, label) {
  var d = document.createElement("details");
  var sum = document.createElement("summary");
  sum.textContent = label + (a.totalScore != null ? " · " + a.totalScore + "/100" : "") + (a.verdict ? " " + a.verdict : "");
  d.appendChild(sum);
  var body = el("div", "qabody");
  for (var i = 0; i < a.scorecard.length; i++) {
    var c = a.scorecard[i];
    var row = el("div", "qarow");
    var sc = el("span", "qs s" + (c.score || 0)); sc.textContent = (c.score != null ? c.score : "–") + "/5";
    row.appendChild(sc);
    row.appendChild(set(el("span", "qn"), c.criterion || c.criterionId || "—"));
    if (c.rationale) row.appendChild(set(el("span", "qr"), c.rationale));
    body.appendChild(row);
  }
  if (Array.isArray(a.topThreeImprovements) && a.topThreeImprovements.length) {
    var imp = el("div", "qaimp");
    imp.appendChild(set(el("span", "qn"), "Top improvements:"));
    var ul = document.createElement("ul");
    a.topThreeImprovements.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
    imp.appendChild(ul); body.appendChild(imp);
  }
  d.appendChild(body); return d;
}
function tag(text, cls) { return set(el("span", "tag" + (cls ? " " + cls : "")), esc(text)); }
function set(node, text) { node.textContent = text; return node; }
function el(t, cls) { var e = document.createElement(t); if (cls) e.className = cls; return e; }
</script>
</body>
