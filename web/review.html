<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Review — Simployer Gate 1</title>
<style>
  /* ── ONE palette (2026-08-05) ────────────────────────────────────────────
     The private note's design is now the standard for the whole app, per
     Tobias. It previously had its own --nv-* palette, on the reasoning that
     training the AI and coaching the agent are different jobs and restyling
     one must not disturb the other. That separation of FUNCTION stands — they
     are still separate tabs. The separation of visual LANGUAGE does not: two
     palettes in one app read as two half-finished apps.

     The design statement is the three-state scale. Positive is the TEAL, not a
     separate green: "ready to send" and "grounded" are the same signal as the
     primary action, so they are the same colour. Amber is burnt rather than
     yellow, red is brick rather than crimson — both readable on paper, neither
     shouting.

     The --nv-* names are kept as ALIASES rather than search-replaced, so the
     note's ~60 rules keep reading in their own vocabulary and a future
     re-divergence is one block of edits, not sixty. */
  :root{
    /* Taken VERBATIM from the uploaded mockups — coach_review_coaching_tab.html
       for the app shell, private_note_freshdesk_v5.html for the note's paper.
       Six of these had drifted when the palette was unified, because I derived
       them by hand instead of copying them. Two drifts were plainly visible: the
       page background was a full step darker (I had used the mockup's --line2
       where its --bg belonged), and the note's cream was far too pale. */
    --ink:#16232E;--ink-2:#41535F;--ink-3:#7A8B95;
    --bg:#F6F8F9;--surface:#FFFFFF;--surface-2:#F0F3F4;--border:#E1E7E9;
    --accent:#0F7173;--accent-soft:#E3EFEF;--accent-edge:#BFD8D8;
    /* good IS the accent teal — see above */
    --good:#0F7173;--good-soft:#E3EFEF;
    --warn:#B45A09;--warn-soft:#FBEDDD;
    --crit:#9E3227;--crit-soft:#F8E6E3;
    --info:#5B7089;
    /* The one thing that stays specific to a note: the warm paper that makes it
       read as a NOTE rather than as another panel of the review tool. */
    --paper-warm:#FFF9E3;--paper-warm-edge:#EFE0B0;
    --bar-off:#D8E1E3;
    /* Text on a solid teal/amber/red fill. White in light mode; in dark the
       accents are bright enough that white on them is unreadable, so it flips
       to the page ink. One token, so every solid badge and button flips with
       it instead of each being remembered separately. */
    --on-solid:#fff;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --radius:8px;--shadow:0 1px 2px rgba(22,35,46,.05),0 4px 16px rgba(22,35,46,.05);

    /* THE TWO MOCKUPS DISAGREE, AND BOTH ARE RIGHT.
       private_note_freshdesk_v5.html and coach_review_coaching_tab.html use the
       same token NAMES with different values: the note's secondary ink, tertiary
       ink and rule are each a shade warmer and softer than the shell's. Unifying
       the palette made --nv-* alias the shell, which quietly overwrote all three
       — the note was drawn in the app's greys instead of its own.
       These four therefore carry the note mockup's own values, not aliases. */
    --nv-ink:var(--ink);           /* #16232E — the one both mockups agree on */
    --nv-ink-2:#42545F;            /* shell has #41535F */
    --nv-ink-3:#7C8D97;            /* shell has #7A8B95 */
    --nv-rule:#DDE4E6;             /* shell has #E1E7E9 */
    /* The note sits on a slightly darker canvas than the app shell (#EEF1F2 vs
       #F6F8F9) so the paper lifts off it. */
    --nv-paper:var(--surface);--nv-canvas:#EEF1F2;
    --nv-note:var(--paper-warm);--nv-note-edge:var(--paper-warm-edge);
    --nv-teal:var(--accent);--nv-teal-soft:var(--accent-soft);--nv-teal-edge:var(--accent-edge);
    --nv-amber:var(--warn);--nv-amber-soft:var(--warn-soft);
    --nv-red:var(--crit);--nv-red-soft:var(--crit-soft);
    --nv-bar:var(--bar-off);
  }
  /* NO DARK MODE — removed 2026-08-06.
     The design is the beige note on light paper (private_note_freshdesk_v5.html
     and coach_review_coaching_tab.html). Following the reader's OS theme turned
     the whole app dark navy, which is why it never matched the mockups no matter
     how many tokens were corrected: the tokens were right and the theme was
     overriding all of them.

     A note is a piece of paper. It has one colour, and the room's lighting does
     not change it. If dark mode is ever wanted it needs its own designed palette
     rather than an inverted one — which is a design decision, not a media query. */
  :root{color-scheme:light}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-variant-numeric:tabular-nums}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
  /* Notisfliken är ett instrumentkort, inte löptext: den ska använda skärmen.
     Övriga flikar behåller den smala spalten, där en mätt radlängd är poängen. */
  body.tab-note .wrap{max-width:1320px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-size:22px;margin:2px 0 0;letter-spacing:-.02em}
  .who{margin-left:auto;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:10px}
  button{font-family:inherit;cursor:pointer}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.small{padding:4px 9px;font-size:12px}
  .link{background:none;border:0;color:var(--accent);font-size:13px;padding:0;text-decoration:underline;cursor:pointer}

  .auth{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .auth h2{margin:0 0 4px;font-size:19px}
  .auth p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  input{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-solid);width:100%;padding:11px;font-size:14px}
  .btn.primary:hover{filter:brightness(1.06)}
  .msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:6px}
  .msg.ok{background:var(--good-soft);color:var(--good)}
  .msg.err{background:var(--crit-soft);color:var(--crit)}

  .help{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:0 16px;margin:16px 0 0}
  .help>summary{cursor:pointer;padding:14px 0;font-weight:650;font-size:14px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  .help>summary::-webkit-details-marker{display:none}
  .help>summary::before{content:"❔";font-size:15px}
  .help .hbody{padding:0 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .help .hbody>p{margin:0 0 6px}
  .help h4{margin:14px 0 4px;font-size:11.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .help ul{margin:2px 0;padding-left:18px}
  .help li{margin:3px 0}
  .help b{color:var(--ink)}
  .bar{display:flex;gap:8px;align-items:center;margin:18px 0 16px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:var(--on-solid)}
  .count{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}

  /* Every card carries the note's coloured rail. It is the design's one
     load-bearing element: the state of the thing is legible before a word is
     read, and it is the same teal/amber/red scale everywhere. */
  .card{--rail:var(--border);background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:inset 5px 0 0 var(--rail),var(--shadow);
    padding:16px 18px 16px 22px;margin-bottom:14px}
  .card.m-ready{--rail:var(--accent)}
  .card.m-coach{--rail:var(--warn)}
  .card.m-action{--rail:var(--crit)}
  /* Articles use the same scale: teal = settled, amber = your decision is
     wanted, red = it went wrong. */
  .card.art.a-approved{--rail:var(--accent)}
  .card.art.a-drafted{--rail:var(--warn)}
  .card.art.a-rejected,.card.art.a-failed{--rail:var(--crit)}
  .chead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
  .chead .id{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-decoration:none}
  .chead a.id:hover{color:var(--accent);text-decoration:underline}
  .chead .subj{font-weight:650;font-size:15px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--ink-2)}
  .tag.c-high{background:var(--good-soft);color:var(--good)}
  .tag.c-low{background:var(--warn-soft);color:var(--warn)}
  .tag.c-none{background:var(--surface-2);color:var(--ink-3)}
  .tag.qa{background:var(--accent-soft);color:var(--accent)}
  .tag.review,.tag.bad{background:var(--crit-soft);color:var(--crit)}
  /* coach mode (Fas 3): green ready / amber coach / red action-required */
  .tag.m-ready,.tag.m-coach,.tag.m-action{color:var(--on-solid);font-family:var(--sans);
    font-weight:700;letter-spacing:.08em;border-radius:4px;padding:3px 9px}
  .tag.m-ready{background:var(--accent)}
  .tag.m-coach{background:var(--warn)}
  .tag.m-action{background:var(--crit)}
  /* reason-code summary on judged cards */
  .reasonline{font-size:12.5px;color:var(--warn);margin:-4px 0 12px}
  /* QA-coach per-criterion breakdown */
  .qabody{padding:4px 12px 10px}
  .qarow{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:13px;flex-wrap:wrap}
  .qarow .qn{font-weight:600;color:var(--ink)}
  .qarow .qr{color:var(--ink-2);font-size:12.5px}
  .qs{font-family:var(--mono);font-size:11.5px;font-weight:700;min-width:34px;text-align:center;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
  .qs.s1,.qs.s2{background:var(--crit-soft);color:var(--crit)}
  .qs.s3{background:var(--warn-soft);color:var(--warn)}
  .qs.s4,.qs.s5{background:var(--good-soft);color:var(--good)}
  .qaimp ul{margin:4px 0;padding-left:18px}
  .qaimp li{font-size:12.5px;color:var(--ink-2)}
  /* readable prose: real paragraphs, comfortable size, capped line length (#1) */
  .prose{font-size:15px;line-height:1.65;max-width:70ch;color:var(--ink)}
  .prose p{margin:0 0 10px;white-space:pre-wrap}
  .prose p:last-child{margin:0}
  /* customer's original question, distinct + at the top of the card (#2) */
  .custq{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--info);border-radius:6px;padding:10px 14px;margin:2px 0 12px}
  .custq .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--info);display:block;margin-bottom:6px}
  /* Key takeaways + the collapsed raw thread. */
  .tk-qs{margin:0 0 6px;padding-left:20px}
  .tk-qs li{font-size:14.5px;line-height:1.55;margin:0 0 4px;color:var(--ink)}
  .tk-fallback{margin:0 0 6px;font-size:14.5px;line-height:1.6;color:var(--ink);white-space:pre-wrap}
  .tk-un{margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--ink-2)}
  .tk-toggle{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:11.5px;
    letter-spacing:.03em;color:var(--accent);background:none;border:0;padding:0;cursor:pointer}
  .tk-toggle:hover{text-decoration:underline}
  .tk-full{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .tk-full .prose{font-size:13.5px;color:var(--ink-2)}
  .tk-note{margin:8px 0 0;font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .subs{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:12px 14px;margin:0 0 12px;overflow-x:auto}
  .subs .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px}
  .subs .sstate{font-size:13.5px;color:var(--ink-2);margin:0}
  .subs table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px}
  .subs th,.subs td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
  .subs th{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
  .draftlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin:2px 0 5px}
  .draft{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:14px 16px;margin:0 0 12px}
  .refbox{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:12px 14px;margin:0 0 12px}
  .refbox .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--good);display:block;margin-bottom:6px}
  .gold{margin:2px 0 12px}
  .gold .gl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
  textarea{width:100%;min-height:88px;font-family:inherit;font-size:14.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .fmtbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
  .fbtn{font-size:12.5px;padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink);cursor:pointer}
  .fbtn:hover{border-color:var(--accent)}
  .goldedit{width:100%;min-height:88px;font-family:inherit;font-size:14.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);overflow:auto;white-space:pre-wrap}
  .goldedit:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .goldedit:empty::before{content:attr(data-placeholder);color:var(--muted);pointer-events:none}
  .goldedit ul,.goldedit ol{margin:4px 0 4px 22px;white-space:normal}
  .crmverdict{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .crmhint{flex:1 1 240px;min-width:200px;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--ink)}
  .crmverdict .btn.sel{outline:2px solid var(--accent)}
  /* Coaching tab (2026-08-04) — read-only measurement of the coaching half */
  .cbanner{display:flex;align-items:center;gap:9px;margin:0 0 18px;background:var(--accent-soft);
    border:1px solid var(--border);border-radius:6px;padding:10px 14px;font-size:12.5px;color:var(--ink)}
  .csec{margin:28px 0 10px}
  .chead{font-size:13px;font-weight:700;letter-spacing:.02em;margin:0 0 4px}
  .chint{font-size:12.5px;color:var(--ink-3);margin:0 0 12px;line-height:1.55}
  .chint.bad{color:var(--crit)}
  .ctiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .ctiles.three{grid-template-columns:repeat(3,1fr)}
  .ctile{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
  .ctile.pending .cv{color:var(--ink-3)}
  .ck{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:650;margin-bottom:7px}
  .cv{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .cd{font-size:11.5px;color:var(--ink-3);margin-top:7px;line-height:1.4}
  .ctiming{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 18px}
  .cbar{display:flex;height:26px;border-radius:4px;overflow:hidden;margin:4px 0 9px}
  .cbar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;color:#fff;min-width:0}
  .clegend{display:flex;gap:18px;font-size:11.5px;color:var(--ink-2);flex-wrap:wrap;margin-bottom:6px}
  .clegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
  .ctable{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);
    border-radius:8px;overflow:hidden;margin-bottom:8px}
  .ctable th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);
    font-weight:650;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
  .ctable td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top}
  .ctable tr:last-child td{border-bottom:none}
  .ctable tr.hold{background:var(--surface-2)}
  .cstep{color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.45}
  .cmix{margin-bottom:18px}
  .cbudget{border:1px solid var(--border);border-left:3px solid var(--good);border-radius:6px;
    padding:10px 14px;margin-bottom:10px;font-size:12.5px;background:var(--surface);line-height:1.55}
  .cbudget.over{border-left-color:var(--crit)}
  /* A note whose draft was written with the reviewers' gold answers in the
     prompt. Teal, because on this palette teal is the positive signal. */
  .tag.trained{background:var(--accent);color:var(--on-solid);font-weight:700;letter-spacing:.06em}
  .nv-trained{display:inline-flex;align-items:center;background:var(--nv-teal);
    color:var(--on-solid);border-radius:4px;font-size:10px;font-weight:700;
    letter-spacing:.07em;padding:3px 8px;text-transform:uppercase}
  .tag.p-yes{background:var(--good-soft);color:var(--good)}
  .tag.p-no{background:var(--crit-soft);color:var(--crit)}
  .tag.p-na{background:var(--surface-2);color:var(--ink-3)}
  .cfail{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--crit);
    border-radius:6px;padding:12px 14px;margin-bottom:9px}
  .cfail.late{border-left-color:var(--warn)}
  .cfail .fh{font-size:12.5px;font-weight:650;margin-bottom:4px}
  .cfail .fb{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .cfail .fm{font-size:11.5px;color:var(--ink-3);margin-top:6px}
  .cfoot{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);
    font-size:11.5px;color:var(--ink-3);line-height:1.7}
  .tag.c-meas{background:var(--accent-soft);color:var(--accent)}
  .tag.c-wait{background:var(--surface-2);color:var(--ink-3)}
  @media (max-width:880px){ .ctiles,.ctiles.three{grid-template-columns:repeat(2,1fr)} }
  /* ── Agent note tab: the private note as the agent reads it ──────────────
     Its own palette (--nv-*), because coaching an agent and training the AI are
     different jobs for different readers. */
  .nv-intro{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin:0 0 16px;
    padding-left:12px;border-left:2px solid var(--border)}
  .nv{margin:0 0 22px;color:var(--nv-ink)}
  .nv-ticket{background:var(--nv-paper);border:1px solid var(--nv-rule);
    border-radius:10px 10px 0 0;border-bottom:none;padding:16px 20px}
  .nv-who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .nv-id{font-family:var(--mono);font-size:12px;color:var(--nv-ink-3);text-decoration:none}
  .nv-id:hover{color:var(--nv-teal);text-decoration:underline}
  .nv-subj{font-size:13px;font-weight:650;color:var(--nv-ink)}
  .nv-meta{font-size:11.5px;color:var(--nv-ink-3);margin-top:2px}
  .nv-body{font-size:13.5px;color:var(--nv-ink-2);line-height:1.55;margin-top:10px}
  .nv-body p{margin:0 0 6px}
  .nv-body p:last-child{margin-bottom:0}
  /* The customer's own words, quoted — it is a quotation, and the marks stop it
     reading as the app's prose. */
  .nv-body.quoted p:first-child::before{content:"\201C"}
  .nv-body.quoted p:last-child::after{content:"\201D"}

  .nv-note{display:flex;background:var(--nv-note);border:1px solid var(--nv-note-edge);
    border-radius:0 0 10px 10px;box-shadow:0 1px 2px rgba(22,35,46,.05);overflow:hidden}
  .nv-rail{width:5px;flex:0 0 5px;background:var(--nv-teal)}
  .nv-rail.amber{background:var(--nv-amber)}
  .nv-rail.red{background:var(--nv-red)}
  .nv-inner{flex:1;min-width:0;padding:16px 20px 15px}

  .nv-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .nv-mode{display:inline-flex;align-items:center;background:var(--nv-teal);color:var(--on-solid);
    border-radius:4px;font-size:10.5px;font-weight:700;letter-spacing:.08em;
    padding:4px 9px;text-transform:uppercase}
  .nv-mode.amber{background:var(--nv-amber)}
  .nv-mode.red{background:var(--nv-red)}
  .nv-conf{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--nv-ink-2)}
  .nv-bars{display:flex;gap:2px}
  .nv-bars i{width:12px;height:5px;border-radius:1px;background:var(--nv-bar);display:block}
  .nv-bars i.on{background:var(--nv-teal)}
  .nv-bars.amber i.on{background:var(--nv-amber)}
  .nv-bars.red i.on{background:var(--nv-red)}
  .nv-stamp{margin-left:auto;font-size:11px;color:var(--nv-ink-3)}

  .nv-crm{margin-bottom:14px}
  .nv-cust{display:flex;flex-wrap:wrap;border:1px solid var(--nv-rule);
    background:var(--nv-paper);border-radius:7px;padding:2px 0}
  /* Cells share the width evenly so the strip reads as one bar, as in the
     design — content-width cells left a ragged gap on the right. */
  .nv-cust div{flex:1 1 0;padding:8px 16px;border-right:1px solid var(--nv-rule);min-width:110px}
  .nv-cust div:last-child{border-right:none}
  .nv-cust dt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--nv-ink-3);font-weight:650;margin:0 0 2px}
  .nv-cust dd{margin:0;font-size:12.5px;font-weight:600;color:var(--nv-ink)}
  /* Sample fields are LABELLED, not disfigured. The earlier version also hatched
     and dimmed them, which made a populated strip read as a broken one; the chip
     alone says the same thing without wrecking the design. */
  .nv-demotag{display:inline-block;margin-left:6px;font-size:8.5px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--nv-amber);
    background:var(--nv-amber-soft);border-radius:2px;padding:1px 4px;vertical-align:1px}
  .nv-matched{font-size:11.5px;color:var(--nv-ink-3);margin-top:5px}
  .nv-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    margin-right:5px;vertical-align:1px;background:var(--nv-ink-3)}
  .nv-dot.green{background:var(--nv-teal)}
  .nv-dot.amber{background:var(--nv-amber)}
  .nv-dot.red{background:var(--nv-red)}

  .nv-warn{font-size:12.5px;color:var(--nv-amber);background:var(--nv-amber-soft);
    border-radius:6px;padding:9px 13px;margin-bottom:14px}
  .nv-quiet{font-size:12.5px;color:var(--nv-ink-3);margin-bottom:14px}

  .nv-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--nv-ink-3);font-weight:700;margin:0 0 8px}
  .nv-lang{float:right;font-size:10px;font-weight:700;color:var(--nv-ink-3);letter-spacing:.06em}
  .nv-facts{list-style:none;margin:0 0 15px;padding:0}
  .nv-facts li{font-size:13.2px;line-height:1.5;color:var(--nv-ink);
    padding:0 0 7px;display:flex;gap:9px}
  .nv-facts li:last-child{padding-bottom:0}
  /* Källchips som i bild 2: breda, fyllda piller med luft — inte smala
     outline-etiketter. Bredden är fast så att texten bredvid dem radar upp sig
     i en kolumn, vilket är det som gör listan skannbar. */
  .nv-src{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--nv-ink-2);border:1px solid transparent;
    background:#E7EDEF;border-radius:6px;padding:7px 12px;margin-top:0;
    height:fit-content;min-width:118px;text-align:center;line-height:1.2}
  /* TRE lägen, inte två. Poängen är att kunna läsa av på en sekund hur mycket
     vi faktiskt hittade:
       grönt  — källan gav något att gå på (ett ärende-id att öppna, en artikel)
       rött   — vi läste den och den hade inget
       grått  — inte kontrollerad, eller inte ansluten
     Skillnaden mellan "hittade inget" och "kollade inte" är den agenten agerar
     olika på, och den fanns inte förut. */
  .nv-src.hit{color:var(--nv-teal);background:var(--nv-teal-soft)}
  .nv-src.miss{color:var(--nv-red);background:var(--nv-red-soft)}
  .nv-src.na{color:var(--nv-ink-3);background:#E7EDEF}
  .nv-src.none{color:var(--nv-ink-3);background:#E7EDEF}
  .nv-src.bad{color:var(--nv-red);background:var(--nv-red-soft)}

  /* En rad per system, hopfälld. Vänsterkanten bär läget så att hela listan
     går att läsa av i en svep utan att läsa texten. */
  .nv-sys{display:grid;gap:6px;margin-bottom:15px}
  .nv-sysrow{border-left:3px solid var(--nv-rule);border-radius:0 6px 6px 0;
    background:var(--nv-paper);padding:2px 0}
  .nv-sysrow.hit{border-left-color:var(--nv-teal)}
  .nv-sysrow.bad{border-left-color:var(--nv-red)}
  .nv-sysrow.none,.nv-sysrow.na{border-left-color:var(--nv-rule)}
  .nv-syshead{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    font-family:inherit;background:none;border:0;padding:7px 11px;cursor:pointer}
  .nv-syshead[disabled]{cursor:default}
  .nv-syssum{flex:1;min-width:0;font-size:12.4px;color:var(--nv-ink-2);line-height:1.4}
  .nv-sysrow.none .nv-syssum,.nv-sysrow.na .nv-syssum{color:var(--nv-ink-3)}
  .nv-caret{flex:0 0 auto;font-size:11px;color:var(--nv-ink-3)}
  .nv-sysbody{margin:0;padding:2px 11px 9px 11px}
  .nv-sysbody li{padding-bottom:5px;font-size:12.5px}
  .nv-facts li{align-items:flex-start}
  .nv-fact{min-width:0}
  .nv-fact a{color:var(--nv-ink);text-decoration:none;border-bottom:1px solid var(--nv-rule)}
  .nv-fact a:hover{border-bottom-color:var(--nv-teal)}
  .nv-send{font-size:11px;color:var(--nv-teal);white-space:nowrap;border-bottom:none !important}
  /* HITTAD ≠ ANVÄND. Fylld bricka = svaret lutade sig mot källan; tonad = den
     låg framme men användes inte; streckad = fältet fanns inte när raden
     skapades. Den tredje är en egen form, inte en blekare andra, eftersom
     "vet inte" inte är en svagare grad av "nej". */
  .nv-use{display:inline-block;margin-left:7px;font-size:9px;font-weight:700;
    letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;padding:2px 6px;
    border-radius:3px;background:var(--nv-note-bg);color:var(--nv-ink-3);
    border:1px solid var(--nv-rule);vertical-align:1px}
  .nv-use.on{background:var(--nv-teal-soft);color:var(--nv-teal);border-color:var(--nv-teal-edge)}
  .nv-use.unk{border-style:dashed;background:none}
  .nv-syshead .nv-use{flex:0 0 auto;margin-left:0}

  .nv-draft{background:var(--nv-paper);border:1px solid var(--nv-rule);border-radius:7px;
    padding:14px 16px;margin-bottom:14px}
  .nv-draft p{margin:0 0 9px;font-size:13.4px;line-height:1.6;color:var(--nv-ink)}
  .nv-draft p:last-child{margin-bottom:0}
  .nv-analysis{font-size:13px;line-height:1.55;color:var(--nv-ink-2);margin-bottom:4px}
  /* ── Kompakt lista: ETT kort åt gången ────────────────────────────────────
     Raden bär läget i vänsterkanten, precis som notisens rail och källraderna,
     så samma färg betyder samma sak överallt. */
  .nv-hint{font-size:12px;color:var(--ink-3);margin:0 0 12px}
  .nv-row{border:1px solid var(--border);border-left:3px solid var(--nv-rule);
    border-radius:0 8px 8px 0;background:var(--surface);margin-bottom:7px;overflow:hidden}
  .nv-row.amber{border-left-color:var(--nv-amber)}
  .nv-row.red{border-left-color:var(--nv-red)}
  .nv-row:not(.amber):not(.red){border-left-color:var(--nv-teal)}
  .nv-row.active{box-shadow:0 0 0 2px var(--accent-soft)}
  .nv-row.open{margin-bottom:22px}
  .nv-rowhead{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;
    font-family:inherit;background:none;border:0;padding:11px 14px;cursor:pointer}
  .nv-rowhead:hover{background:var(--surface-2)}
  .nv-row.open>.nv-rowhead{border-bottom:1px solid var(--border);background:var(--surface-2)}
  .nv-rowmode{flex:0 0 auto;font-size:11px;font-weight:700;white-space:nowrap;color:var(--nv-teal)}
  .nv-rowmode.amber{color:var(--nv-amber)}
  .nv-rowmode.red{color:var(--nv-red)}
  .nv-rowwho{flex:0 0 auto;font-size:12.5px;font-weight:650;color:var(--ink);
    max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nv-rowsubj{flex:0 1 auto;font-size:12.5px;color:var(--ink-2);
    max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Rekommendationen får resten av bredden och kapas — hela poängen med raden
     är att den är EN rad. */
  .nv-rowrec{flex:1 1 0;min-width:0;font-size:12.2px;color:var(--ink-3);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nv-rowbody{padding:0 4px 4px}
  .nv-row.open .nv-caret{transform:rotate(90deg)}
  .nv-rowhead .nv-caret{flex:0 0 auto;transition:transform .12s}
  @media (max-width:900px){
    .nv-rowhead{flex-wrap:wrap;gap:4px 10px}
    .nv-rowsubj,.nv-rowrec{max-width:100%;flex:1 1 100%}
  }

  /* ── How the coach works ─────────────────────────────────────────────────
     A vertical flow. The rail carries the step number and the connecting line;
     the WHO chip is the point of the whole diagram, so it is the only coloured
     element and the four roles never share a colour. */
  .wf{border:1px solid var(--border);border-radius:8px;background:var(--surface);
    margin:0 0 14px;padding:0 16px}
  .wf>summary{cursor:pointer;list-style:none;padding:12px 0;font-size:13px;font-weight:700;
    color:var(--ink);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .wf>summary::-webkit-details-marker{display:none}
  .wf>summary::before{content:"▸";color:var(--ink-3);font-weight:400}
  .wf[open]>summary::before{content:"▾"}
  .wf-sub{font-size:11.5px;font-weight:400;color:var(--ink-3)}
  .wf-lede{margin:0 0 16px;font-size:12.8px;line-height:1.6;color:var(--ink-2);
    max-width:72ch}
  .wf-flow{display:grid;gap:0;margin-bottom:18px}
  .wf-step{display:flex;gap:14px}
  .wf-rail{flex:0 0 26px;display:flex;flex-direction:column;align-items:center}
  .wf-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:11.5px;font-weight:700;
    background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
  .wf-line{flex:1 1 auto;width:2px;background:var(--border);margin:3px 0}
  .wf-body{flex:1 1 auto;padding-bottom:16px;min-width:0}
  .wf-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:3px}
  .wf-title{font-size:13px;font-weight:650;color:var(--ink)}
  .wf-text{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink-3);max-width:74ch}
  /* Four roles, four colours. Code is the teal one because it is the step that
     makes the badge trustworthy. */
  .wf-who{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
    padding:2px 7px;border-radius:3px;white-space:nowrap;border:1px solid transparent}
  .wf-who.model{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-edge)}
  .wf-who.code{background:var(--accent);color:var(--on-solid)}
  .wf-who.system{background:var(--surface-2);color:var(--ink-3);border-color:var(--border)}
  .wf-who.human{background:var(--warn-soft);color:var(--warn)}
  .wf-step.code .wf-num{background:var(--accent);color:var(--on-solid);border-color:var(--accent)}
  .wf-step.human .wf-num{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-soft)}

  /* Where the data comes from. Status is the only coloured thing, because the
     panel exists to separate "connected" from "built but dark". */
  .ds-phase{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--border)}
  .ds-phase:first-of-type{border-top:0;padding-top:0}
  .ds-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:9px;
    margin-bottom:4px}
  .ds-card{border:1px solid var(--border);border-left:3px solid var(--border);
    border-radius:0 6px 6px 0;background:var(--surface-2);padding:10px 12px}
  .ds-card.live{border-left-color:var(--accent)}
  .ds-card.curated{border-left-color:var(--accent)}
  .ds-card.partial{border-left-color:var(--warn)}
  .ds-card.off{border-left-color:var(--warn)}
  .ds-card.blocked{border-left-color:var(--crit)}
  /* Not connected gets no colour at all — an absent source should not compete
     with a working one for attention. */
  .ds-card.planned,.ds-card.demo{border-left-color:var(--border);background:transparent;
    border-style:dashed}
  .ds-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
    flex-wrap:wrap;margin-bottom:5px}
  .ds-name{font-size:12.5px;font-weight:650;color:var(--ink)}
  .ds-status{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 6px;border-radius:3px;white-space:nowrap;
    background:var(--surface);color:var(--ink-3);border:1px solid var(--border)}
  .ds-status.live,.ds-status.curated{background:var(--accent-soft);color:var(--accent);
    border-color:var(--accent-edge)}
  .ds-status.partial,.ds-status.off{background:var(--warn-soft);color:var(--warn);
    border-color:var(--warn-soft)}
  .ds-status.blocked{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-soft)}
  .ds-metric{font-size:11px;font-variant-numeric:tabular-nums;color:var(--accent);
    margin-bottom:5px;font-weight:650}
  /* Zero is the number that matters most here, so it is not styled like a value. */
  .ds-metric.zero{color:var(--warn)}
  .ds-answers{margin:0 0 4px;font-size:12.2px;line-height:1.5;color:var(--ink-2)}
  .ds-saves{margin:0;font-size:11.8px;line-height:1.5;color:var(--ink-3)}

  .wf-outcomes{border-top:1px solid var(--border);padding-top:14px;margin-bottom:12px}
  .wf-outh{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:9px}
  .wf-out{display:flex;align-items:baseline;gap:10px;padding:7px 11px;margin-bottom:5px;
    border-radius:6px;border-left:3px solid var(--accent);background:var(--surface-2)}
  .wf-out.amber{border-left-color:var(--warn)}
  .wf-out.red{border-left-color:var(--crit)}
  .wf-outicon{flex:0 0 auto;font-size:12px}
  .wf-outname{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--ink);min-width:150px}
  .wf-outtext{flex:1 1 auto;font-size:12.2px;line-height:1.55;color:var(--ink-3);min-width:0}
  .wf-foot{margin:0 0 14px;font-size:11.5px;line-height:1.55;color:var(--ink-3)}
  @media (max-width:700px){ .wf-outname{min-width:0} .wf-out{flex-wrap:wrap} }

  /* ── Företagsfliken ──────────────────────────────────────────────────────
     Samma formspråk som notisen: vänsterkant bär betydelse, teal är positivt,
     bärnsten varnar. Produktfärgerna är konsekventa i hela fliken så att en
     stapel och ett segment betyder samma sak. */
  .fx-cov{border:1px solid var(--border);border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;background:var(--surface);padding:14px 16px;margin-bottom:14px}
  .fx-covh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-3);margin-bottom:10px}
  .fx-covgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .fx-covcell dt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-3);font-weight:650;margin:0 0 2px}
  .fx-covcell dd{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
  .fx-covcell.warn dd{color:var(--warn)}
  .fx-covnote{margin:11px 0 0;font-size:11.5px;line-height:1.55;color:var(--ink-3)}

  .fx-card{border:1px solid var(--border);border-radius:8px;background:var(--surface);
    padding:16px 18px;margin-bottom:14px}
  .fx-h{margin:0 0 4px;font-size:15px;color:var(--ink)}
  .fx-sub{margin:0 0 14px;font-size:12.5px;line-height:1.55;color:var(--ink-3)}
  .fx-none{font-size:12.5px;color:var(--ink-3);margin:2px 0}

  .fx-bars{display:grid;gap:8px;margin-bottom:16px}
  .fx-bar{display:flex;align-items:center;gap:12px}
  .fx-barlab{flex:0 0 150px;font-size:12.5px;color:var(--ink-2)}
  .fx-track{flex:1 1 auto;height:18px;background:var(--surface-2);border-radius:4px;overflow:hidden}
  .fx-fill{height:100%;border-radius:4px}
  .fx-fill.one{background:var(--accent)}
  .fx-fill.classic{background:#7AA7B8}
  .fx-fill.other{background:#C3CDD1}
  /* "Ingen produkt satt" är inte en produkt — den ska inte se ut som en. */
  .fx-fill.unk{background:repeating-linear-gradient(45deg,#E1E7E9,#E1E7E9 4px,#F0F3F4 4px,#F0F3F4 8px)}
  .fx-barval{flex:0 0 118px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  .fx-cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;
    border-top:1px solid var(--border);padding-top:14px}
  .fx-cmpcol h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--ink-3)}
  .fx-typelist{list-style:none;margin:0;padding:0}
  .fx-typelist li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;
    font-size:12.5px;border-bottom:1px solid var(--surface-2)}
  .fx-tn{color:var(--ink-2);min-width:0}
  .fx-tv{color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}

  .fx-firm{border:1px solid var(--border);border-radius:6px;margin-bottom:6px;background:var(--surface)}
  .fx-firmhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    font-family:inherit;background:none;border:0;padding:9px 12px;cursor:pointer}
  .fx-firmhead:hover{background:var(--surface-2)}
  .fx-rank{flex:0 0 22px;font-size:12px;font-weight:700;color:var(--ink-3);
    font-variant-numeric:tabular-nums}
  .fx-name{flex:0 0 auto;max-width:34%;font-size:13px;font-weight:650;color:var(--ink);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx-stack{flex:1 1 auto;display:flex;height:10px;border-radius:3px;overflow:hidden;
    background:var(--surface-2);min-width:60px}
  .fx-seg{display:block;height:100%}
  .fx-seg.one{background:var(--accent)}
  .fx-seg.classic{background:#7AA7B8}
  .fx-seg.other{background:#C3CDD1}
  .fx-seg.unk{background:repeating-linear-gradient(45deg,#E1E7E9,#E1E7E9 3px,#F0F3F4 3px,#F0F3F4 6px)}
  .fx-count{flex:0 0 auto;font-size:12px;color:var(--ink-3);white-space:nowrap;
    font-variant-numeric:tabular-nums}
  .fx-firmbody{padding:2px 12px 10px 46px}
  .fx-topics{list-style:none;margin:0;padding:0}
  .fx-topics li{display:flex;align-items:baseline;gap:10px;padding:3px 0;font-size:12.5px}
  .fx-topic{flex:1 1 auto;color:var(--ink-2)}
  .fx-ttype{flex:0 0 auto;font-size:11px;color:var(--ink-3)}
  .fx-tcount{flex:0 0 34px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}

  .fx-internal{font-size:12px;color:var(--ink-3);margin:0 0 10px;padding:8px 12px;
    border:1px dashed var(--border);border-radius:6px}
  .fx-foot{font-size:11.5px;line-height:1.55;color:var(--ink-3);margin:0}
  @media (max-width:800px){ .fx-cmp{grid-template-columns:1fr} .fx-name{max-width:100%} }

  /* Sekundärt: finns kvar, men tar inte plats förrän man ber om det. */
  .nv-secondary{border:0;background:none;margin:2px 0 12px}
  .nv-secondary>summary{cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--nv-ink-3);padding:6px 0;
    list-style:none}
  .nv-secondary>summary::-webkit-details-marker{display:none}
  .nv-secondary>summary::before{content:"▸ ";color:var(--nv-ink-3)}
  .nv-secondary[open]>summary::before{content:"▾ "}

  /* Var uppmärksam på — en uppmaning, inte en siffra. */
  .nv-watch{background:var(--nv-amber-soft);border-radius:8px;padding:12px 15px;margin-bottom:14px}
  .nv-watch.red{background:var(--nv-red-soft)}
  .nv-watchh{font-size:12.6px;font-weight:700;color:var(--nv-amber);margin-bottom:4px}
  .nv-watch.red .nv-watchh{color:var(--nv-red)}
  .nv-watch p{margin:0;font-size:13px;line-height:1.55;color:var(--nv-ink-2)}

  /* Merförsäljning: en INTERN vidarelämning, inte ett säljförslag. Teal (samma
     positiva signal som resten) men tydligt en egen ruta, så den aldrig läses
     som en del av kundsvaret. */
  .nv-upsell{border:1px solid var(--nv-teal-edge);background:var(--nv-teal-soft);
    border-radius:8px;padding:12px 15px;margin:0 0 14px}
  .nv-upsellh{font-size:12.6px;font-weight:700;color:var(--nv-teal);margin-bottom:6px}
  .nv-upsellist{margin:0;padding:0;list-style:none}
  .nv-upsellist li{font-size:13px;line-height:1.55;color:var(--nv-ink);padding-bottom:5px}
  .nv-upquote{display:block;color:var(--nv-ink-2);font-style:italic}
  .nv-upnote{display:block;color:var(--nv-ink-2)}
  .nv-upfoot{margin:6px 0 0;font-size:11.5px;line-height:1.5;color:var(--nv-ink-3)}

  /* Demo-kontext: samlad, hopfälld och nedtonad, så den aldrig sitter mitt
     bland verifierade fakta. */
  .nv-demobox{border:1px dashed var(--nv-rule);border-radius:8px;padding:0 13px;
    background:transparent;margin-top:14px}
  .nv-demobox summary{cursor:pointer;padding:10px 0;font-size:11.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--nv-ink-3);list-style:none}
  .nv-demobox summary::-webkit-details-marker{display:none}
  .nv-demobox summary::before{content:"▸ ";color:var(--nv-ink-3)}
  .nv-demobox[open] summary::before{content:"▾ "}
  /* Värdena SITTER på sammanfattningsraden. En hopfälld ruta som bara heter
     "Demo-kontext" gömmer vad den innehåller — hälsa och CSM hittas inte om man
     inte redan vet att de ligger där. */
  .nv-demoline{display:inline-flex;align-items:center;gap:5px 12px;flex-wrap:wrap;
    text-transform:none;letter-spacing:0;font-size:11.8px;font-weight:500}
  .nv-demoline b{font-weight:700}
  .nv-demobox .nv-dot{margin-right:0}
  .nv-demogrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:10px}
  .nv-demogrid dt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--nv-ink-3);font-weight:650;margin:0 0 1px}
  .nv-demogrid dd{margin:0;font-size:12.5px;color:var(--nv-ink-3)}
  .nv-demonote{margin:0;padding-bottom:12px;font-size:11px;line-height:1.5;color:var(--nv-ink-3)}
  /* ── Två spalter: HANDLING till vänster, UNDERLAG till höger ──────────────
     Kortet var en enda lång kolumn, så agenten fick scrolla förbi bevisen för
     att nå det den skulle göra. Nu står de bredvid varandra: vad du ska göra,
     och varför — vilket också är hur genomgången i decket ramar in det. */
  .nv-cov{margin-bottom:14px}
  .nv-covlist{list-style:none;margin:0;padding:0;display:flex;gap:8px;flex-wrap:wrap}
  .nv-covlist li{font-size:12.6px;line-height:1.4;padding:6px 11px;border-radius:6px;
    background:#E7EDEF;color:var(--nv-ink-2)}
  .nv-covlist li.open{background:var(--nv-amber-soft);color:var(--nv-amber);font-weight:600}
  .nv-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);
    gap:26px;align-items:start}
  .nv-cols > div{min-width:0}
  /* Under 1080px finns inte plats för två läsbara spalter — då är en kolumn
     bättre än två trånga. */
  @media (max-width:1080px){ .nv-cols{grid-template-columns:1fr;gap:0} }
  /* Underlagsspalten är tätare: den skannas, den läses inte. */
  .nv-side .nv-facts li{font-size:12.6px;padding-bottom:6px}
  .nv-side .nv-src{min-width:104px;font-size:9.5px;padding:5px 9px}
  /* "RECOMMENDED · …" i bild 2: en något djupare beige ruta med kant, så att
     rekommendationen läses som slutsatsen och inte som ännu ett stycke. */
  .nv-rec{background:#FBF3D8;border:1px solid var(--nv-note-edge);border-radius:8px;
    padding:14px 16px;margin:4px 0 14px}
  .nv-rec .rl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.09em;
    text-transform:uppercase;color:var(--nv-teal);margin-bottom:6px}
  .nv-rec p{margin:0;font-size:13.4px;line-height:1.6;color:var(--nv-ink);font-weight:600}
  /* Varningsbannern (churn/risk) — ljust röd med röd text, som i bild 2. */
  .nv-alert{background:var(--nv-red-soft);color:var(--nv-red);border-radius:8px;
    padding:11px 15px;margin-bottom:14px;font-size:13.2px;font-weight:600;line-height:1.5}

  /* The action row. PREVIEW ONLY — see noteActionsEl: the review app cannot send
     a reply or write to Linear, and a button that silently does nothing is worse
     than no button, so these are inert and labelled. Only "Wrong — tell us why"
     acts, because judging a draft is a thing this app really does. */
  .nv-actions{display:flex;align-items:flex-start;gap:10px 22px;flex-wrap:wrap;margin-top:16px;
    padding-top:14px;border-top:1px solid var(--nv-rule)}
  /* TVÅ GRUPPER, inte sex knappar i rad. Att svara kunden och att rapportera
     vidare är olika beslut med olika konsekvens; låg de bredvid varandra läste
     de som sex likvärdiga val. Gruppen bär rubriken, inte varje knapp. */
  .nv-grp{display:flex;flex-direction:column;gap:7px}
  .nv-grp+.nv-grp{padding-left:22px;border-left:1px solid var(--nv-rule)}
  .nv-grp-h{font-size:10px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--nv-ink-3)}
  .nv-grp-btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .nv-btn{font-family:inherit;font-size:12.5px;font-weight:650;padding:8px 15px;
    border-radius:6px;border:1px solid var(--nv-rule);background:var(--nv-paper);
    color:var(--nv-ink)}
  .nv-btn.primary{background:var(--nv-teal);border-color:var(--nv-teal);color:var(--on-solid)}
  .nv-btn[disabled]{cursor:default;opacity:.9}
  /* En knapp som redan använts ska synas som använd — annars klickar man två
     gånger och undrar om det hände något första gången. */
  .nv-btn.used{background:var(--nv-teal-soft);border-color:var(--nv-teal-edge);
    color:var(--nv-teal);font-weight:700}
  .nv-btn.used::before{content:"✓ "}
  /* EN standardetikett per knapp i stället för en fyraradig fotnot under raden.
     Fotnoten räknade upp vilka knappar som var demo och vilka som var inerta —
     information som hör hemma på knappen den gäller, inte i en mening man måste
     matcha mot den. */
  .nv-btn .dm{margin-left:7px;font-size:9px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;padding:2px 5px;border-radius:3px;
    background:var(--nv-note-bg);color:var(--nv-ink-3);border:1px solid var(--nv-rule)}
  .nv-btn.primary .dm{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35);
    color:var(--on-solid)}
  .nv-btn.used .dm{background:var(--nv-paper);border-color:var(--nv-teal-edge);color:var(--nv-teal)}
  .nv-wrong{margin-left:auto;align-self:center;font-family:inherit;font-size:12.5px;
    color:var(--nv-ink-3);background:none;border:0;padding:0;cursor:pointer}
  .nv-wrong:hover{color:var(--nv-teal);text-decoration:underline}
  .nv-preview{font-size:11px;color:var(--nv-ink-3);margin:8px 0 0;line-height:1.5}
  .nv-edit{width:100%;box-sizing:border-box;font-family:inherit;font-size:13.4px;
    line-height:1.6;color:var(--nv-ink);background:transparent;border:0;
    resize:vertical;outline:none;padding:0}
  .nv-editbar{display:flex;gap:8px;margin-top:12px;padding-top:12px;
    border-top:1px solid var(--nv-rule)}
  /* Where a demo action reports back. Deliberately in the flow rather than a
     toast: the point is that it stays on screen while you talk about it. */
  .nv-demoout:empty{display:none}
  .nv-said{margin-top:10px;font-size:12.5px;line-height:1.55;padding:9px 13px;
    border-radius:7px;background:var(--nv-teal-soft);color:var(--nv-ink)}
  .nv-said.rec{background:var(--nv-red-soft);color:var(--nv-red)}
  .nv-rec.on{background:var(--nv-red);border-color:var(--nv-red);color:var(--on-solid)}

  @media (max-width:640px){
    .nv-cust div{border-right:none;border-bottom:1px solid var(--nv-rule);flex:1 1 100%}

  /* KB article panel — the "write this down" loop (2026-08-03) */

  .arthead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .artprop{font-size:13.5px;margin:2px 0}
  .artwhy{font-size:12.5px;color:var(--ink-3);margin:2px 0}
  .artblocked{font-size:13px;color:var(--crit);margin:4px 0}
  .arttitle,.artsum,.artsteps{width:100%;box-sizing:border-box;margin-top:6px;font-size:13.5px;
    padding:6px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--ink)}

  .tag.a-dest{background:#E7EDEF;color:var(--ink-2);text-transform:none;letter-spacing:0}

     "WHAT WE KNOW" / "SUGGESTED REPLY" in the note are sans, 700, widely

    text-transform:uppercase}

  unauthorized_access: "Obehörig åtkomst", pii_risk: "Personuppgiftsrisk",
  false_promise: "Felaktigt kundlöfte", invented_feature: "Påhittad produktfunktion",
};
function reasonText(slug) {
  if (typeof slug === "string" && slug.indexOf("other:") === 0) return slug.slice(6);
  return REASON_LABELS[slug] || slug;
}

boot();
function boot() {
  var saved = null;
  try { saved = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (saved) {
    var o = null; try { o = JSON.parse(saved); } catch (e) {}
    if (o && o.access_token) { token = o.access_token; refreshToken = o.refresh_token || null; meEmail = o.email; return loadData(); }
  }
  renderAuth();
}

async function api(path, opts, _retried) {
  opts = opts || {};
  var headers = { apikey: SB_ANON, "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
  var res = await fetch(SB_URL + path, { method: opts.method || "GET", headers: headers, body: opts.body });
  // Access token expired? Silently renew with the refresh token and retry once, so
  // the session survives past the ~1h token lifetime — no re-typing credentials.
  if (res.status === 401 && !_retried && refreshToken) {
    if (await refresh()) return api(path, opts, true);
  }
  return res;
}

async function refresh() {
  try {
    var res = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) return false;
    var data = await res.json();
    if (!data.access_token) return false;
    token = data.access_token;
    refreshToken = data.refresh_token || refreshToken; // Supabase rotates it
    persist();
    return true;
  } catch (e) { return false; }
}

function persist() {
  try {
    localStorage.setItem(TOKEN_KEY, JSON.stringify({ access_token: token, refresh_token: refreshToken, email: meEmail }));
  } catch (e) {}
}

// ---- auth ----
function renderAuth(msg, cls) {
  app.innerHTML =
    '<div class="auth">' +
    '  <div class="eyebrow">Simployer · Gate 1</div>' +
    '  <h2>Coach review</h2>' +
    '  <p>Sign in with your agent email and password to review AI coach drafts and record your verdict.</p>' +
    '  <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="you@simployer.com"></div>' +
    '  <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
    '  <button class="btn primary" id="signin">Sign in</button>' +
    '  <div id="authmsg" aria-live="assertive"></div>' +
    '</div>';
  if (msg) setAuthMsg(msg, cls);
  var emEl = document.getElementById("em"), pwEl = document.getElementById("pw");
  function submit() { doLogin(emEl.value.trim(), pwEl.value); }
  document.getElementById("signin").onclick = submit;
  pwEl.onkeydown = function (e) { if (e.key === "Enter") submit(); };
}
function setAuthMsg(t, cls) {
  var m = document.getElementById("authmsg");
  if (m) m.innerHTML = '<div class="msg ' + cls + '">' + esc(t) + "</div>";
}
async function doLogin(email, password) {
  if (!email || !password) return setAuthMsg("Enter your email and password.", "err");
  setAuthMsg("Signing in…", "ok");
  try {
    var res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password }),
    });
    var data = await res.json();
    if (!res.ok) return setAuthMsg(data.error_description || data.msg || data.error || "Sign-in failed.", "err");
    token = data.access_token; refreshToken = data.refresh_token || null; meEmail = (data.user && data.user.email) || email;
    persist();
    loadData();
  } catch (e) { setAuthMsg("Network error: " + e.message, "err"); }
}
function signOut() {
  token = null; refreshToken = null; meEmail = null;
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  renderAuth();
}

// ---- data ----
async function loadData() {
  app.innerHTML = '<div class="empty">Loading tickets…</div>';
  try {
    var res = await api("/rest/v1/suggestions?select=" + COLS + "&order=created_at.desc&limit=300");
    if (res.status === 401) { signOut(); return; }
    var data = await res.json();

    // THE APP AND THE DATABASE SHIP SEPARATELY. This page is published to
    // gh-pages the moment it is merged; a migration is applied by hand
    // afterwards. So there is always a window where the app selects a column
    // the database does not have yet — and PostgREST fails the WHOLE query for
    // one unknown column, which blanked the entire page over an optional field.
    //
    // A field that only decorates a card must never be able to do that. On
    // "column X does not exist" we drop that column and retry once; the page
    // loads without the decoration, which is the correct degradation. Anything
    // else (permission denied, a bad filter) is still reported as before.
    var missing = (data && data.message || "").match(/column \S*?\.?(\w+) does not exist/i);
    if (!res.ok && missing) {
      var dropped = missing[1];
      COLS = COLS.split(",").filter(function (c) { return c !== dropped; }).join(",");
      console.warn("column '" + dropped + "' is missing from the database — " +
        "loading without it. Apply the migration that adds it.");
      res = await api("/rest/v1/suggestions?select=" + COLS + "&order=created_at.desc&limit=300");
      if (res.status === 401) { signOut(); return; }
      data = await res.json();
    }

    if (!res.ok) {
      app.innerHTML = '<div class="empty">Couldn\'t load (' + esc((data && data.message) || res.status) +
        ").<br>If this says permission denied, your email isn't on the reviewer allowlist yet.</div>";
      return;
    }
    var all = Array.isArray(data) ? data : [];
    await loadMyReviews(all);
    // hide reviewer-flagged spam (is_spam) and any auto-reply noise the ingest missed
    rows = all.filter(function (r) { return !r.is_spam && !isSpam(r.subject); });
    await loadHoldout(); // best-effort; enables the holdout progress + filter
    await loadArticles(); // best-effort; drives the KB-article panel on each card
    var deep = (window.location.hash || "").match(/^#generation=(\d+)$/);
    if (deep) { search = deep[1]; tab = "all"; }
    render();
  } catch (e) {
    app.innerHTML = '<div class="empty">Network error: ' + esc(e.message) + "</div>";
  }
}

// Review rows are separate from immutable generations. Load the signed-in
// reviewer's own optimistic-lock version; the flattened fields on suggestions
// remain the shared/latest read projection used by the cards.
async function loadMyReviews(targetRows) {
  if (!meEmail) return;
  try {
    var res = await api(
      "/rest/v1/suggestion_reviews?select=generation_id,review_version" +
      "&reviewer_email=eq." + encodeURIComponent(meEmail.toLowerCase()),
    );
    if (!res.ok) return;
    var mine = await res.json(), versions = {};
    for (var i = 0; i < (mine || []).length; i++) {
      versions[mine[i].generation_id] = mine[i].review_version;
    }
    for (var j = 0; j < targetRows.length; j++) {
      targetRows[j].my_review_version = versions[targetRows[j].id] || 0;
    }
  } catch (e) { /* a save will surface a real access error */ }
}

// Fetch the locked holdout ticket ids (reviewer-readable per migration 27). If the
// grant/policy isn't there, this fails quietly and the holdout features stay hidden.
async function loadHoldout() {
  holdoutIds = {};
  try {
    var res = await api("/rest/v1/ticket_cohorts?select=ticket_id&cohort=eq.holdout");
    if (!res.ok) return;
    var data = await res.json();
    for (var i = 0; i < (data || []).length; i++) holdoutIds[data[i].ticket_id] = 1;
  } catch (e) { /* holdout features simply won't show */ }
}
// KB article drafts, keyed by ticket. Best-effort: RLS lets an allowlisted
// reviewer read them, and a failure here must never stop the review list loading.
async function loadArticles() {
  articlesByTicket = {}; articles = [];
  try {
    // article_library carries the provenance the tab exists to show: which ticket,
    // which human-validated resolution, who asked, who signed off.
    var res = await api("/rest/v1/article_library?select=*&limit=1000");
    if (!res.ok) return;
    var data = await res.json();
    articles = Array.isArray(data) ? data : [];
    // Dokumentationsloopen är hela poängen med den här fliken, och den är
    // osynlig när inga artiklar begärts än. Samma regel som överallt annars:
    // demodata bara när det inte finns någon riktig, och alltid märkt.
    if (!articles.length && PLANHAT_DEMO) articles = demoArticles();
    articles.forEach(function (a) {
      a.steps = a.steps || []; a.notes = a.notes || [];
      a.removed_specifics = a.removed_specifics || [];
      articlesByTicket[a.ticket_id] = a;
    });
  } catch (_e) { /* best-effort */ }
}

function hasHoldout() { for (var k in holdoutIds) return true; return false; }

// Which rows belong to the current tab (before search/filter/sort).
function tabRows() {
  if (tab === "done") return rows.filter(function (r) { return r.verdict; });
  if (tab === "rewrite") {
    return rows.filter(function (r) { return r.agent_qa_score != null && !(r.gold_answer && r.gold_answer.trim()); });
  }
  if (tab === "all") return rows.slice();
  return rows.filter(function (r) { return !r.verdict && r.prompt_version !== "agent-scan"; }); // todo
}

// ── Företag: vem skapar ärenden, på vilken produkt, om vad ──────────────────
//
// ALLT kommer från FÄLT i Freshdesk (cf_product152991, cf_category_1..3, type,
// company_id) via ticket_facts — ingenting härleds ur ärendetext. Att gissa
// produkt eller ämne ur nyckelord är Gate 1:s felläge, och görs inte här.
var firms = { rows: [], topics: [], mix: [], coverage: [], loaded: false };

async function loadCompanies() {
  async function get(path) {
    try {
      var res = await api("/rest/v1/" + path);
      if (!res.ok) return null;
      return await res.json();
    } catch (_e) { return null; }
  }
  var r = await Promise.all([
    get("company_ticket_volume?select=*&limit=200"),
    get("company_ticket_topics?select=*&limit=2000"),
    get("product_topic_mix?select=*&limit=500"),
    get("ticket_facts_coverage?select=*"),
  ]);
  firms = {
    rows: r[0] || [], topics: r[1] || [], mix: r[2] || [],
    coverage: r[3] || [], loaded: true,
  };
}

// Simployer's own company files tickets too (48 in the current window — the
// single largest "customer"). Those are internal, so they are shown but marked,
// never silently mixed into a customer ranking.
function isInternalFirm(name) {
  return /^simployer\b/i.test(String(name || ""));
}

var firmProductLabel = { one: "Simployer One", classic: "Classic", other: "Andra produkter", unknown: "Ingen produkt satt" };
var firmProductCls = { one: "one", classic: "classic", other: "other", unknown: "unk" };

function renderCompanies() {
  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";
  if (!firms.loaded) {

    return;
  }

  // ── Täckning FÖRST ────────────────────────────────────────────────────────
  // En topplista byggd på ett fält som saknas på en tredjedel av raderna
  // rangordnar de rader som råkade ha fältet. Det ska stå överst, inte i en

  var totalTickets = Number(cov.tickets || 0);
  var noProduct = Number(cov.product_unknown || 0);
  var box = el("div", "fx-cov");
  box.appendChild(set(el("div", "fx-covh"), "Så mycket täcker underlaget"));
  var cg = el("div", "fx-covgrid");
  [
    ["Ärenden", String(totalTickets), ""],
    ["Har företag", cov.company_pct + " %", Number(cov.company_pct) < 90 ? "warn" : ""],
    ["Saknar produkt", noProduct + " (" + (totalTickets ? (100 * noProduct / totalTickets).toFixed(1) : "0") + " %)",

  ].forEach(function (c) {
    var cell = el("div", "fx-covcell" + (c[2] ? " " + c[2] : ""));

    cell.appendChild(set(el("dd", ""), c[1]));

  });
  box.appendChild(cg);
  box.appendChild(set(el("p", "fx-covnote"),
    "Rangordningen omfattar de ärenden som HAR ett företag — inte alla ärenden. " +
    "Ärenden utan produktfält räknas inte som One eller Classic, de redovisas som " +

  // ── Produktjämförelse ────────────────────────────────────────────────────

  });

  var pc = el("div", "fx-card");
  pc.appendChild(set(el("h3", "fx-h"), "Simployer One mot Classic"));
  pc.appendChild(set(el("p", "fx-sub"),
    "Tre grupper, inte två: de flesta ärenden ligger på en annan produkt än " +
    "både One och Classic — Expert, Employee Survey, Capitech, Learn, Talent. " +
    "Att fördela ut dem hade gjort jämförelsen snyggare och fel."));
  var bars = el("div", "fx-bars");
  order.forEach(function (g) {

  var internal = firms.rows.filter(function (r) { return isInternalFirm(r.company_name); });

    var known = Number(r.one_tickets || 0) + Number(r.classic_tickets || 0) + Number(r.other_tickets || 0);

    lw.appendChild(ib);
  }

  lw.appendChild(set(el("p", "fx-foot"),
    "Källa: fälten i Freshdesk via ticket_facts. Intercom är ännu inte synkat — " +
    "eftersom Intercom ALLTID är S1/AlexisHR underskattas One här med hela " +
    "Intercom-volymen. Läs One-siffran som \u201Cminst så mycket\u201D."));
}

function tabCount(id) {
  if (id === "note") return rows.filter(function (r) { return r.prompt_version !== "agent-scan"; }).length;
  if (id === "done") return rows.filter(function (r) { return r.verdict; }).length;
  if (id === "rewrite") return rows.filter(function (r) { return r.agent_qa_score != null && !(r.gold_answer && r.gold_answer.trim()); }).length;
  return rows.filter(function (r) { return !r.verdict && r.prompt_version !== "agent-scan"; }).length;
}

// distinct non-empty values of a field across all rows, for filter dropdowns
function distinct(field) {
  var seen = {}, out = [];
  for (var i = 0; i < rows.length; i++) {
    var v = rows[i][field];
    if (v && !seen[v]) { seen[v] = 1; out.push(v); }
  }
  return out.sort();
}

function controlsEl() {
  var box = el("div", "controls");
  var s = document.createElement("input");
  s.className = "search"; s.type = "search"; s.placeholder = "Search id, subject, draft…"; s.value = search;
  s.setAttribute("aria-label", "Search tickets by id, subject or draft");
  s.oninput = function () { search = s.value; renderList(); };
  box.appendChild(s);

  box.appendChild(selectEl("Language", distinct("language").map(function (v) { return [v, v.toUpperCase()]; }), fLang, function (v) { fLang = v; renderList(); }));
  box.appendChild(selectEl("Type", distinct("ticket_type").map(function (v) { return [v, v]; }), fType, function (v) { fType = v; renderList(); }));
  box.appendChild(selectEl("Confidence", [["high", "high"], ["medium", "medium"], ["low", "low"], ["none", "none"]], fConf, function (v) { fConf = v; renderList(); }));
  box.appendChild(selectEl("Mode", [["REPLY_READY", "🟢 Reply ready"], ["COACH_AGENT", "🟡 Coach"], ["AGENT_ACTION_REQUIRED", "🔴 Action req."]], fMode, function (v) { fMode = v; renderList(); }));
  box.appendChild(selectEl("Any risk", [["yes", "⚠ Critical flagged"]], fCrit, function (v) { fCrit = v; renderList(); }));
  if (hasHoldout()) box.appendChild(selectEl("All tickets", [["holdout", "🔒 Holdout only"]], fCohort, function (v) { fCohort = v; renderList(); }));
  box.appendChild(selectEl("Sort: newest", [["qa", "Sort: QA score ↑"], ["agentqa", "Sort: agent QA ↑"], ["conf", "Sort: confidence ↓"]], sortBy === "newest" ? "" : sortBy, function (v) { sortBy = v || "newest"; renderList(); }));
  return box;
}

// A <select> whose first option is the "all/default" label, then [value,label] pairs.
function selectEl(allLabel, opts, cur, onchange) {
  var sel = document.createElement("select");
  sel.setAttribute("aria-label", allLabel); // no visible <label>; announce the filter's purpose
  var o0 = document.createElement("option"); o0.value = ""; o0.textContent = allLabel; sel.appendChild(o0);
  for (var i = 0; i < opts.length; i++) {
    var o = document.createElement("option"); o.value = opts[i][0]; o.textContent = opts[i][1];
    if (opts[i][0] === cur) o.selected = true;
    sel.appendChild(o);
  }
  sel.onchange = function () { onchange(sel.value); };
  return sel;
}

function progressEl() {
  var reviewable = rows.filter(function (r) { return r.prompt_version !== "agent-scan"; });
  var judged = reviewable.filter(function (r) { return r.verdict; }).length;
  var total = reviewable.length;
  var pct = total ? Math.round(100 * judged / total) : 0;
  // Holdout progress (the locked eval set) — the number that actually gates Gate 1.
  var hoLab = "";
  if (hasHoldout()) {
    var ho = reviewable.filter(function (r) { return holdoutIds[r.ticket_id]; });
    var hoJudged = ho.filter(function (r) { return r.verdict; }).length;
    hoLab = ' · 🔒 holdout: ' + hoJudged + " av " + ho.length + " granskade";
  }
  var box = el("div", "progress");
  box.innerHTML =
    '<span class="lab">' + judged + " av " + total + " granskade · " + pct + "%" + hoLab + "</span>" +
    '<div class="track" role="progressbar" aria-label="Judging progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="fill" style="width:' + pct + '%"></div></div>';
  return box;
}

// renderList() rebuilds ONLY the card list, applying search + filters + sort on top
// of the active tab. Called on every keystroke/filter change; leaves controls intact.
function renderList() {
  if (tab === "note") return renderAgentNotes();
  if (tab === "articles") return renderArticleList();
  if (tab === "coaching") return renderCoaching();
  if (tab === "companies") return renderCompanies();
  var base = tabRows();
  var q = search.trim().toLowerCase();
  shown = base.filter(function (r) {
    if (fLang && r.language !== fLang) return false;
    if (fType && r.ticket_type !== fType) return false;
    if (fConf && (r.confidence || "none") !== fConf) return false;
    if (fMode && r.coach_mode !== fMode) return false;
    if (fCrit === "yes" && !(r.critical_flag && r.critical_flag.trim())) return false;
    if (fCohort === "holdout" && !holdoutIds[r.ticket_id]) return false;
    if (q) {
      var products = r.customer_subscriptions && Array.isArray(r.customer_subscriptions.subscriptions)
        ? r.customer_subscriptions.subscriptions.map(function (s) {
          return [s.productName, s.renewalStatus, s.endDate].filter(Boolean).join(" ");
        }).join(" ")
        : "";
      var hay = (String(r.id) + " " + String(r.ticket_id) + " " + (r.subject || "") + " " + (r.draft || "") + " " + (r.customer_message || "") + " " + products).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  shown.sort(sortFn);

  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";
  cardEls = []; activeIdx = -1;
  if (!shown.length) {
    var e = el("div", "empty");
    e.textContent = tab === "todo" ? "Nothing left to review 🎉" : "Nothing matches.";
    lw.appendChild(e);
    return;
  }
  for (var i = 0; i < shown.length; i++) {
    var card = cardEl(shown[i]);
    cardEls.push(card); lw.appendChild(card);
  }
}

function sortFn(a, b) {
  if (sortBy === "qa") return (a.qa_score == null ? 999 : a.qa_score) - (b.qa_score == null ? 999 : b.qa_score);
  if (sortBy === "agentqa") return (a.agent_qa_score == null ? 999 : a.agent_qa_score) - (b.agent_qa_score == null ? 999 : b.agent_qa_score);
  if (sortBy === "conf") { var rank = { high: 3, medium: 2, low: 1, none: 0 }; return (rank[b.confidence] || 0) - (rank[a.confidence] || 0); }
  return String(b.created_at || "").localeCompare(String(a.created_at || "")); // newest
}

function tabEl(id, label, n) {
  var b = el("button", "tab" + (tab === id ? " on" : ""));
  b.textContent = label + " · " + n;
  b.onclick = function () { tab = id; render(); };
  return b;
}

// ---- keyboard navigation (#4): j/k move, u/e/n verdict, g focus ideal answer ----
function setActive(idx) {
  if (activeIdx >= 0 && cardEls[activeIdx]) cardEls[activeIdx].classList.remove("active");
  activeIdx = idx;
  var c = cardEls[activeIdx];
  if (c) {
    c.classList.add("active");
    // Fliken Agent notes fäller ut det aktiva kortet och stänger det förra.
    // Andra flikar sätter ingen _activate och påverkas inte.
    if (c._activate) c._activate();
    c.scrollIntoView({ block: "center", behavior: "smooth" });
  }
}
function moveActive(delta) {
  if (!cardEls.length) return;
  var next = activeIdx < 0 ? 0 : activeIdx + delta;
  if (next < 0) next = 0;
  if (next > cardEls.length - 1) next = cardEls.length - 1;
  setActive(next);
}
document.addEventListener("keydown", function (e) {
  // `shown` fylls bara av granskningsflikarna; Agent notes har sin egen lista,
  // så villkoret är "finns det kort", inte "finns det granskningsrader".
  if (!token || !cardEls.length) return;
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
  else if (k === "u" || k === "e" || k === "n") {
    if (!shown.length) return;   // verdikt hör hemma i granskningsflikarna
    if (activeIdx < 0) return;
    var v = k === "u" ? "usable" : k === "e" ? "edited" : "unusable";
    var c = cardEls[activeIdx];
    e.preventDefault(); if (c && c._setVerdict) c._setVerdict(v);
  } else if (k === "g") {
    if (activeIdx < 0) return;
    var ta = cardEls[activeIdx].querySelector(".goldedit") ||
      cardEls[activeIdx].querySelector("textarea");
    if (ta) { e.preventDefault(); ta.focus(); }
  }
});

// Save verdict + reasons + critical atomically, with optimistic locking so a second
// reviewer can't silently overwrite. Filters on the review_version we last read; a
// stale write matches 0 rows → we reload and tell the reviewer.
async function saveReview(r, card, patch) {
  var vs = card.querySelector(".vstate");
  vs.textContent = "sparar…";
  var body = {
    p_generation_id: r.id,
    p_expected_version: r.my_review_version || 0,
    p_verdict: patch.verdict,
    p_verdict_reasons: patch.verdict_reasons,
    p_critical_flag: patch.critical_flag
  };
  try {
    var res = await api("/rest/v1/rpc/submit_generation_verdict", {
      method: "POST",
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      var msg = await res.text();
      if (msg.indexOf("review version conflict") >= 0) {
        vs.textContent = "en nyare egen bedömning finns — laddar om…";
        await reloadRow(r, card);
      } else {
        vs.textContent = "kunde inte spara: " + msg;
      }
      return;
    }
    var out = await res.json();
    if (!out.length) { vs.textContent = "inget sparades — laddar om…"; await reloadRow(r, card); return; }
    var saved = out[0];
    r.verdict = saved.verdict;
    r.verdict_reasons = saved.verdict_reasons;
    r.critical_flag = saved.critical_flag;
    r.verdict_by = saved.reviewer_email;
    r.verdict_at = saved.updated_at;
    r.review_version = saved.review_version;
    r.my_review_version = saved.review_version;
    // reflect verdict button selection + state text
    var btns = card.querySelectorAll(".vbtn");
    for (var i = 0; i < btns.length; i++) btns[i].className = "vbtn" + (btns[i].getAttribute("data-v") === r.verdict ? " sel" : "");
    vs.textContent = "sparat: " + (r.verdict || "—") + (r.verdict_by ? " · " + r.verdict_by : "");
    card.classList.toggle("critical", !!r.critical_flag);
    if (card._reasonsPanel && card._panelVisible) card._reasonsPanel.style.display = card._panelVisible() ? "" : "none";
  } catch (e) { vs.textContent = "kunde inte spara: " + e.message; }
}

// Re-fetch one row and swap its card in place (after a save conflict).
async function reloadRow(r, card) {
  try {
    var res = await api("/rest/v1/suggestions?id=eq." + r.id + "&select=" + COLS);
    var out = await res.json();
    if (out && out[0]) {
      await loadMyReviews(out);
      Object.assign(r, out[0]);
      var fresh = cardEl(r);
      var i = cardEls.indexOf(card);
      if (i >= 0) cardEls[i] = fresh;
      card.replaceWith(fresh);
    }
  } catch (e) { /* leave the stale card; the status line already told the reviewer */ }
}

async function saveGold(r, text, st, mark, _retried) {
  st.textContent = "Sparar…";
  dirtyGold[r.id] = true; // unsaved until the write confirms
  try {
    var res = await api("/rest/v1/rpc/save_generation_gold_answer", {
      method: "POST",
      body: JSON.stringify({ p_generation_id: r.id, p_gold_answer: text }),
    });
    if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
    var out = await res.json(), saved = out && out[0];
    r.gold_answer = text;
    if (saved) {
      r.gold_answer_by = saved.reviewer_email;
      r.my_review_version = saved.review_version;
      r.review_version = Math.max(r.review_version || 0, saved.review_version || 0);
    }
    delete dirtyGold[r.id];
    var has = !!text.trim();
    st.textContent = has ? "Sparat ✓" : "Rensat";
    if (mark) {
      mark.className = "btn golden" + (has ? " is-set" : "");
      mark.textContent = has ? "★ Golden — saved" : "★ Mark as golden";
      var card = mark.closest(".card");
      if (card) card.classList.toggle("golden", has);
    }
  } catch (e) {
    // network blip → one automatic retry after a short pause; text is kept (dirty).
    if (!_retried) {
      st.textContent = "Nätverksfel — försöker igen…";
      setTimeout(function () { saveGold(r, text, st, mark, true); }, 1500);
    } else {
      st.textContent = "Kunde inte spara (nätverksfel) — texten är kvar, försök igen.";
    }
  }
}

// Debounced autosave: save ~1s after the reviewer stops typing (per-row timer).
function scheduleGoldSave(r, ta, st, mark) {
  st.textContent = "Ändrat…"; dirtyGold[r.id] = true;
  if (r._goldTimer) clearTimeout(r._goldTimer);
  r._goldTimer = setTimeout(function () { r._goldTimer = null; saveGold(r, ta.value, st, mark); }, 1000);
}

// Mark a ticket as spam/noise: persist is_spam=true, then drop it from the list.
async function markSpam(r) {
  if (!window.confirm("Mark #" + r.ticket_id + " as spam and hide it? It stays out of the eval and rewrite queue.")) return;
  try {
    var res = await api("/rest/v1/rpc/mark_generation_spam", {
      method: "POST",
      body: JSON.stringify({ p_generation_id: r.id }),
    });
    if (!res.ok) { window.alert("Couldn't mark as spam: " + (await res.text())); return; }
    r.is_spam = true;
    rows = rows.filter(function (x) { return x.id !== r.id; });
    render();
  } catch (e) { window.alert("Network error: " + e.message); }
}

  var mk = ["det sier mye om deg at du bruker simployer expert", "smarte måter å få mer ut av simployer expert", "dette venter på deg i simployer expert", "oppdag alt simployer expert har å tilby", "slik får du mest ut av simployer expert", "upptäck allt som simployer expert har att erbjuda"];
  return mk.some(function (m) { return s.indexOf(m) >= 0; });
}
// Split text into readable paragraphs (blank line = new paragraph); keeps single

function proseEl(text) {
