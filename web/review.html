<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Review — Simployer Gate 1</title>
<style>
  :root{
    --bg:#F5F7F9;--surface:#fff;--surface-2:#EDF1F4;--border:#DCE3E8;
    --ink:#182029;--ink-2:#56636E;--ink-3:#8694A1;
    --accent:#0F766E;--accent-soft:#D6E8E5;
    --good:#2F855A;--good-soft:#DCEEE3;--warn:#B7791F;--warn-soft:#F3E8CE;
    --crit:#C0392B;--crit-soft:#F4D9D5;--info:#5B7089;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --radius:8px;--shadow:0 1px 2px rgba(24,32,41,.05),0 4px 16px rgba(24,32,41,.05);
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0E1319;--surface:#151C24;--surface-2:#1C252F;--border:#2A3540;
    --ink:#E8EDF1;--ink-2:#A5B2BD;--ink-3:#6E7E8B;
    --accent:#4FD1C5;--accent-soft:#123A38;
    --good:#4FB784;--good-soft:#14301F;--warn:#E0A64B;--warn-soft:#33280F;
    --crit:#E86B5C;--crit-soft:#38191A;--info:#8AA0B5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;font-variant-numeric:tabular-nums}
  .wrap{max-width:920px;margin:0 auto;padding:24px 16px 80px}
  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-size:22px;margin:2px 0 0;letter-spacing:-.02em}
  .who{margin-left:auto;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:10px}
  button{font-family:inherit;cursor:pointer}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  .btn.small{padding:4px 9px;font-size:12px}
  .link{background:none;border:0;color:var(--accent);font-size:13px;padding:0;text-decoration:underline;cursor:pointer}

  .auth{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .auth h2{margin:0 0 4px;font-size:19px}
  .auth p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
  input{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink)}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;padding:11px;font-size:14px}
  .btn.primary:hover{filter:brightness(1.06)}
  .msg{font-size:13px;margin-top:12px;padding:10px 12px;border-radius:6px}
  .msg.ok{background:var(--good-soft);color:var(--good)}
  .msg.err{background:var(--crit-soft);color:var(--crit)}

  .help{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:0 16px;margin:16px 0 0}
  .help>summary{cursor:pointer;padding:14px 0;font-weight:650;font-size:14px;color:var(--ink);list-style:none;display:flex;align-items:center;gap:8px}
  .help>summary::-webkit-details-marker{display:none}
  .help>summary::before{content:"❔";font-size:15px}
  .help .hbody{padding:0 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.6}
  .help .hbody>p{margin:0 0 6px}
  .help h4{margin:14px 0 4px;font-size:11.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
  .help ul{margin:2px 0;padding-left:18px}
  .help li{margin:3px 0}
  .help b{color:var(--ink)}
  .bar{display:flex;gap:8px;align-items:center;margin:18px 0 16px;flex-wrap:wrap}
  .tab{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .count{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-family:var(--mono)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .chead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
  .chead .id{font-family:var(--mono);font-size:12px;color:var(--ink-3);text-decoration:none}
  .chead a.id:hover{color:var(--accent);text-decoration:underline}
  .chead .subj{font-weight:650;font-size:15px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
  .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--ink-2)}
  .tag.c-high{background:var(--good-soft);color:var(--good)}
  .tag.c-low{background:var(--warn-soft);color:var(--warn)}
  .tag.c-none{background:var(--surface-2);color:var(--ink-3)}
  .tag.qa{background:var(--accent-soft);color:var(--accent)}
  .tag.review,.tag.bad{background:var(--crit-soft);color:var(--crit)}
  /* coach mode (Fas 3): green ready / amber coach / red action-required */
  .tag.m-ready{background:var(--good-soft);color:var(--good);font-weight:700}
  .tag.m-coach{background:var(--warn-soft);color:var(--warn);font-weight:700}
  .tag.m-action{background:var(--crit-soft);color:var(--crit);font-weight:700}
  /* reason-code summary on judged cards */
  .reasonline{font-size:12.5px;color:var(--warn);margin:-4px 0 12px}
  /* QA-coach per-criterion breakdown */
  .qabody{padding:4px 12px 10px}
  .qarow{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:13px;flex-wrap:wrap}
  .qarow .qn{font-weight:600;color:var(--ink)}
  .qarow .qr{color:var(--ink-2);font-size:12.5px}
  .qs{font-family:var(--mono);font-size:11.5px;font-weight:700;min-width:34px;text-align:center;padding:1px 6px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
  .qs.s1,.qs.s2{background:var(--crit-soft);color:var(--crit)}
  .qs.s3{background:var(--warn-soft);color:var(--warn)}
  .qs.s4,.qs.s5{background:var(--good-soft);color:var(--good)}
  .qaimp ul{margin:4px 0;padding-left:18px}
  .qaimp li{font-size:12.5px;color:var(--ink-2)}
  /* readable prose: real paragraphs, comfortable size, capped line length (#1) */
  .prose{font-size:15px;line-height:1.65;max-width:70ch;color:var(--ink)}
  .prose p{margin:0 0 10px;white-space:pre-wrap}
  .prose p:last-child{margin:0}
  /* customer's original question, distinct + at the top of the card (#2) */
  .custq{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--info);border-radius:6px;padding:10px 14px;margin:2px 0 12px}
  .custq .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--info);display:block;margin-bottom:6px}
  .subs{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:6px;padding:12px 14px;margin:0 0 12px;overflow-x:auto}
  .subs .sl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:7px}
  .subs .sstate{font-size:13.5px;color:var(--ink-2);margin:0}
  .subs table{width:100%;border-collapse:collapse;background:var(--surface);font-size:13.5px}
  .subs th,.subs td{border:1px solid var(--border);padding:7px 9px;text-align:left;vertical-align:top}
  .subs th{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
  .draftlab{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin:2px 0 5px}
  .draft{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:14px 16px;margin:0 0 12px}
  .refbox{background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:6px;padding:12px 14px;margin:0 0 12px}
  .refbox .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--good);display:block;margin-bottom:6px}
  .gold{margin:2px 0 12px}
  .gold .gl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:5px}
  textarea{width:100%;min-height:88px;font-family:inherit;font-size:14.5px;line-height:1.6;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);resize:vertical}
  textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .goldbar{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
  .goldbar .st{font-size:12px;color:var(--ink-3)}
  .noreply{font-style:italic;color:var(--ink-3);font-size:13.5px;margin:2px 0 12px}
  /* expandable sections look clickable — accordion style (#8) */
  details{border:1px solid var(--border);border-radius:6px;margin:0 0 8px;background:var(--bg)}
  details>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-family:var(--mono);letter-spacing:.03em;padding:8px 12px;list-style:none;user-select:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸";display:inline-block;width:1.1em;color:var(--ink-3)}
  details[open]>summary::before{content:"▾"}
  details>summary:hover{text-decoration:underline}
  details .body{font-size:14px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;padding:2px 12px 10px}
  .sources{display:flex;flex-direction:column;gap:5px;padding:2px 12px 10px}
  .sources a{font-size:13.5px}
  .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:12px;margin-top:4px}
  .actions .lab{font-size:12.5px;color:var(--ink-3);margin-right:2px}
  .vbtn{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
  .vbtn[data-v=usable]:hover,.vbtn.sel[data-v=usable]{background:var(--good);border-color:var(--good);color:#fff}
  .vbtn[data-v=edited]:hover,.vbtn.sel[data-v=edited]{background:var(--warn);border-color:var(--warn);color:#fff}
  .vbtn[data-v=unusable]:hover,.vbtn.sel[data-v=unusable]{background:var(--crit);border-color:var(--crit);color:#fff}
  .vstate{font-size:12.5px;color:var(--ink-3);margin-left:auto}
  .empty{text-align:center;color:var(--ink-3);padding:48px 0;font-size:14px}
  .ticketlink{margin-left:auto;font-size:12.5px}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* controls: search + filters + sort + progress (#3, #5) */
  .controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
  .controls input.search{flex:1 1 220px;min-width:160px;font-size:14px;padding:8px 12px}
  .controls select{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink)}
  .controls select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .progress{margin:0 0 16px}
  .progress .lab{font-size:12.5px;color:var(--ink-2);font-family:var(--mono);margin-bottom:5px;display:block}
  .progress .track{height:7px;border-radius:20px;background:var(--surface-2);overflow:hidden}
  .progress .fill{height:100%;background:var(--good);border-radius:20px;transition:width .25s}
  /* active card for keyboard navigation (#4) */
  .card.active{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px var(--accent-soft),var(--shadow)}
  .goldactions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  /* golden action — the hero button: big, gold, unmistakable */
  .btn.golden{background:#C99700;border-color:#B8860B;color:#1a1400;font-size:14px;font-weight:750;
    padding:10px 18px;border-radius:8px;letter-spacing:.01em;box-shadow:0 1px 2px rgba(0,0,0,.12),0 3px 10px rgba(201,151,0,.35)}
  .btn.golden:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn.golden.is-set{background:var(--good);border-color:var(--good);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 3px 10px rgba(47,133,90,.3)}
  .tag.golden{background:#C99700;color:#1a1400;font-weight:700}
  .card.golden{border-color:#C99700;box-shadow:inset 4px 0 0 #C99700,var(--shadow)}
  /* spam action — clearly a distinct danger action, not muted */
  .spambtn{margin-left:6px;border:1.5px solid var(--crit);background:var(--crit-soft);color:var(--crit);
    border-radius:8px;padding:8px 16px;font-size:13.5px;font-weight:700}
  .spambtn:hover{background:var(--crit);color:#fff}
  .spambtn::before{content:"🚫 "}
  kbd{font-family:var(--mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--ink)}
  /* structured verdict: reason codes + critical flag */
  .reasons-panel{width:100%;border-top:1px dashed var(--border);margin-top:10px;padding-top:10px}
  .reasons-panel .rl{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:6px}
  .rchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .rchip{border:1px solid var(--border);background:var(--surface);color:var(--ink-2);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600}
  .rchip:hover{border-color:var(--warn)}
  .rchip.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .crit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .crit-row .cl{font-size:12px;font-weight:700;color:var(--crit)}
  .crit-row select{font-family:inherit;font-size:12.5px;padding:6px 10px;border:1.5px solid var(--crit);border-radius:6px;background:var(--crit-soft);color:var(--crit);font-weight:650}
  .reasons-panel textarea.other{min-height:44px;font-size:13px;margin-bottom:2px}
  .card.critical{box-shadow:inset 4px 0 0 var(--crit),var(--shadow)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading…</div></div>

<script>
// No external libraries and no module imports — pure fetch, so this renders and
// runs from a local file (file://) without CORS/module issues. Auth is email +
// password (no email round-trip or redirect). Security is unchanged: the anon key
// is public, and RLS lets an allowlisted reviewer read drafts + update only the
// verdict/gold_answer columns.
var SB_URL = "https://pqwnpcibymtmcpnqlkle.supabase.co";
var SB_ANON = "sb_publishable_EfplAQ5QfMOuu1Y5PWPf6g_psU9lNGA";
var TOKEN_KEY = "coach_review_token";
// Bump on each deploy so we can tell from the page which build is loaded (cache check).
var APP_VERSION = "v2026-07-30-crm-fallback";

var app = document.getElementById("app");
var esc = function (s) { return (s == null ? "" : String(s)); };
var rows = [], tab = "todo", token = null, refreshToken = null, meEmail = null;

// Columns fetched for each suggestion (used by loadData AND single-row reloads).
var COLS = "id,ticket_id,ticket_url,subject,customer_message,conversation_context,latest_unresolved_request,customer_subscriptions,ticket_type,language,confidence,coach_mode,draft,agent_analysis,rationale,sources,questions,detected_intent,qa_score,qa_verdict,qa_needs_review,qa_assessment,agent_qa_score,agent_qa_verdict,agent_qa_needs_review,agent_qa_assessment,verdict,verdict_at,verdict_by,verdict_reasons,critical_flag,review_version,agent_sent_reply,gold_answer,gold_answer_by,is_spam,prompt_version,created_at";

// Why an edited/unusable reply fell short — slug + Swedish label (CLAUDE.md / plan 1.3).
var REASONS = [
  ["wrong_fact", "Felaktig fakta"], ["unfounded_assumption", "Obelagt antagande"],
  ["wrong_cause", "Felaktig problemorsak"], ["wrong_solution", "Fel lösning"],
  ["wrong_incident", "Fel incident"], ["stale_incident", "Föråldrad incidentstatus"],
  ["wrong_routing", "Fel routning"], ["missed_question", "Missad kundfråga"],
  ["missed_check", "Missad kontrollpunkt"], ["wrong_language", "Fel språk"],
  ["weak_tone", "Svag ton"], ["too_long", "För långt/otydligt"],
  ["security_privacy", "Säkerhets-/integritetsrisk"], ["should_have_abstained", "AI borde ha avstått"],
  ["attachment_unreadable", "Bilaga kunde inte granskas"], ["insufficient_source", "Otillräcklig kunskapskälla"],
];
// Severe errors — any one of these forces the verdict to unusable (enforced in the DB).
var CRITICALS = [
  ["legal_advice", "Felaktig juridisk rådgivning"], ["wrongful_deletion", "Felaktig radering"],
  ["unauthorized_access", "Obehörig åtkomst"], ["pii_risk", "Personuppgiftsrisk"],
  ["false_promise", "Felaktigt kundlöfte"], ["invented_feature", "Påhittad produktfunktion"],
];
var reasonLabel = function (slug) { for (var i = 0; i < REASONS.length; i++) if (REASONS[i][0] === slug) return REASONS[i][1]; return slug; };

// Rows with unsaved ideal-answer edits — used to warn before leaving the page.
var dirtyGold = {};
window.addEventListener("beforeunload", function (e) {
  for (var k in dirtyGold) { if (dirtyGold[k]) { e.preventDefault(); e.returnValue = ""; return ""; } }
});
// view state for search / filter / sort / keyboard (Fas 2)
var search = "", fLang = "", fType = "", fConf = "", sortBy = "newest";
var fMode = "", fCrit = "", fCohort = "";
var holdoutIds = {}; // ticket_id -> 1 for the locked holdout cohort (reviewer-readable)
var shown = [], cardEls = [], activeIdx = -1;

// Reason-code slug -> Swedish label (mirror of the write-side list) + critical labels,
// so judged cards can show back what was picked without re-opening the panel.
var REASON_LABELS = {
  wrong_fact: "Felaktig fakta", unfounded_assumption: "Obelagt antagande",
  wrong_cause: "Felaktig problemorsak", wrong_solution: "Fel lösning",
  wrong_incident: "Fel incident", stale_incident: "Föråldrad incidentstatus",
  wrong_routing: "Fel routning", missed_question: "Missad kundfråga",
  missed_check: "Missad kontrollpunkt", wrong_language: "Fel språk",
  weak_tone: "Svag ton", too_long: "För långt/otydligt",
  security_privacy: "Säkerhets-/integritetsrisk", should_have_abstained: "AI borde ha avstått",
  attachment_unreadable: "Bilaga kunde inte granskas", insufficient_source: "Otillräcklig kunskapskälla",
};
var CRITICAL_LABELS = {
  legal_advice: "Felaktig juridisk rådgivning", wrongful_deletion: "Felaktig radering",
  unauthorized_access: "Obehörig åtkomst", pii_risk: "Personuppgiftsrisk",
  false_promise: "Felaktigt kundlöfte", invented_feature: "Påhittad produktfunktion",
};
function reasonText(slug) {
  if (typeof slug === "string" && slug.indexOf("other:") === 0) return slug.slice(6);
  return REASON_LABELS[slug] || slug;
}

boot();
function boot() {
  var saved = null;
  try { saved = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  if (saved) {
    var o = null; try { o = JSON.parse(saved); } catch (e) {}
    if (o && o.access_token) { token = o.access_token; refreshToken = o.refresh_token || null; meEmail = o.email; return loadData(); }
  }
  renderAuth();
}

async function api(path, opts, _retried) {
  opts = opts || {};
  var headers = { apikey: SB_ANON, "Content-Type": "application/json" };
  if (token) headers["Authorization"] = "Bearer " + token;
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
  var res = await fetch(SB_URL + path, { method: opts.method || "GET", headers: headers, body: opts.body });
  // Access token expired? Silently renew with the refresh token and retry once, so
  // the session survives past the ~1h token lifetime — no re-typing credentials.
  if (res.status === 401 && !_retried && refreshToken) {
    if (await refresh()) return api(path, opts, true);
  }
  return res;
}

async function refresh() {
  try {
    var res = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });
    if (!res.ok) return false;
    var data = await res.json();
    if (!data.access_token) return false;
    token = data.access_token;
    refreshToken = data.refresh_token || refreshToken; // Supabase rotates it
    persist();
    return true;
  } catch (e) { return false; }
}

function persist() {
  try {
    localStorage.setItem(TOKEN_KEY, JSON.stringify({ access_token: token, refresh_token: refreshToken, email: meEmail }));
  } catch (e) {}
}

// ---- auth ----
function renderAuth(msg, cls) {
  app.innerHTML =
    '<div class="auth">' +

function setAuthMsg(t, cls) {

async function doLogin(email, password) {
  if (!email || !password) return setAuthMsg("Enter your email and password.", "err");
  setAuthMsg("Signing in…", "ok");
  try {
    var res = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: SB_ANON, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password }),
    });
    var data = await res.json();
    if (!res.ok) return setAuthMsg(data.error_description || data.msg || data.error || "Sign-in failed.", "err");
    token = data.access_token; refreshToken = data.refresh_token || null; meEmail = (data.user && data.user.email) || email;

  } catch (e) { setAuthMsg("Network error: " + e.message, "err"); }
}
function signOut() {
  token = null; refreshToken = null; meEmail = null;

// ---- data ----
async function loadData() {
  app.innerHTML = '<div class="empty">Loading tickets…</div>';
  try {
    var res = await api("/rest/v1/suggestions?select=" + COLS + "&order=created_at.desc&limit=300");
    if (res.status === 401) { signOut(); return; }
    var data = await res.json();
    if (!res.ok) {
      app.innerHTML = '<div class="empty">Couldn\'t load (' + esc((data && data.message) || res.status) +
        ").<br>If this says permission denied, your email isn't on the reviewer allowlist yet.</div>";
      return;
    }
    var all = Array.isArray(data) ? data : [];
    await loadMyReviews(all);
    // hide reviewer-flagged spam (is_spam) and any auto-reply noise the ingest missed
    rows = all.filter(function (r) { return !r.is_spam && !isSpam(r.subject); });
    await loadHoldout(); // best-effort; enables the holdout progress + filter
    var deep = (window.location.hash || "").match(/^#generation=(\d+)$/);
    if (deep) { search = deep[1]; tab = "all"; }
    render();
  } catch (e) {
    app.innerHTML = '<div class="empty">Network error: ' + esc(e.message) + "</div>";
  }
}

// Review rows are separate from immutable generations. Load the signed-in
// reviewer's own optimistic-lock version; the flattened fields on suggestions
// remain the shared/latest read projection used by the cards.
async function loadMyReviews(targetRows) {
  if (!meEmail) return;
  try {
    var res = await api(
      "/rest/v1/suggestion_reviews?select=generation_id,review_version" +
      "&reviewer_email=eq." + encodeURIComponent(meEmail.toLowerCase()),
    );
    if (!res.ok) return;
    var mine = await res.json(), versions = {};
    for (var i = 0; i < (mine || []).length; i++) {
      versions[mine[i].generation_id] = mine[i].review_version;
    }
    for (var j = 0; j < targetRows.length; j++) {
      targetRows[j].my_review_version = versions[targetRows[j].id] || 0;
    }
  } catch (e) { /* a save will surface a real access error */ }
}

// Fetch the locked holdout ticket ids (reviewer-readable per migration 27). If the
// grant/policy isn't there, this fails quietly and the holdout features stay hidden.
async function loadHoldout() {
  holdoutIds = {};
  try {
    var res = await api("/rest/v1/ticket_cohorts?select=ticket_id&cohort=eq.holdout");
    if (!res.ok) return;
    var data = await res.json();
    for (var i = 0; i < (data || []).length; i++) holdoutIds[data[i].ticket_id] = 1;
  } catch (e) { /* holdout features simply won't show */ }
}

// Which rows belong to the current tab (before search/filter/sort).
function tabRows() {

}

// distinct non-empty values of a field across all rows, for filter dropdowns
function distinct(field) {
  var seen = {}, out = [];
  for (var i = 0; i < rows.length; i++) {
    var v = rows[i][field];
    if (v && !seen[v]) { seen[v] = 1; out.push(v); }

}

// A <select> whose first option is the "all/default" label, then [value,label] pairs.
function selectEl(allLabel, opts, cur, onchange) {

  sel.setAttribute("aria-label", allLabel); // no visible <label>; announce the filter's purpose
  var o0 = document.createElement("option"); o0.value = ""; o0.textContent = allLabel; sel.appendChild(o0);
  for (var i = 0; i < opts.length; i++) {

function progressEl() {
  var reviewable = rows.filter(function (r) { return r.prompt_version !== "agent-scan"; });
  var judged = reviewable.filter(function (r) { return r.verdict; }).length;
  var total = reviewable.length;
  var pct = total ? Math.round(100 * judged / total) : 0;
  // Holdout progress (the locked eval set) — the number that actually gates Gate 1.
  var hoLab = "";
  if (hasHoldout()) {
    var ho = reviewable.filter(function (r) { return holdoutIds[r.ticket_id]; });
    var hoJudged = ho.filter(function (r) { return r.verdict; }).length;

  }

    '<div class="track" role="progressbar" aria-label="Judging progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="fill" style="width:' + pct + '%"></div></div>';

// renderList() rebuilds ONLY the card list, applying search + filters + sort on top
// of the active tab. Called on every keystroke/filter change; leaves controls intact.
function renderList() {
  var base = tabRows();
  var q = search.trim().toLowerCase();
  shown = base.filter(function (r) {
    if (fLang && r.language !== fLang) return false;
    if (fType && r.ticket_type !== fType) return false;
    if (fConf && (r.confidence || "none") !== fConf) return false;
    if (fMode && r.coach_mode !== fMode) return false;
    if (fCrit === "yes" && !(r.critical_flag && r.critical_flag.trim())) return false;
    if (fCohort === "holdout" && !holdoutIds[r.ticket_id]) return false;
    if (q) {
      var products = r.customer_subscriptions && Array.isArray(r.customer_subscriptions.subscriptions)
        ? r.customer_subscriptions.subscriptions.map(function (s) {
          return [s.productName, s.renewalStatus, s.endDate].filter(Boolean).join(" ");
        }).join(" ")
        : "";
      var hay = (String(r.id) + " " + String(r.ticket_id) + " " + (r.subject || "") + " " + (r.draft || "") + " " + (r.customer_message || "") + " " + products).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  shown.sort(sortFn);

  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";

  if (!shown.length) {
    var e = el("div", "empty");
    e.textContent = tab === "todo" ? "Nothing left to review 🎉" : "Nothing matches.";
    lw.appendChild(e);
    return;
  }
  for (var i = 0; i < shown.length; i++) {
    var card = cardEl(shown[i]);
    cardEls.push(card); lw.appendChild(card);
  }
}

function sortFn(a, b) {
  if (sortBy === "qa") return (a.qa_score == null ? 999 : a.qa_score) - (b.qa_score == null ? 999 : b.qa_score);
  if (sortBy === "agentqa") return (a.agent_qa_score == null ? 999 : a.agent_qa_score) - (b.agent_qa_score == null ? 999 : b.agent_qa_score);
  if (sortBy === "conf") { var rank = { high: 3, medium: 2, low: 1, none: 0 }; return (rank[b.confidence] || 0) - (rank[a.confidence] || 0); }
  return String(b.created_at || "").localeCompare(String(a.created_at || "")); // newest
}

function tabEl(id, label, n) {
  var b = el("button", "tab" + (tab === id ? " on" : ""));

// ---- keyboard navigation (#4): j/k move, u/e/n verdict, g focus ideal answer ----
function setActive(idx) {
  if (activeIdx >= 0 && cardEls[activeIdx]) cardEls[activeIdx].classList.remove("active");
  activeIdx = idx;
  var c = cardEls[activeIdx];
  if (c) { c.classList.add("active"); c.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function moveActive(delta) {
  if (!cardEls.length) return;
  var next = activeIdx < 0 ? 0 : activeIdx + delta;
  if (next < 0) next = 0;
  if (next > cardEls.length - 1) next = cardEls.length - 1;
  setActive(next);
}
document.addEventListener("keydown", function (e) {
  if (!token || !shown.length) return;
  var t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  var k = e.key.toLowerCase();
  if (k === "j" || e.key === "ArrowDown") { e.preventDefault(); moveActive(1); }
  else if (k === "k" || e.key === "ArrowUp") { e.preventDefault(); moveActive(-1); }
  else if (k === "u" || k === "e" || k === "n") {
    if (activeIdx < 0) return;
    var v = k === "u" ? "usable" : k === "e" ? "edited" : "unusable";
    var c = cardEls[activeIdx];
    e.preventDefault(); if (c && c._setVerdict) c._setVerdict(v);
  } else if (k === "g") {
    if (activeIdx < 0) return;
    var ta = cardEls[activeIdx].querySelector("textarea");
    if (ta) { e.preventDefault(); ta.focus(); }
  }
});

function cardEl(r) {

  if (r.critical_flag) tags.appendChild(tag("⚠ " + (CRITICAL_LABELS[r.critical_flag] || r.critical_flag), "bad"));

  if (r.verdict && ((Array.isArray(r.verdict_reasons) && r.verdict_reasons.length) || r.critical_flag)) {

  gactions.appendChild(save);
  if (r.agent_sent_reply) {

  }
  var rec = r.agent_qa_assessment && r.agent_qa_assessment.recommendedReply;
  if (rec) {

  }
  gbar.appendChild(gactions);
  gbar.appendChild(st); gold.appendChild(gbar); card.appendChild(gold);

  // ---- structured verdict: buttons + reason codes + critical flag ----
  // Per-card review state (kept in closure; committed together via saveReview).
  var arr = Array.isArray(r.verdict_reasons) ? r.verdict_reasons : [];
  var selReasons = {};
  var otherText = "";
  for (var ri = 0; ri < arr.length; ri++) {

    for (var i = 0; i < bs.length; i++) bs[i].className = "vbtn" + (bs[i].getAttribute("data-v") === verdict ? " sel" : "");
    var show = verdict === "edited" || verdict === "unusable" || reasonsArray().length > 0 || !!critical;
    var panel = card._reasonsPanel; if (panel) panel.style.display = show ? "" : "none";
    saveReview(r, card, { verdict: verdict, verdict_reasons: reasonsArray(), critical_flag: critical || null });
  }
  card._setVerdict = commit; // so keyboard shortcuts can trigger it

  var actions = el("div", "actions");
  actions.appendChild(set(el("span", "lab"), "Would you have sent this?"));
  ["usable", "edited", "unusable"].forEach(function (v) {
    var b = el("button", "vbtn" + (r.verdict === v ? " sel" : ""));
    b.setAttribute("data-v", v); b.textContent = v.charAt(0).toUpperCase() + v.slice(1);
    b.onclick = function () { commit(v); };
    actions.appendChild(b);
  });
  var state = el("span", "vstate"); state.setAttribute("aria-live", "polite");
  state.textContent = r.verdict ? ("recorded: " + r.verdict + (r.verdict_by ? " · " + r.verdict_by : "")) : "";
  actions.appendChild(state);
  var spam = el("button", "spambtn"); spam.textContent = "Spam"; spam.title = "Mark as spam / noise and hide it";
  spam.onclick = function () { markSpam(r); };
  actions.appendChild(spam);
  if (r.ticket_url) {
    var link = document.createElement("a");
    link.className = "ticketlink"; link.href = esc(r.ticket_url); link.target = "_blank"; link.rel = "noopener";
    link.textContent = "Open in Freshdesk ↗";
    actions.appendChild(link);
  }
  card.appendChild(actions);

  // Reasons panel — shown for edited/unusable (or whenever reasons/critical exist).
  var rp = el("div", "reasons-panel");
  function panelVisible() { return r.verdict === "edited" || r.verdict === "unusable" || reasonsArray().length > 0 || !!critical; }
  rp.style.display = panelVisible() ? "" : "none";
  rp.appendChild(set(el("span", "rl"), "Varför? (felskäl — flera möjliga)"));
  var chips = el("div", "rchips");
  REASONS.forEach(function (rc) {
    var c = el("button", "rchip" + (selReasons[rc[0]] ? " on" : ""));
    c.textContent = rc[1];
    c.onclick = function () {
      selReasons[rc[0]] = !selReasons[rc[0]];
      c.className = "rchip" + (selReasons[rc[0]] ? " on" : "");
      commit();
    };
    chips.appendChild(c);
  });
  rp.appendChild(chips);

  var critRow = el("div", "crit-row");
  critRow.appendChild(set(el("span", "cl"), "⚠ Kritiskt fel:"));
  var csel = document.createElement("select");
  var c0 = document.createElement("option"); c0.value = ""; c0.textContent = "(inget)"; csel.appendChild(c0);
  CRITICALS.forEach(function (cc) {
    var o = document.createElement("option"); o.value = cc[0]; o.textContent = cc[1];
    if (cc[0] === critical) o.selected = true;
    csel.appendChild(o);
  });
  csel.onchange = function () { critical = csel.value; commit(); };
  critRow.appendChild(csel);
  rp.appendChild(critRow);

  var other = document.createElement("textarea");
  other.className = "other"; other.placeholder = "Annat / fritext…"; other.value = otherText;
  other.oninput = function () {
    otherText = other.value;
    if (r._reasonTimer) clearTimeout(r._reasonTimer);
    r._reasonTimer = setTimeout(function () { r._reasonTimer = null; commit(); }, 1000);
  };
  rp.appendChild(other);
  card.appendChild(rp);
  card._reasonsPanel = rp; card._panelVisible = panelVisible;
  if (critical) card.classList.add("critical");
  return card;
}

// Save verdict + reasons + critical atomically, with optimistic locking so a second
// reviewer can't silently overwrite. Filters on the review_version we last read; a
// stale write matches 0 rows → we reload and tell the reviewer.
async function saveReview(r, card, patch) {
  var vs = card.querySelector(".vstate");
  vs.textContent = "sparar…";
  var body = {
    p_generation_id: r.id,
    p_expected_version: r.my_review_version || 0,
    p_verdict: patch.verdict,
    p_verdict_reasons: patch.verdict_reasons,
    p_critical_flag: patch.critical_flag
  };
  try {
    var res = await api("/rest/v1/rpc/submit_generation_verdict", {
      method: "POST",
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      var msg = await res.text();
      if (msg.indexOf("review version conflict") >= 0) {
        vs.textContent = "en nyare egen bedömning finns — laddar om…";
        await reloadRow(r, card);
      } else {
        vs.textContent = "kunde inte spara: " + msg;
      }
      return;
    }
    var out = await res.json();
    if (!out.length) { vs.textContent = "inget sparades — laddar om…"; await reloadRow(r, card); return; }
    var saved = out[0];
    r.verdict = saved.verdict;
    r.verdict_reasons = saved.verdict_reasons;
    r.critical_flag = saved.critical_flag;
    r.verdict_by = saved.reviewer_email;
    r.verdict_at = saved.updated_at;
    r.review_version = saved.review_version;
    r.my_review_version = saved.review_version;
    // reflect verdict button selection + state text
    var btns = card.querySelectorAll(".vbtn");
    for (var i = 0; i < btns.length; i++) btns[i].className = "vbtn" + (btns[i].getAttribute("data-v") === r.verdict ? " sel" : "");
    vs.textContent = "sparat: " + (r.verdict || "—") + (r.verdict_by ? " · " + r.verdict_by : "");
    card.classList.toggle("critical", !!r.critical_flag);
    if (card._reasonsPanel && card._panelVisible) card._reasonsPanel.style.display = card._panelVisible() ? "" : "none";
  } catch (e) { vs.textContent = "kunde inte spara: " + e.message; }
}

// Re-fetch one row and swap its card in place (after a save conflict).
async function reloadRow(r, card) {
  try {
    var res = await api("/rest/v1/suggestions?id=eq." + r.id + "&select=" + COLS);
    var out = await res.json();
    if (out && out[0]) {
      await loadMyReviews(out);
      Object.assign(r, out[0]);
      var fresh = cardEl(r);
      var i = cardEls.indexOf(card);
      if (i >= 0) cardEls[i] = fresh;
      card.replaceWith(fresh);
    }
  } catch (e) { /* leave the stale card; the status line already told the reviewer */ }
}

async function saveGold(r, text, st, mark, _retried) {
  st.textContent = "Sparar…";
  dirtyGold[r.id] = true; // unsaved until the write confirms
  try {
    var res = await api("/rest/v1/rpc/save_generation_gold_answer", {
      method: "POST",
      body: JSON.stringify({ p_generation_id: r.id, p_gold_answer: text }),
    });
    if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
    var out = await res.json(), saved = out && out[0];
    r.gold_answer = text;
    if (saved) {
      r.gold_answer_by = saved.reviewer_email;
      r.my_review_version = saved.review_version;
      r.review_version = Math.max(r.review_version || 0, saved.review_version || 0);
    }
    delete dirtyGold[r.id];
    var has = !!text.trim();
    st.textContent = has ? "Sparat ✓" : "Rensat";
    if (mark) {
      mark.className = "btn golden" + (has ? " is-set" : "");
      mark.textContent = has ? "★ Golden — saved" : "★ Mark as golden";
      var card = mark.closest(".card");
      if (card) card.classList.toggle("golden", has);
    }
  } catch (e) {
    // network blip → one automatic retry after a short pause; text is kept (dirty).
    if (!_retried) {
      st.textContent = "Nätverksfel — försöker igen…";
      setTimeout(function () { saveGold(r, text, st, mark, true); }, 1500);
    } else {
      st.textContent = "Kunde inte spara (nätverksfel) — texten är kvar, försök igen.";
    }
  }
}

// Debounced autosave: save ~1s after the reviewer stops typing (per-row timer).
function scheduleGoldSave(r, ta, st, mark) {
  st.textContent = "Ändrat…"; dirtyGold[r.id] = true;
  if (r._goldTimer) clearTimeout(r._goldTimer);
  r._goldTimer = setTimeout(function () { r._goldTimer = null; saveGold(r, ta.value, st, mark); }, 1000);
}

// Mark a ticket as spam/noise: persist is_spam=true, then drop it from the list.
async function markSpam(r) {
  if (!window.confirm("Mark #" + r.ticket_id + " as spam and hide it? It stays out of the eval and rewrite queue.")) return;
  try {
    var res = await api("/rest/v1/rpc/mark_generation_spam", {
      method: "POST",
      body: JSON.stringify({ p_generation_id: r.id }),
    });
    if (!res.ok) { window.alert("Couldn't mark as spam: " + (await res.text())); return; }
    r.is_spam = true;
    rows = rows.filter(function (x) { return x.id !== r.id; });
    render();
  } catch (e) { window.alert("Network error: " + e.message); }
}

function detail(label, text) {
  var d = document.createElement("details");
  var sum = document.createElement("summary"); sum.textContent = esc(label); d.appendChild(sum);
  d.appendChild(set(el("div", "body"), esc(text)));
  return d;
}
function helpPanel() {
  var d = document.createElement("details");
  d.className = "help";
  d.innerHTML =
    '<summary>How to train the AI — read me</summary>' +
    '<div class="hbody">' +
    '<p>Your job here is to teach the AI what a <b>great reply</b> looks like, so it drafts closer to how <b>you</b> would handle a ticket. The ideal answer you write is the real training signal.</p>' +
    '<h4>Verdict — "Would I have sent this?"</h4>' +

    '<h4>Writing the ideal answer</h4>' +
    '<ul>' +
    '<li>Write the reply you actually <b>would have sent</b> — complete, ready to send, in the customer\'s language.</li>' +
    '<li>Give the <b>real resolution and concrete steps</b>, not vague reassurance ("we\'ll look into it").</li>' +
    '<li>Add the <b>operational knowledge the AI cannot know</b> — the known incident, the exact setting, the actual fix, who to route to (sales / consultant; legal → Simployer Expert). This is where the AI is weakest, so it is the most valuable thing you add.</li>' +
    '<li>State only what is <b>true</b>. If something must be checked in the system, say what to verify instead of guessing.</li>' +
    '<li>Do not invent facts or promise timelines you cannot keep.</li>' +
    '</ul>' +
    '<h4>Where to spend your time</h4>' +
    '<ul>' +
    '<li>Prioritise tickets the AI got <b>wrong</b> (Unusable / Edited) where you have a clear correct answer — those teach the most.</li>' +
    '<li>A short, correct answer beats a long, hedged one.</li>' +
    '<li>Tip: click <b>"use agent\'s reply"</b> to start the box from what was actually sent, then tighten it — or <b>★ Mark as golden</b> to adopt it as-is in one click.</li>' +
    '<li>The ideal answer <b>autosaves</b> ~1&nbsp;second after you stop typing (the Save button still works).</li>' +
    '<li>Use <b>Search</b> and the <b>Language / Type / Confidence / Sort</b> filters to find the tickets worth your time; the bar shows how many you have <b>granskade</b> (reviewed).</li>' +
    '<li>Junk that slipped through (absence replies, marketing bounces)? Hit <b>Spam</b> to hide it and keep it out of the stats.</li>' +
    '</ul>' +
    '<h4>★ Mark as golden — when &amp; why</h4>' +
    '<p>Marking a ticket <b>golden</b> saves its ideal answer as <b>training material</b>: an exemplar the AI learns its style and approach from on <i>other</i> tickets. Use it when you have a reply that is genuinely how it should be done.</p>' +
    '<ul>' +
    '<li><b>Use it when</b> the answer in the box is correct, complete and ready to send — either the agent nailed it, or you have written/fixed it so it is right.</li>' +

    '<li><b>Don’t</b> mark it golden if the answer is vague, unverified or wrong — a bad exemplar teaches the AI the wrong thing. Fix it first, or leave it.</li>' +
    '<li>A card shows a gold <b>★ Golden</b> badge and accent once saved; re-saving updates it.</li>' +
    '</ul>' +

    '<ul>' +
    '<li><b>Agent’s reply is already excellent</b> (often Johanna’s) → click <b>★ Mark as golden</b> straight away (an empty box adopts the agent’s reply). One click = “this is how it should look.”</li>' +
    '<li><b>Good but needs tightening</b> → <b>use agent’s reply</b> → edit → <b>★ Mark as golden</b>.</li>' +
    '<li><b>Weak / wrong / missing</b> (solved by phone or in a private note) → write the ideal answer from scratch → <b>★ Mark as golden</b>. This is where you add the most: the operational knowledge that isn’t written down anywhere.</li>' +
    '</ul>' +
    '<h4>🚫 Spam — when &amp; why</h4>' +
    '<p>Spam hides a ticket and keeps it out of the evaluation, the rewrite queue <b>and</b> future training runs. It is for <b>noise, not bad answers</b>.</p>' +
    '<ul>' +
    '<li><b>Use it when</b> the ticket is not a real support question: out-of-office / absence auto-replies, marketing bounces (“Re: Simployer Expert…”), automatic call-logs, or empty/duplicate notifications.</li>' +

  return d;

function isSpam(subject) {
  var s = (subject || "").toLowerCase();
  if (/^\s*(automatic reply|automatisk svar|automatiskt svar|autosvar|automaattinen vastaus|out of office|out-of-office|frånvaro|frånvarande|ute av kontoret|auto[- ]?reply|feriesvar|semestersvar|fraværsmelding|fraværsassistent)\b/.test(s)) return true;
  var mk = ["det sier mye om deg at du bruker simployer expert", "smarte måter å få mer ut av simployer expert", "dette venter på deg i simployer expert", "oppdag alt simployer expert har å tilby", "slik får du mest ut av simployer expert", "upptäck allt som simployer expert har att erbjuda"];
  return mk.some(function (m) { return s.indexOf(m) >= 0; });
}
// Split text into readable paragraphs (blank line = new paragraph); keeps single
// newlines inside a paragraph via white-space:pre-wrap. Avoids the "wall of text".
function proseEl(text) {
  var box = el("div", "prose");
  var paras = String(text == null ? "" : text).split(/\n\s*\n/);
  for (var i = 0; i < paras.length; i++) {
    var t = paras[i].replace(/^\s+|\s+$/g, "");
    if (t) box.appendChild(set(document.createElement("p"), t));
  }
  if (!box.childNodes.length) box.appendChild(document.createElement("p"));
  return box;
}
// Verified Freshworks CRM context is rendered directly from stored structured
// data. It is not AI output, and only the three approved subscription fields are
// accepted here.
function subscriptionContextEl(context) {
  var box = el("section", "subs");
  box.appendChild(set(el("span", "sl"), "Customer subscriptions · verified Freshworks CRM data"));

  if (!context) {
    box.appendChild(set(el("p", "sstate"), "Not collected for this generation. Run a new test after the CRM integration is enabled."));
    return box;
  }
  if (context.status === "unavailable") {
    box.appendChild(set(el("p", "sstate"), "Temporarily unavailable — verify manually."));
    return box;
  }
  if (context.status === "no_match") {
    box.appendChild(set(el("p", "sstate"), "No CRM account matched the requester email or the ticket's company."));
    return box;
  }
  if (context.status === "ambiguous") {
    var msg = "⚠️ Several similar CRM accounts match this customer — check the CRM manually before relying on subscription data.";
    var candidates = Array.isArray(context.candidates) ? context.candidates.filter(function (n) { return typeof n === "string" && n.trim(); }) : [];
    if (candidates.length) msg += " Candidates: " + candidates.join(" · ") + ".";
    box.appendChild(set(el("p", "sstate"), msg));
    return box;
  }

  var matchNotes = {
    company_name: "Matched via the ticket's company.",
    company_name_prefix: "Matched via the ticket's company — the name differs slightly, verify it is the right account.",
    email_domain: "Matched via the requester's email domain — verify it is the right account."
  };
  if (context.matchedBy && matchNotes[context.matchedBy]) {
    box.appendChild(set(el("p", "sstate"), matchNotes[context.matchedBy]));
  }

  var subscriptions = Array.isArray(context.subscriptions) ? context.subscriptions : [];
  if (!subscriptions.length) {
    box.appendChild(set(el("p", "sstate"), "No subscriptions found for the matched account."));
    return box;
  }

  var table = document.createElement("table");
  var head = document.createElement("thead");
  var hr = document.createElement("tr");
  ["Product name", "Renewal status", "End date"].forEach(function (label) {
    hr.appendChild(set(document.createElement("th"), label));
  });
  head.appendChild(hr);
  table.appendChild(head);
  var body = document.createElement("tbody");
  subscriptions.forEach(function (subscription) {
    var row = document.createElement("tr");
    [subscription.productName, subscription.renewalStatus, subscription.endDate].forEach(function (value) {
      row.appendChild(set(document.createElement("td"), value == null || String(value).trim() === "" ? "—" : String(value)));
    });
    body.appendChild(row);
  });
  table.appendChild(body);
  box.appendChild(table);
  return box;
}
// QA score → colour band: red < 60, amber 60-74, green 75+ (or red if flagged).
function qaCls(score, needsReview) {
  return (needsReview || score < 60) ? "bad" : score < 75 ? "c-low" : "c-high";
}
// Coach mode (Fas 3) → short label + colour class.
function modeLabel(m) {
  return m === "REPLY_READY" ? "🟢 Reply ready"
    : m === "AGENT_ACTION_REQUIRED" ? "🔴 Action required"
    : "🟡 Coach";
}
function modeCls(m) {
  return m === "REPLY_READY" ? "m-ready" : m === "AGENT_ACTION_REQUIRED" ? "m-action" : "m-coach";
}
// QA-coach breakdown: an expandable per-criterion 1–5 table + top improvements.
function qaDetailsEl(a, label) {
  var d = document.createElement("details");
  var sum = document.createElement("summary");
  sum.textContent = label + (a.totalScore != null ? " · " + a.totalScore + "/100" : "") + (a.verdict ? " " + a.verdict : "");
  d.appendChild(sum);
  var body = el("div", "qabody");
  for (var i = 0; i < a.scorecard.length; i++) {
    var c = a.scorecard[i];
    var row = el("div", "qarow");
    var sc = el("span", "qs s" + (c.score || 0)); sc.textContent = (c.score != null ? c.score : "–") + "/5";
    row.appendChild(sc);
    row.appendChild(set(el("span", "qn"), c.criterion || c.criterionId || "—"));
    if (c.rationale) row.appendChild(set(el("span", "qr"), c.rationale));
    body.appendChild(row);
  }
  if (Array.isArray(a.topThreeImprovements) && a.topThreeImprovements.length) {
    var imp = el("div", "qaimp");
    imp.appendChild(set(el("span", "qn"), "Top improvements:"));
    var ul = document.createElement("ul");
    a.topThreeImprovements.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
    imp.appendChild(ul); body.appendChild(imp);
  }
  d.appendChild(body); return d;
}
function tag(text, cls) { return set(el("span", "tag" + (cls ? " " + cls : "")), esc(text)); }
function set(node, text) { node.textContent = text; return node; }
function el(t, cls) { var e = document.createElement(t); if (cls) e.className = cls; return e; }
