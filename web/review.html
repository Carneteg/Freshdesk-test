// ── Email artifact cleanup ──────────────────────────────────────────────────
//
// Freshdesk hands us the plain-text rendering of an HTML email, and it arrives
// carrying everything the mail client put there: inline-image placeholders,
// numbered signature images, mailto duplicates of every address, corporate
// link-rewriting (Proofpoint, Outlook safelinks) that turns a facebook.com link
// into 300 characters of tracking, and the whole quoted thread repeated on each
// reply. On #84342 the actual question is ONE line inside 1251 characters of
// that. On #87033 it is two questions inside 4304.
//
// Nothing here guesses at meaning — every rule removes a known machine-generated
// artifact or unwraps a wrapper back to what it wrapped. The count of removals
// is returned and shown, so text disappearing is visible rather than silent.

function unwrapProofpoint(u) {
  // Proofpoint v2 encodes the target with its own escapes rather than percent
  // encoding: -3A for ':', -2D for '-', _ for '/'.
  try {
    return decodeURIComponent(u)
      .replace(/-3A/g, ":").replace(/-2D/g, "-").replace(/-2F/g, "/")
      .replace(/-5F/g, "_").replace(/_/g, "/").replace(/-26/g, "&");
  } catch (_e) { return u; }
}

function cleanEmailText(raw) {
  var text = String(raw == null ? "" : raw);
  var removed = 0;
  function cut(re, replacement) {
    text = text.replace(re, function () {
      removed++;
      if (typeof replacement === "function") return replacement.apply(null, arguments);
      // A callback's return value is used verbatim, so "$1" would land as the
      // literal text "$1". Substitute the capture groups ourselves.
      var args = arguments;
      return replacement.replace(/\$([1-9])/g, function (_d, n) { return args[Number(n)] ?? ""; });
    });
  }

  text = text.replace(/\r\n/g, "\n");

  // Inline-image placeholders and the numbered signature images beside them.
  cut(/\[cid:[^\]\n]*\]/gi, "");
  cut(/\[signature_\d+\]/gi, "");
  // Alt text the mail client generated for a picture, in any of our languages.
  cut(/\[(?:Et bilde som inneholder|En bild som innehåller|Kuva, joka sisältää|A picture containing|Image|Bilde|Bild)[^\]\n]*\]/gi, "");

  // Corporate link rewriting, unwrapped back to the link it replaced.
  cut(/https?:\/\/urldefense\.proofpoint\.com\/v2\/url\?u=([^&\s>]+)[^\s>]*/gi,
    function (_m, u) { return unwrapProofpoint(u); });
  cut(/https?:\/\/[a-z0-9.-]*safelinks\.protection\.outlook\.com\/[^\s>]*[?&]url=([^&\s>]+)[^\s>]*/gi,
    function (_m, u) { try { return decodeURIComponent(u); } catch (_e) { return u; } });

  // "name@x<mailto:name@x>" is the same address twice. Keep one.
  cut(/([^\s<>]+@[^\s<>]+?)\s*<mailto:[^>\n]*>/gi, "$1");
  cut(/<mailto:[^>\n]*>/gi, "");
  // Phone artifacts: "(+47) 9<(+47)%2091185661>2626796" — the angle part is a
  // tel: link the client inlined mid-number.
  cut(/<(?:tel:|callto:)?\(?\+?[\d\s()%]{6,}>/gi, "");
  // A URL wrapped in angle brackets is just a URL.
  cut(/<(https?:\/\/[^>\s]+)>/gi, "$1");

  // The same paragraph repeated down a thread — keep the first occurrence. This
  // is what makes a five-reply chain readable.
  var seen = {};
  var paras = text.split(/\n\s*\n/);
  var kept = [];
  for (var i = 0; i < paras.length; i++) {
    var p = paras[i].replace(/^\s+|\s+$/g, "");
    if (!p) continue;
    var key = p.toLowerCase().replace(/\s+/g, " ");
    // Short lines ("Hei", "Takk") legitimately repeat; only dedupe real content.
    if (key.length > 24 && seen[key]) { removed++; continue; }
    seen[key] = true;
    kept.push(p);
  }
  text = kept.join("\n\n");

  return { text: text.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n").trim(), removed: removed };
}

// The quoted history below the new message. Cut for the EXCERPT only — the full
// view keeps it, because sometimes the answer is down there.
var QUOTED_HEAD = /^\s*(?:fra|från|from|sendt|sent|skickat|til|to|emne|subject|cc|kopi)\s*:\s/i;

function newestMessageOnly(text) {
  var lines = String(text || "").split("\n");
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (/^\s*(?:-{3,}\s*(?:original message|opprinnelig melding|ursprungligt meddelande)|_{10,}|-{10,})/i.test(l)
      || QUOTED_HEAD.test(l)) {
      var head = lines.slice(0, i).join("\n").replace(/\s+$/, "");
      // Only trust the cut if something substantial survives it.
      if (head.replace(/\s/g, "").length > 40) return head;
    }
  }
  return text;
}

// ── Key takeaways ───────────────────────────────────────────────────────────
//
// Built entirely from what the pipeline already extracted at generation time —
// the questions it found, the request it judged still unresolved, the intent it
// classified. No new model call, and nothing invented: if the analysis produced
// nothing, this falls back to the first cleaned paragraph of the mail.

function takeawaysEl(r, cleaned) {
  var box = el("div", "tk-sum");
  var qs = Array.isArray(r.questions) ? r.questions.filter(Boolean) : [];

  if (qs.length) {
    var ul = document.createElement("ul");
    ul.className = "tk-qs";
    qs.forEach(function (q) { ul.appendChild(set(document.createElement("li"), q)); });
    box.appendChild(ul);
  } else {
    // Nothing extracted — show the newest message rather than an empty box, and
    // skip the greeting: "Hei," is not what the ticket is about.
    var paras = newestMessageOnly(cleaned).split(/\n\s*\n/)
      .map(function (t) { return t.replace(/^\s+|\s+$/g, ""); })
      .filter(function (t) {
        return t.length > 30 && !/^(?:hei|hej|hallå|hi|hello|god dag|takk|tack)\b[\s,!.]*$/i.test(t);
      });
    box.appendChild(set(el("p", "tk-fallback"),
      paras.slice(0, 2).join("\n\n") || newestMessageOnly(cleaned) || "(no message text)"));
  }

  if (r.latest_unresolved_request && r.latest_unresolved_request.trim()) {
    var un = el("p", "tk-un");
    un.appendChild(set(el("b", ""), "Still unresolved: "));
    un.appendChild(document.createTextNode(r.latest_unresolved_request));
    box.appendChild(un);
  }
  return box;
}

// Summary first, raw thread behind a toggle. The default view is what the
// ticket is ABOUT; the full conversation is one click away for when it matters.
function conversationEl(r) {
  var raw = (r.customer_message && r.customer_message.trim())
    ? r.customer_message
    : (Array.isArray(r.questions) && r.questions.length ? r.questions.join("\n\n") : "");

  if (!hasMore) return box;

// Verified Freshworks CRM context is rendered directly from stored structured
// data. It is not AI output, and only the three approved subscription fields are
// accepted here.
// ---- rich-text ideal-answer editor (agent request): a formatter that also ----
// ---- understands pasted HTML. Everything rendered goes through the        ----
// ---- allowlist sanitizer below -- gold answers are reviewer-written data  ----
// ---- shown to other reviewers, so no script/style/attribute may survive.  ----
var FMT_ALLOWED = { B:1, STRONG:1, I:1, EM:1, U:1, P:1, BR:1, DIV:1, UL:1, OL:1, LI:1, A:1, H3:1, H4:1, BLOCKQUOTE:1 };
var FMT_DROP = /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|LINK|META|FORM|INPUT|BUTTON|TEXTAREA|SELECT|VIDEO|AUDIO|IMG|HEAD|TITLE)$/;

function sanitizeHtml(html) {
  // DOMParser documents are inert: scripts never execute during parsing.
  var doc = new DOMParser().parseFromString("<div>" + String(html || "") + "</div>", "text/html");
  var root = doc.body.firstChild;
  (function clean(node) {
    var kids = Array.prototype.slice.call(node.childNodes);
    for (var i = 0; i < kids.length; i++) {
      var child = kids[i];
      if (child.parentNode !== node) continue;
      if (child.nodeType === 3) continue;             // text
      if (child.nodeType !== 1) { node.removeChild(child); continue; } // comments etc
      var tag = child.nodeName;
      if (FMT_DROP.test(tag)) { node.removeChild(child); continue; }
      if (!FMT_ALLOWED[tag]) {
        clean(child); // sanitize inside first, then unwrap (keep the content)
        while (child.firstChild) node.insertBefore(child.firstChild, child);
        node.removeChild(child);
        continue;
      }
      for (var a = child.attributes.length - 1; a >= 0; a--) {
        var an = child.attributes[a].name;
        if (!(tag === "A" && an === "href")) child.removeAttribute(an);
      }
      if (tag === "A") {
        var href = child.getAttribute("href") || "";
        if (!/^(https?:|mailto:)/i.test(href)) child.removeAttribute("href");
        else { child.setAttribute("rel", "noopener noreferrer"); child.setAttribute("target", "_blank"); }
      }
      clean(child);
    }
  })(root);
  return root.innerHTML;
}

function escHtml(text) {
  return String(text || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function domToPlain(node) {
  var out = "";
  for (var i = 0; i < node.childNodes.length; i++) {
    var c = node.childNodes[i];
    if (c.nodeType === 3) out += c.nodeValue;
    else if (c.nodeName === "BR") out += "\n";
    else { out += domToPlain(c); if (/^(DIV|P|LI|H3|H4|BLOCKQUOTE)$/.test(c.nodeName)) out += "\n"; }
  }
  return out;
}

// Plain answers stay plain (the training corpus should not fill with markup
// nobody asked for); only real formatting (bold/lists/links/...) is stored as HTML.
function editorValue(ed) {
  var html = sanitizeHtml(ed.innerHTML);
  var probe = document.createElement("div");
  probe.innerHTML = html;
  if (!probe.querySelector("b,strong,i,em,u,ul,ol,li,a,h3,h4,blockquote")) {
    return domToPlain(probe).replace(/\u00a0/g, " ").replace(/\n{3,}/g, "\n\n").trim();
  }
  return html.trim();
}

function setEditorValue(ed, v) {
  v = v || "";
  if (/<[a-z][^>]*>/i.test(v)) ed.innerHTML = sanitizeHtml(v);
  else ed.innerHTML = escHtml(v).replace(/\r?\n/g, "<br>");
}

// Returns a textarea-compatible shim ({value, focus, oninput}) so the save/
// autosave plumbing is unchanged.
function richEditor(placeholder, ariaLabel) {
  var wrap = el("div", "goldwrap");
  var bar = el("div", "fmtbar");
  var ed = el("div", "goldedit");
  ed.contentEditable = "true";
  ed.setAttribute("role", "textbox");
  ed.setAttribute("aria-multiline", "true");
  ed.setAttribute("aria-label", ariaLabel);
  ed.setAttribute("data-placeholder", placeholder);

  function fmtBtn(labelHtml, title, run) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "fbtn"; b.innerHTML = labelHtml; b.title = title;
    b.setAttribute("aria-label", title);
    b.onmousedown = function (e) { e.preventDefault(); }; // keep the text selection
    b.onclick = function (e) {
      e.preventDefault(); ed.focus(); run();

    };

  }

  fmtBtn("<i>I</i>", "Italic", function () { document.execCommand("italic"); });
  fmtBtn("<u>U</u>", "Underline", function () { document.execCommand("underline"); });
  fmtBtn("&bull; list", "Bullet list", function () { document.execCommand("insertUnorderedList"); });

    root: wrap,

    set value(v) { setEditorValue(ed, v); },
    focus: function () { ed.focus(); },
    set oninput(fn) { ed.addEventListener("input", fn); },
  };
}

    box.appendChild(crmVerdictRow(r));

    var candidates = Array.isArray(context.candidates) ? context.candidates.filter(function (n) { return typeof n === "string" && n.trim(); }) : [];

    email_domain: "Matched via the requester's email domain — verify it is the right account."

    box.appendChild(set(el("p", "sstate"), matchNotes[context.matchedBy]));

  var subscriptions = Array.isArray(context.subscriptions) ? context.subscriptions : [];
  if (!subscriptions.length) {
    box.appendChild(set(el("p", "sstate"), "No subscriptions found for the matched account."));
    box.appendChild(crmVerdictRow(r));

  var table = document.createElement("table");

// Micro-verdict on the MATCH itself — shown on EVERY outcome, because the
// silent ones carry the information we cannot get anywhere else: when the
// lookup found nothing, only the agent knows whether the customer actually
// exists in the CRM. Coverage alone measures nothing without that.
// Saved via submit_crm_match_verdict; never bumps the reply-verdict version,
// but syncs the returned version so the judging lock stays correct.
function crmVerdictRow(r) {
  var found = r.customer_subscriptions && r.customer_subscriptions.status === "found";
  var row = el("div", "crmverdict");
  row.appendChild(set(el("span", "sl"), found ? "Right CRM account?" : "Is this customer in the CRM?"));

  // "wrong" and "missed" are the actionable answers — both mean a human knows
  // the right account, so we ask which one and feed the curation queue.
  var opts = found
    ? [["correct", "Yes"], ["wrong", "No — wrong customer"], ["unsure", "Unsure"]]
    : [["missed", "Yes — we missed it"], ["not_in_crm", "No"], ["unsure", "Unsure"]];

  var st = el("span", "st"); st.setAttribute("aria-live", "polite");
  var hint = document.createElement("input");
  hint.type = "text";
  hint.className = "crmhint";
  hint.placeholder = "Which account is the right one? (optional)";
  hint.setAttribute("aria-label", "Correct CRM account for ticket " + r.ticket_id);
  hint.value = r.crm_account_hint || "";
  var needsHint = function (v) { return v === "wrong" || v === "missed"; };
  hint.style.display = needsHint(r.crm_account_correct) ? "" : "none";

  var btns = [];
  async function save(value) {
    st.textContent = "Sparar…";
    try {
      var res = await api("/rest/v1/rpc/submit_crm_match_verdict", {
        method: "POST",
        body: JSON.stringify({
          p_generation_id: r.id,
          p_correct: value,
          p_hint: hint.value.trim() || null,
        }),
      });
      if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
      var out = await res.json(), saved = out && out[0];
      r.crm_account_correct = value;
      if (saved) {
        r.crm_account_hint = saved.crm_account_hint;
        r.my_review_version = saved.review_version;
        r.review_version = Math.max(r.review_version || 0, saved.review_version || 0);
      }
      btns.forEach(function (b) { b.className = "btn small" + (b._val === value ? " sel" : ""); });
      hint.style.display = needsHint(value) ? "" : "none";
      st.textContent = "sparat";
    } catch (e) { st.textContent = "kunde inte spara: " + e.message; }
  }

  opts.forEach(function (opt) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn small" + (r.crm_account_correct === opt[0] ? " sel" : "");
    b.textContent = opt[1];
    b.setAttribute("aria-label", (found ? "Right CRM account: " : "Customer in CRM: ") + opt[1]);
    b._val = opt[0];
    b.onclick = function () { save(opt[0]); };
    btns.push(b);
    row.appendChild(b);
  });
  row.appendChild(hint);
  row.appendChild(st);
  // Typing the account name is only useful once a verdict exists to attach it to.
  hint.onblur = function () { if (r.crm_account_correct) save(r.crm_account_correct); };
  if (r.crm_account_correct) st.textContent = "sparat";
  return row;
}
// ── Coaching tab (2026-08-04) ───────────────────────────────────────────────
//
// The pivot said the product is a COACH, but only the drafting half is measured.
// This tab measures the other half: did the note arrive before the agent started
// writing, and was the recommended next step actually followed?
//
// READ-ONLY, and that is structural, not a promise: every table it reads is
// granted SELECT only, so there is no path from this browser to a write. There
// is also deliberately NO control for an agent to declare they followed the
// advice — follow-through is observed or it is unknown, never self-reported.

async function loadCoaching() {
  if (coach.loaded) return;
  async function get(path) {
    try {
      var res = await api("/rest/v1/" + path);
      if (!res.ok) return null;
      return await res.json();
    } catch (_e) { return null; }
  }
  var r = await Promise.all([
    get("coaching_baselines?select=*"),
    get("coaching_reply_distribution?select=*&order=bucket_order"),
    get("coaching_next_steps?select=*&limit=300"),
    get("coaching_delivery_summary?select=*"),
    get("coaching_step_mix?select=*"),
    get("coaching_value_pairing?select=*"),
    get("coaching_failed_advice?select=*&limit=40"),
    get("coaching_knowledge_produced?select=*"),
  ]);
  coach.baselines = r[0] || [];
  coach.dist      = r[1] || [];
  coach.steps     = r[2] || [];
  coach.delivery  = (r[3] || [])[0] || null;
  coach.mix       = r[4] || [];
  coach.pairing   = r[5] || [];
  coach.failed    = r[6] || [];
  coach.knowledge = (r[7] || [])[0] || null;

  // Demo mode REPLACES the follow-through sections rather than mixing with
  // them, so no figure on screen is part real and part sample. Baselines, note
  // timing and Knowledge produced are left exactly as the database has them —
  // those come from measure-baselines / observe-coaching and are real.
  if (COACH_DEMO) {
    coach.steps = demoSteps();
    coach.mix = demoMix(coach.steps);
    coach.pairing = demoPairing(coach.steps);
    coach.failed = demoFailed(coach.steps);
  }
  coach.loaded = true;
}

  // ── 2. Delivery timing ────────────────────────────────────────────────────
  wrap.appendChild(sectionEl(
    "Did the note arrive in time?",
    "A note is only useful if it is there before the agent starts writing. The bar is how long " +
    "the first agent reply actually takes on coached tickets — it sets the deadline the note " +
    "has to beat. The counter underneath is measured from our own notes. A late note is a " +
    "DELIVERY failure, not a bad suggestion — counted apart so the model is not blamed for " +
    "advice nobody saw."));
  var timing = el("div", "ctiming");
  if (coach.dist.length) {
    var bar = el("div", "cbar");
    var colours = ["#9E3227", "#B45A09", "#4E9A9B", "#0F7173"];
    coach.dist.forEach(function (d, i) {
      var seg = el("div", "");
      seg.style.flex = String(d.share_pct);
      seg.style.background = colours[i % colours.length];
      seg.textContent = d.share_pct + "%";
      seg.title = d.label + " — " + d.conversations + " conversations";
      bar.appendChild(seg);
    });
    timing.appendChild(bar);
    var legend = el("div", "clegend");
    coach.dist.forEach(function (d, i) {
      var sp = el("span", "");
      var sw = el("i", ""); sw.style.background = colours[i % colours.length];
      sp.appendChild(sw);
      sp.appendChild(document.createTextNode(d.label + " (" + d.conversations + ")"));
      legend.appendChild(sp);
    });
    timing.appendChild(legend);
  }
  var dv = coach.delivery;
  var lateLine = el("p", "chint");
  var caveatLine = null;
  if (!dv || !dv.measured) {
    lateLine.textContent =
      "No delivery rows yet. Run `deno task observe-coaching` (dry run by default) to measure " +
      "note timing against the first agent reply.";
  } else {
    var judgeable = (dv.in_time || 0) + (dv.late || 0);
    var pct = dv.late_pct == null ? "—" : dv.late_pct + "%";
    lateLine.innerHTML =
      "<b>" + num(dv.late) + " late</b> of " + num(judgeable) +
      " judgeable note(s) — " + esc(pct) + " (target under 2%). " +
      num(dv.no_reply_yet) + " ticket(s) have no agent reply yet, so there is nothing to judge.";
    if (dv.late_pct != null && Number(dv.late_pct) > 2) lateLine.className = "chint bad";
    // A low late rate is only good news if notes were actually racing a
    // deadline. Excluded rows are stated, not hidden, and a judgeable
    // population this small is called out — otherwise "0% late" reads as
    // "delivery is solved" when it means "delivery has not been tested".
    var excluded = (dv.backfill || 0) + (dv.never_delivered || 0);
    if (excluded || judgeable < 20) {
      var caveat = el("p", "chint");
      var bits = [];
      if (dv.backfill) {
        bits.push("<b>" + num(dv.backfill) + "</b> generated after the agent had already " +
          "replied (backfill — never racing a deadline, so not a delivery failure)");
      }
      if (dv.never_delivered) {
        bits.push("<b>" + num(dv.never_delivered) + "</b> never posted at all (replay/dry-run)");
      }
      caveat.innerHTML =
        (bits.length ? "Excluded from that rate: " + bits.join("; ") + ". " : "") +
        (judgeable < 20
          ? "<b>Read the rate as untested, not as good.</b> The live scheduler has not been " +
            "enabled, so almost nothing has ever raced an agent — this becomes a real " +
            "measurement once notes are posted by the minute-poller against live tickets."
          : "");
      caveatLine = caveat;
    }
  }
  timing.appendChild(lateLine);
  // After the count, not before it: the caveat qualifies the number, so the
  // number has to be on screen first.
  if (caveatLine) timing.appendChild(caveatLine);
  wrap.appendChild(timing);

  // ── 3. Next steps ─────────────────────────────────────────────────────────
  wrap.appendChild(sectionEl(
    "Next steps",
    "One row per recommended step. Each type has one signal in a system we already read, so " +
    "follow-through is observed — there is no button here asking an agent whether they complied.",

  wrap.appendChild(stepMixEl());
  wrap.appendChild(stepTableEl());

  // ── 4. Value pairing ──────────────────────────────────────────────────────
  wrap.appendChild(sectionEl(
    "Where the value shows",
    "Followed on its own proves nothing — an agent obeying bad advice is a cost. The pairing " +
    "is the metric: follow-through read against the outcome, with the locked holdout cohort " +
    "kept separate so the coaching is isolated from the drafting."));
  wrap.appendChild(pairingEl());

  // ── 5. Advice that failed ─────────────────────────────────────────────────
  wrap.appendChild(sectionEl(
    "Advice that failed",
    "Followed and it still went wrong, or it never reached the agent. The delivery status is " +
    "on every card so a late note is never misread as bad advice."));
  wrap.appendChild(failedEl());

  // ── 6. Knowledge produced ─────────────────────────────────────────────────
  wrap.appendChild(sectionEl(
    "Knowledge produced",
    "The three closing states of a note, derived from pipeline output rather than reported by " +
    "anyone. This is the weekly documentation backlog."));
  var k = coach.knowledge || {};
  var kt = el("div", "ctiles three");
  kt.appendChild(tileEl("📗 Documented", num(k.documented), "answer already existed", k.documented == null));
  kt.appendChild(tileEl("🔵 Wish to log", num(k.wish), "product limitation", k.wish == null));
  kt.appendChild(tileEl("📕 Gap to fill", num(k.gap), "nothing written anywhere", k.gap == null));
  wrap.appendChild(kt);

  var foot = el("p", "cfoot");
  foot.innerHTML =
    "Baselines are measured on the coached tickets and locked (<code>deno task " +
    "measure-baselines</code>). Follow-through and delivery are computed " +
    "by <code>deno task observe-coaching</code>, which reads Freshdesk and writes only to this " +
    "database. Nothing on this tab writes to any connected system, and no scheduler is enabled." +
    (COACH_DEMO
      // One line, once, at the bottom. Not a badge on every row — but the tab is
      // read for decisions, so where the numbers come from has to be findable.
      ? " <b>Next steps, pairing and failed advice are showing a sample dataset</b> while " +
        "Linear and Planhat are unconnected (<code>COACH_DEMO</code>); baselines, note timing " +
        "and knowledge produced are live."
      : "");
  wrap.appendChild(foot);

  lw.appendChild(wrap);
}

  ],

  ],

    "The account owner should see this — copy the CSM before replying.",
  ],

    "Verify which role the user actually holds — the symptom fits a permissions issue.",

};

// Where the follow-through was seen. Matches signalName(), plus a concrete
// reference where the system has one.
var DEMO_VIA = {
  escalate: "Freshdesk group",
  route_expert: "Freshdesk group",
  link_jira: "Jira",
  link_linear: "Linear",
  copy_csm: "Planhat",
  offer_meeting: "Planhat",
  write_kb: "article_drafts",
  internal_check: "—",
};
var DEMO_REF = {
  link_jira: ["TIMEPLAN-4147", "TIMEPLAN-4145", "EXE-788", "TIMEPLAN-4126", "TIMEPLAN-4143"],
  link_linear: ["REQ-1184", "REQ-1207", "REQ-1152", "REQ-1233"],
  copy_csm: ["activity created", "activity created", "activity created", "activity created"],
  offer_meeting: ["meeting activity created", "meeting activity created"],
  write_kb: ["draft #12", "draft #9"],
};

// internal_check is the only type with no signal by design. Everything else is
// observable in this dataset — the point of the demo is a fully connected world.
function demoObservable(type) { return type !== "internal_check"; }

function demoSteps() {
  var seen = {};
  return DEMO_ROWS.map(function (r, i) {
    var id = r[0], subject = r[1], type = r[2], followed = !!r[3], flags = r[4] || "";
    var texts = DEMO_TEXT[type] || [""];
    var obs = demoObservable(type);
    var via = DEMO_VIA[type] || "—";
    if (followed && DEMO_REF[type]) {
      seen[type] = (seen[type] || 0);
      via += " · " + DEMO_REF[type][seen[type]++ % DEMO_REF[type].length];
    }
    return {
      ticket_id: id,
      ticket_url: "https://simployer.freshdesk.com/a/tickets/" + id,
      subject: subject,
      step_type: type,
      step_text: texts[i % texts.length],
      observed_via: obs ? via : "—",
      observable: obs,
      observed: obs ? followed : null,
      delivery_status: flags.indexOf("l") !== -1 ? "late" : "in_time",
      cohort: flags.indexOf("h") !== -1 ? "holdout" : "development",
      judged_unusable: flags.indexOf("x") !== -1,
    };
  });
}

// Computed from the rows above, never typed twice — so the summary table and
// the per-ticket table cannot drift apart.
function demoMix(steps) {
  var by = {}, order = [];
  steps.forEach(function (s) {
    if (!by[s.step_type]) { by[s.step_type] = { step_type: s.step_type, steps: 0, observable: 0, followed: 0 }; order.push(s.step_type); }
    var m = by[s.step_type];
    m.steps++;
    if (s.observable) { m.observable++; if (s.observed) m.followed++; }
  });
  return order.map(function (k) {
    var m = by[k];
    m.followed_pct = m.observable ? Math.round(1000 * m.followed / m.observable) / 10 : null;
    return m;
  }).sort(function (a, b) { return b.steps - a.steps; });
}

// Follow-through read against the outcome, holdout kept separate. The bucket
// SIZES are counted from the rows above, so the totals always reconcile with
// the two tables. The outcome rates are fixed per bucket and deliberately
// unimpressive — a demo where following the advice yields 96% usable does not
// look like support data, it looks like a sales slide. The story it should tell
// is the modest one: following good advice correlates with a usable draft.
var DEMO_OUTCOME = {
  followed: { usable: 0.64, unusable: 0.14 },
  not_followed: { usable: 0.33, unusable: 0.30 },
  not_observable: { usable: 0.45, unusable: 0.20 },
};

function demoPairing(steps) {
  var by = {}, order = [];
  steps.forEach(function (s) {
    var ft = !s.observable ? "not_observable" : s.observed ? "followed" : "not_followed";
    var key = ft + "|" + s.cohort;
    if (!by[key]) { by[key] = { follow_through: ft, cohort: s.cohort, suggestions: 0 }; order.push(key); }
    by[key].suggestions++;
  });
  return order.map(function (k) {
    var p = by[k], rate = DEMO_OUTCOME[p.follow_through];
    // Not every generation gets judged, here as in the real data.
    p.judged = Math.round(p.suggestions * 0.88);
    p.usable = Math.round(p.judged * rate.usable);
    p.unusable = Math.round(p.judged * rate.unusable);
    // judged > usable + unusable on purpose: the remainder is 'edited'.
    p.usable_pct = p.judged ? Math.round(1000 * p.usable / p.judged) / 10 : null;
    return p;
  }).sort(function (a, b) {
    return a.follow_through.localeCompare(b.follow_through) || a.cohort.localeCompare(b.cohort);
  });
}

// Followed and it still went wrong, or it never reached the agent in time. The
// late ones are labelled a DELIVERY failure so they are never misread as bad
// advice — that distinction is the whole reason this section exists.
function demoFailed(steps) {
  return steps.filter(function (s) {
    return s.judged_unusable || s.delivery_status === "late";
  }).map(function (s) {
    return {
      ticket_id: s.ticket_id,
      subject: s.subject,
      step_text: s.step_text,
      delivery_status: s.delivery_status,
      failure_kind: s.delivery_status === "late"
        ? "note posted after the agent had already replied"
        : "step was followed and the suggestion was still judged unusable",
    };
  });
}

// Step-type mix — and the unobservable share, which judges the PROMPT, not the agent.
function stepMixEl() {
  var box = el("div", "cmix");
  if (!coach.mix.length) {
    box.appendChild(set(el("p", "chint"),
      "No steps classified yet. Run `deno task observe-coaching` to populate them."));
    return box;
  }
  var total = coach.mix.reduce(function (n, m) { return n + m.steps; }, 0);
  var blind = coach.mix.reduce(function (n, m) { return n + (m.steps - m.observable); }, 0);
  var share = total ? Math.round(1000 * blind / total) / 10 : 0;

  var warn = el("div", "cbudget" + (share > 15 ? " over" : ""));
  warn.innerHTML = "<b>" + share + "%</b> of recommendations have no observable signal " +
    "(budget 15%). " + (share > 15
      ? "Over budget — the prompt is producing advice that cannot be evaluated. That is a prompt " +
        "problem to fix, not an agent problem to chase."
      : "Within budget.");
  box.appendChild(warn);

  var t = document.createElement("table");
  t.className = "ctable";
  t.innerHTML = "<thead><tr><th>Step type</th><th>Steps</th><th>Observable</th>" +
    "<th>Followed</th><th>Signal</th></tr></thead>";
  var tb = document.createElement("tbody");
  coach.mix.forEach(function (m) {
    var tr = document.createElement("tr");
    tr.appendChild(set(document.createElement("td"), m.step_type));
    tr.appendChild(set(document.createElement("td"), String(m.steps)));
    tr.appendChild(set(document.createElement("td"), String(m.observable)));
    tr.appendChild(set(document.createElement("td"),
      m.observable ? (m.followed + (m.followed_pct != null ? " (" + m.followed_pct + "%)" : "")) : "—"));
    var sig = document.createElement("td");
    // internal_check has no system signal BY DESIGN — it is not a missing
    // integration, and labelling it "not connected" invites someone to go and
    // connect something.
    sig.appendChild(m.observable
      ? tag("observable", "p-yes")
      : m.step_type === "internal_check"
      ? tag("no signal by design", "p-na")
      : tag("not connected", "p-na"));
    tr.appendChild(sig);
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  box.appendChild(t);
  return box;
}

function stepTableEl() {
  if (!coach.steps.length) {
    return set(el("p", "chint"), "No recommended steps recorded yet.");
  }
  var t = document.createElement("table");
  t.className = "ctable";
  t.innerHTML = "<thead><tr><th style='width:26%'>Ticket</th>" +
    "<th style='width:32%'>Recommended step</th><th style='width:13%'>Observed in</th>" +
    "<th style='width:13%'>Followed</th><th style='width:16%'>Delivery</th></tr></thead>";
  var tb = document.createElement("tbody");

  coach.steps.slice(0, 120).forEach(function (r) {
    var tr = document.createElement("tr");

    var td1 = document.createElement("td");
    var a = document.createElement("a");
    a.className = "tk"; a.href = r.ticket_url || "#"; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "#" + r.ticket_id;
    td1.appendChild(a);
    td1.appendChild(document.createTextNode(" " + (r.subject || "")));
    if (r.cohort === "holdout") {
      // Holdout tickets are the locked eval set — never fed back, never mixed in.
      td1.appendChild(tag("🔒 holdout", "p-na"));
    }
    tr.appendChild(td1);

    var td2 = document.createElement("td");
    td2.appendChild(set(el("b", ""), r.step_type));
    td2.appendChild(set(el("div", "cstep"), r.step_text || ""));
    tr.appendChild(td2);

    tr.appendChild(set(document.createElement("td"), r.observed_via || signalName(r.step_type)));

    var td4 = document.createElement("td");
    // Three-valued on purpose: "Not visible" means we cannot see it. It must
    // never be read as "the agent ignored the advice".
    td4.appendChild(r.observable === true
      ? (r.observed ? tag("Yes", "p-yes") : tag("No", "p-no"))
      : tag("Not visible", "p-na"));
    tr.appendChild(td4);

    var td5 = document.createElement("td");
    td5.appendChild(r.delivery_status === "late"
      ? tag("late", "p-no")
      : r.delivery_status === "in_time"
      ? tag("in time", "p-yes")
      : tag(r.delivery_status || "—", "p-na"));
    tr.appendChild(td5);

    tb.appendChild(tr);
  });

  t.appendChild(tb);
  return t;
}

function signalName(type) {
  var m = {
    route_expert: "Freshdesk group", escalate: "Freshdesk group",

function pairingEl() {

function failedEl() {

// ── Articles tab (2026-08-03) ───────────────────────────────────────────────
//
// Approved articles are NOT published to Freshdesk — that would be a third
// external write and a wider security review (CLAUDE.md §3). Instead they live
// here, findable and editable, with their whole provenance attached: which ticket
// they came from, which human-validated resolution they were generalised from,
// who asked for them and who signed off.
var fArtStatus = "";

function articleControlsEl() {
  var box = el("div", "controls");
  var counts = {};
  articles.forEach(function (a) { counts[a.status] = (counts[a.status] || 0) + 1; });
  var opts = ["drafted", "requested", "approved", "rejected", "failed"]
    .filter(function (st) { return counts[st]; })
    .map(function (st) { return [st, (ART_LABEL[st] || st) + " (" + counts[st] + ")"]; });
  box.appendChild(selectEl("Alla statusar", opts, fArtStatus, function (v) {
    fArtStatus = v; renderList();
  }));

  var inp = document.createElement("input");
  inp.type = "search"; inp.className = "search";
  inp.placeholder = "Sök rubrik, ticket eller ämne…";
  inp.setAttribute("aria-label", "Search articles");
  inp.value = search;
  inp.oninput = function () { search = inp.value; renderList(); };
  box.appendChild(inp);
  return box;
}

function renderArticleList() {
  var q = search.trim().toLowerCase();
  var list = articles.filter(function (a) {
    if (fArtStatus && a.status !== fArtStatus) return false;
    if (!q) return true;
    var hay = (String(a.ticket_id) + " " + (a.title || "") + " " + (a.proposed_title || "") +
      " " + (a.ticket_subject || "") + " " + (a.summary || "")).toLowerCase();
    return hay.indexOf(q) >= 0;
  });

  var lw = document.getElementById("listwrap");
  lw.innerHTML = "";
  cardEls = []; activeIdx = -1;
  if (!list.length) {
    var e = el("div", "empty");
    e.textContent = articles.length
      ? "Inga artiklar matchar."
      : "Inga artiklar än. Be om en från ett ärende i granskningslistan — " +
        "AI:n föreslår, men det är du som bestämmer att något blir kunskap.";
    lw.appendChild(e);
    return;
  }
  list.forEach(function (a) {
    var card = articleCardEl(a);
    cardEls.push(card); lw.appendChild(card);
  });
}

function articleCardEl(a) {
  var card = el("div", "card art a-" + a.status);

  var head = el("div", "arthead");
  head.appendChild(tag(ART_LABEL[a.status] || a.status, "a-" + a.status));
  // VART artikeln tar vägen är loopens viktigaste fält och saknades helt:
  // Confluence är den interna sidan agenter läser, hjälpcentret är den kunden
  // läser. Utan det står det bara "artikel" och läsaren vet inte vilken.
  if (a.destination) head.appendChild(tag(a.destination, "a-dest"));
  if (a.is_demo) head.appendChild(tag("sample", "a-sample"));
  if (a.language) head.appendChild(tag(a.language));
  if (a.audience) head.appendChild(tag(a.audience === "agent" ? "för agent" : "för kund"));
  var link = document.createElement("a");
  link.className = "tlink";
  link.href = a.ticket_url || "#";
  link.target = "_blank"; link.rel = "noopener";
  link.textContent = "#" + a.ticket_id;
  head.appendChild(link);
  if (a.ticket_subject) head.appendChild(set(el("span", "artwhy"), a.ticket_subject));
  card.appendChild(head);

  if (a.status === "requested") {
    card.appendChild(set(el("div", "artprop"),
      "Förslag: ”" + (a.proposed_title || "(ingen rubrik)") + "”"));
    if (a.proposed_reason) card.appendChild(set(el("div", "artwhy"), a.proposed_reason));
    card.appendChild(set(el("div", "artwhy"),
      "I kö — artikeln skrivs vid nästa körning av write-articles."));
    card.appendChild(articleTrace(a));
    return card;
  }
  if (a.publishable === false || a.status === "failed") {
    card.appendChild(set(el("div", "artblocked"),
      "Kunde inte skrivas: " + (a.blocked_reason || "okänd orsak")));
    card.appendChild(set(el("div", "artwhy"),
      "Det är ett giltigt utfall — hellre ingen artikel än en som gissar."));
    card.appendChild(articleTrace(a));
    return card;
  }

  var titleIn = document.createElement("input");
  titleIn.type = "text"; titleIn.className = "arttitle";
  titleIn.setAttribute("aria-label", "Rubrik, artikel " + a.article_id);
  titleIn.value = a.title || "";
  card.appendChild(titleIn);

  card.appendChild(set(el("div", "artlab"), "Sammanfattning"));
  var summaryIn = document.createElement("textarea");
  summaryIn.className = "artsum"; summaryIn.rows = 2;
  summaryIn.setAttribute("aria-label", "Sammanfattning, artikel " + a.article_id);
  summaryIn.value = a.summary || "";
  card.appendChild(summaryIn);

  card.appendChild(set(el("div", "artlab"), "Steg (ett per rad)"));
  var stepsIn = document.createElement("textarea");
  stepsIn.className = "artsteps"; stepsIn.rows = 5;
  stepsIn.setAttribute("aria-label", "Steg, artikel " + a.article_id);
  stepsIn.value = (a.steps || []).join("\n");
  card.appendChild(stepsIn);

  card.appendChild(set(el("div", "artlab"), "Noteringar (ett per rad)"));
  var notesIn = document.createElement("textarea");
  notesIn.className = "artsteps"; notesIn.rows = 3;
  notesIn.setAttribute("aria-label", "Noteringar, artikel " + a.article_id);
  notesIn.value = (a.notes || []).join("\n");
  card.appendChild(notesIn);

  var st = el("span", "st"); st.setAttribute("aria-live", "polite");
  var btns = el("div", "artbtns");

  function lines(ta) {
    return ta.value.split("\n").map(function (x) { return x.trim(); })
      .filter(function (x) { return x; });
  }
  // status null = "just save my edits" — the RPC then leaves the status and the
  // approver stamp alone, so fixing a typo on an approved article cannot silently
  // unapprove it or overwrite who signed off.
  async function save(status) {
    st.textContent = "Sparar…";
    try {
      var res = await api("/rest/v1/rpc/review_kb_article", {
        method: "POST",
        body: JSON.stringify({
          p_article_id: a.article_id,
          p_status: status || null,
          p_title: titleIn.value.trim(),
          p_summary: summaryIn.value.trim(),
          p_steps: lines(stepsIn),
          p_notes: lines(notesIn),
        }),
      });
      if (!res.ok) { st.textContent = "Kunde inte spara: " + (await res.text()); return; }
      var out = await res.json(), saved = out && out[0];
      a.title = titleIn.value.trim(); a.summary = summaryIn.value.trim();
      a.steps = lines(stepsIn); a.notes = lines(notesIn);
      if (saved) {
        a.status = saved.status;
        a.reviewed_by = saved.reviewed_by; a.reviewed_at = saved.reviewed_at;
        a.updated_at = saved.updated_at;
      }
      st.textContent = status === "approved" ? "godkänd — klar att publiceras för hand"
        : status === "rejected" ? "avvisad" : "sparat";
      render();
    } catch (e) { st.textContent = "kunde inte spara: " + e.message; }
  }

  function button(label, cls, fn) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "btn small" + (cls ? " " + cls : "");
    b.textContent = label; b.onclick = fn; btns.appendChild(b);
  }
  // "Spara" keeps the article where it is — editing an approved article must not
  // unapprove it, nor rewrite who approved it (the RPC only stamps on a decision).
  button("Spara", "", function () { save(null); });
  if (a.status !== "approved") button("Godkänn", "sel", function () { save("approved"); });
  if (a.status !== "rejected") button("Avvisa", "", function () { save("rejected"); });
  card.appendChild(btns);
  card.appendChild(st);
  card.appendChild(articleTrace(a));
  return card;
}

// The traceability line. An article outlives the ticket it came from, so where it
// came from has to travel with it.
function articleTrace(a) {

  line("Ärende", "#" + a.ticket_id + (a.ticket_subject ? " — " + a.ticket_subject : ""));
  line(
    "Skriven utifrån",
    a.resolution_source === "gold_answer"
      ? "en granskares idealsvar (guldstandard)"
      : a.resolution_source === "agent_reply"
      ? "svaret agenten faktiskt skickade"
      : "",
  );
  line("AI:ns förslag", a.proposed_title);
  line("Varför", a.proposed_reason || a.gap_filled);
  line("Borttagna kunduppgifter",
    (a.removed_specifics || []).length ? a.removed_specifics.join(", ") : "");
  line("Begärd av", a.requested_by + (a.requested_at ? " · " + fmtDate(a.requested_at) : ""));
  line("Utkast skrivet", a.drafted_at ? fmtDate(a.drafted_at) : "");
  line("Beslut", a.reviewed_by ? a.reviewed_by + " · " + fmtDate(a.reviewed_at) : "");
  line("Senast ändrad", a.updated_at ? fmtDate(a.updated_at) : "");
  line("Version", [a.article_version, a.model].filter(Boolean).join(" · "));
  d.appendChild(body);
  return d;
}

function fmtDate(iso) {
  try { return new Date(iso).toLocaleString("sv-SE", { dateStyle: "short", timeStyle: "short" }); }
  catch (_e) { return iso; }
}

// ── KB article (2026-08-03) ─────────────────────────────────────────────────
//
// Gate 1's root cause was knowledge nobody wrote down, so the loop closes here:
// the AI FLAGS a ticket whose answer would generalise, the reviewer decides, and
// a separate job drafts the article from a resolution a HUMAN stood behind (an
// ideal answer, or the reply that was actually sent) — never from the AI's own
// draft. Nothing is published anywhere; approved articles are exported for a
// human to paste into the help centre.
function articlePanel(r) {
  var opp = r.article_opportunity || {};
  var proposed = opp.worth_writing === true && opp.proposed_title;
  var existing = articlesByTicket[r.ticket_id];

  // Nothing to show unless the AI proposed one or somebody already asked — the
  // reviewer's screen is for judging replies first.
  if (!proposed && !existing) return el("div", "arthidden");

  var box = el("div", "artbox");

//
// TWO DIFFERENT JOBS, kept apart on purpose:
//
//   To review / Judged / Rewrite  →  TRAINING THE AI. A reviewer judges the
//                                    draft and writes the ideal answer. Dense,
//                                    full of metadata, built for judging.
//   🤝 Agent note                 →  COACHING THE AGENT. What the agent reads
//                                    on the ticket to do their job. Calm, scannable,
//                                    no evaluation controls at all.
//
// Merging them would make each worse: the reviewer loses the metadata they judge
// on, and the agent gets a judging tool when they wanted an answer. So this tab
// carries NO verdict buttons — recording a verdict is training, and it lives in
// the other tabs.

// so this and the posted note deliberately differ.

// ETT beslut, inte tre parallella tillstånd.
//
// Förut bar kortet läget, ordet "Confident" och en stapelmätare bredvid
// varandra — och kunde säga "Confident, sources unverified", vilket är två
// påståenden som drar åt olika håll i samma andetag. Agenten ska läsa EN sak:
// kan jag skicka det här?
//
// Ikon + text bär hela innebörden. Färgen är förstärkning, aldrig ensam bärare
// (WCAG 1.4.1) — chipet är begripligt i gråskala.
var NOTE_MODE = {
  REPLY_READY: { cls: "", icon: "🟢", badge: "Ready to send" },
  COACH_AGENT: { cls: "amber", icon: "🟡", badge: "Review before sending" },
  AGENT_ACTION_REQUIRED: { cls: "red", icon: "🔴", badge: "Action needed before replying" },

// Grundningen är en EGENSKAP hos beslutet, inte ett konkurrerande tillstånd —
// därför en kort bisats i chipet i stället för en egen bricka. Formuleringarna
// är entydiga: ingen av dem påstår både styrka och svaghet samtidigt.
function groundingPhrase(r) {
  if (r.grounding_verified === true) return "backed by sources";
  if (r.grounding_verified === false) return "not backed by the sources";
  if (r.confidence === "high") return "sourcing not verified";
  if (r.confidence === "low") return "partly backed by sources";
  return "no supporting source found";
}

// Vad mätaren faktiskt mäter — som tooltip, för det är inte självklart.
var GROUNDING_HELP =
  "The meter shows how much of the reply could be traced back to a source we " +
  "actually supplied. It is computed in code from the pipeline's own signals — " +
  "the model cannot raise its own score.";

// Confidence as a five-bar meter. Grounding verification counts against it: an
// asserting draft that never resolved a source is not a confident answer, it is
// a confident-sounding one.
function confBars(r) {
  if (r.confidence === "high") return r.grounding_verified === false ? 3 : 4;
  if (r.confidence === "low") return 2;
  return 0;
}
function confWord(r) { return groundingPhrase(r); }

// "Hittade" och "använde" är två olika saker, och skillnaden är hela poängen:
// en källa som lades fram men inte användes förklarar inte svaret. Utkastet
// rapporterar `source_refs` (t.ex. "kb:1042", "ticket:85703", "P2") och de
// matchas mot `sources[].ref` — samma nycklar som verifyGroundingRefs använder
// i pipelinen, så appen och gaten läser samma sak.
//
// Fältet är nytt: bara 14 av 168 genereringar har det. De äldre säger DÄRFÖR
// uttryckligen "ej registrerat" i stället för att tigande se ut som "inte
// använd" — en tom lista och en obefintlig lista betyder helt olika saker.
function refUse(r) {
  var refs = Array.isArray(r.source_refs) ? r.source_refs : null;
  var recorded = !!refs && (refs.length > 0 || r.grounding_verified != null);
  var set_ = {};
  (refs || []).forEach(function (x) { set_[String(x).trim().toLowerCase()] = true; });
  return {
    recorded: recorded,
    // `pos` är källans plats i sin egen grupp, 1-indexerad — playbook-poster
    // refereras som P1/P2 i stället för med ett id.
    used: function (src, pos) {
      if (!recorded) return null;
      if (src.ref && set_[String(src.ref).toLowerCase()]) return true;
      if (src.id != null && src.kind && set_[src.kind + ":" + src.id]) return true;
      if (pos && set_["p" + pos]) return true;
      return false;
    },
  };
}

// Ett läge per system:
//   hit   grönt  — vi hittade något att gå på
//   bad   rött   — vi hittade något, och det är ett problem (en öppen bugg)
//   none  grått  — kollad, inget fanns
//   na    grått  — inte ansluten, alltså inte kollad alls
// Rött markerar alltså också DATA, inte bara frånvaro: en öppen bugg är ett
// fynd, och det är dåliga nyheter — vilket är precis vad agenten ska se först.
function sourceSystemsEl(r) {
  var srcs = Array.isArray(r.sources) ? r.sources : [];
  function of(kind) { return srcs.filter(function (s) { return s.kind === kind; }); }

  var n = Number(r.ticket_id) || 0;
  var groups = [
    { key: "ticket", label: "Past tickets", items: of("ticket") },
    { key: "kb", label: "Knowledge base", items: of("kb") },
    { key: "playbook", label: "Playbook", items: of("playbook").concat(of("incident")) },
  ];

  // System utan klient: raden finns ändå, för "inte ansluten" är ett svar.
  if (PLANHAT_DEMO) {
    var jiraHit = n % 3 === 0;
    groups.push({ key: "jira", label: "Jira", sample: true, bad: jiraHit,
      items: jiraHit ? [{ title: "TIMEPLAN-" + (4100 + (n % 60)) + " — open, no fix version" }] : [],
      empty: "No open issue matches this ticket's topic." });
    groups.push({ key: "linear", label: "Linear", sample: true,
      items: n % 2 === 0
        ? [{ title: "Request open — " + (1 + (n % 5)) + " customers asking. No committed date." }] : [],
      empty: "No product request covers this." });
  }
  groups.push({ key: "confluence", label: "Confluence", notConnected: true,
    empty: "Not connected — this ticket's topic was never checked there." });

  var use = refUse(r);
  var box = el("div", "nv-sys");
  groups.forEach(function (g) {
    var has = g.items && g.items.length;
    var state = g.notConnected ? "na" : has ? (g.bad ? "bad" : "hit") : "none";
    // Hur många av gruppens källor svaret faktiskt lutade sig mot. Sample- och
    // ej-anslutna rader har inga refs att matcha mot och räknas inte.
    var nUsed = (has && !g.sample && !g.notConnected)
      ? g.items.filter(function (s, i) { return use.used(s, i + 1) === true; }).length
      : 0;

    var row = el("div", "nv-sysrow " + state);
    var head = document.createElement("button");
    head.className = "nv-syshead";
    head.type = "button";
    head.disabled = !has;
    head.setAttribute("aria-expanded", "false");

    head.appendChild(set(el("span", "nv-src " + state), g.label));
    var sum = el("span", "nv-syssum");
    sum.textContent = g.notConnected
      ? "not connected"
      : has
      ? (g.items.length === 1 && g.items[0].title && !g.items[0].id
          ? g.items[0].title
          : g.items.length + (g.items.length === 1 ? " source" : " sources"))
      : (g.empty || "nothing found");
    head.appendChild(sum);
    if (g.sample) head.appendChild(set(el("span", "nv-demotag"), "sample"));
    // Sammanfattningen på huvudraden, så skillnaden syns utan att fälla ut.
    if (has && !g.sample && !g.notConnected) {
      head.appendChild(set(el("span", "nv-use" + (use.recorded ? (nUsed ? " on" : "") : " unk")),
        !use.recorded ? "use not recorded"
          : nUsed ? nUsed + " used in the reply"
          : "none used in the reply"));
    }
    if (has) head.appendChild(set(el("span", "nv-caret"), "▸"));
    row.appendChild(head);

    if (has) {
      var list = el("ul", "nv-facts nv-sysbody");
      list.style.display = "none";
      g.items.forEach(function (src, i) {
        var li = document.createElement("li");
        var txt = el("span", "nv-fact");
        if (src.url) {
          var link = document.createElement("a");
          link.href = src.url; link.target = "_blank"; link.rel = "noopener";
          link.textContent = src.title || ("#" + src.id);
          txt.appendChild(link);
        } else {
          txt.appendChild(document.createTextNode(src.title || ("#" + src.id)));
        }
        if (src.publicUrl) {
          txt.appendChild(document.createTextNode(" · "));
          var pub = document.createElement("a");
          pub.href = src.publicUrl; pub.target = "_blank"; pub.rel = "noopener";
          pub.className = "nv-send";
          pub.textContent = "send to customer";
          txt.appendChild(pub);
        }
        // Per källa, ALLTID — även när svaret är "det registrerades inte".
        if (!g.sample && !g.notConnected) {
          var u = use.used(src, i + 1);
          txt.appendChild(set(el("span", "nv-use" + (u === true ? " on" : u === false ? " off" : " unk")),
            u === true ? "used in the reply"
              : u === false ? "not used"
              : "not recorded"));
        }
        li.appendChild(txt);
        list.appendChild(li);
      });
      var open = false;
      head.onclick = function () {
        open = !open;
        list.style.display = open ? "" : "none";
        head.setAttribute("aria-expanded", open ? "true" : "false");
        head.querySelector(".nv-caret").textContent = open ? "▾" : "▸";
      };
      row.appendChild(list);
    }
    box.appendChild(row);
  });
  return box;
}

// Hälsan som HANDLING, inte som fyra siffror i en remsa. Gult/rött konto eller
// öppna ärenden betyder att svaret inte är hela jobbet — och det måste stå
// ovanför svaret, inte under det.
//
// Den bygger på sample-data, så notisen säger det rakt ut. Att härleda en
// uppmaning ur påhittad hälsa och presentera den som ett faktum vore precis det
// misstag sample-märkningen finns för att förhindra.
function watchOutEl(r) {
  if (!PLANHAT_DEMO) return null;
  var d = demoPlanhat(r.ticket_id);
  var a = demoAccount(r.ticket_id);
  var bad = d.health !== "Green";
  if (!bad && !d.alsoOpen) return null;

  var box = el("div", "nv-watch" + (d.health === "Red" ? " red" : ""));
  var h = el("div", "nv-watchh");
  h.appendChild(document.createTextNode("⚠️ Watch out for"));
  h.appendChild(set(el("span", "nv-demotag"), "sample"));
  box.appendChild(h);

  var says = [];
  if (bad) {
    says.push("Account health is " + d.health.toLowerCase() + " — brief CSM " + d.csm +
      " before this reply goes out. Renewal " + a.renewal + ".");
  }
  if (d.alsoOpen) {
    says.push(d.alsoOpen + " other ticket" + (d.alsoOpen === 1 ? " is" : "s are") +
      " open for this customer — check whether they are related before you reply.");
  }
  box.appendChild(set(el("p", ""), says.join(" ")));
  return box;
}

// All platshållardata på ETT ställe, nedtonat. Förut låg den utspridd över
// remsan och rubriken med var sitt chip, vilket gjorde att den satt mitt bland
// riktiga fakta och kunde läsas som verifierad.
//
// MEN: en hopfälld ruta som bara heter "Demo-kontext" gömmer också vad den
// innehåller — man hittar inte hälsa och CSM om man inte redan vet att de ligger
// där. Sammanfattningsraden bär därför SJÄLVA VÄRDENA (hälsopunkt, CSM,
// förnyelse, öppna ärenden). Det utfällda innehållet är förklaringen, inte
// datan. Nedtoningen och sample-märkningen är kvar — poängen var aldrig att
// dölja siffrorna, bara att de inte får se verifierade ut.
function demoContextEl(r) {
  if (!PLANHAT_DEMO) return null;
  var d = demoPlanhat(r.ticket_id);
  var a = demoAccount(r.ticket_id);

  // RIKTIG CRM-data slår ALLTID exempeldatan. Utan den här regeln kunde ett
  // påhittat abonnemang ("One + Survey + Expert") stå bredvid en verklig
  // merförsäljningssignal som säger att Survey saknas — två motstridiga
  // påståenden om samma konto på samma skärm. Vilket som helst av dem kan då
  // vara det agenten tror på, och exempeldatan är det som inte är sant.
  var c = r.customer_subscriptions;
  var subs = (c && c.status === "found" && Array.isArray(c.subscriptions)) ? c.subscriptions : [];
  var realPlan = subs.map(function (s) { return s.productName; })
    .filter(Boolean).join(" + ");
  var realRenewal = subs.map(function (s) { return s.endDate || s.renewalStatus; })
    .filter(Boolean)[0] || "";
  var plan = realPlan || a.plan;
  var renewal = realRenewal || a.renewal;
  var planIsReal = !!realPlan;

  var box = el("details", "nv-demobox" + (planIsReal ? " mixed" : ""));

  var sum = document.createElement("summary");
  var line = el("span", "nv-demoline");
  line.appendChild(el("span", "nv-dot " + d.health.toLowerCase()));
  line.appendChild(set(el("b", ""), "Health " + d.health));
  line.appendChild(set(el("span", ""), "CSM " + d.csm));
  line.appendChild(set(el("span", ""), plan));
  line.appendChild(set(el("span", ""), "renews " + renewal));
  line.appendChild(set(el("span", ""),
    d.alsoOpen ? d.alsoOpen + " open tickets" : "no other tickets"));
  line.appendChild(set(el("span", "nv-demotag"), planIsReal ? "part sample" : "sample"));
  sum.appendChild(line);
  box.appendChild(sum);

  var dl = el("div", "nv-demogrid");
  [["Account", plan, planIsReal], ["Renewal", renewal, planIsReal],
   ["Health", d.health + " · CSM " + d.csm, false],
   ["Open tickets", d.alsoOpen ? String(d.alsoOpen) : "none", false]].forEach(function (row) {
    var cell = document.createElement("div");
    var dt = el("dt", "");
    dt.appendChild(document.createTextNode(row[0]));
    // Märkningen sitter per fält när raden är blandad — annars går det inte att
    // se vilka två av fyra siffror som faktiskt kommer från CRM.
    if (planIsReal) dt.appendChild(set(el("span", "nv-demotag"), row[2] ? "CRM" : "sample"));
    cell.appendChild(dt);
    cell.appendChild(set(el("dd", ""), row[1]));
    dl.appendChild(cell);
  });
  box.appendChild(dl);
  box.appendChild(set(el("p", "nv-demonote"), planIsReal
    ? "Account and renewal come from Freshworks CRM. Health and CSM are sample data — " +
      "Planhat has no client here — and must not be the basis for a decision."
    : "Freshworks CRM is not enabled and Planhat has no client, so these four " +
      "fields are sample data. They must not be the basis for a decision."));
  return box;
}

// Merförsäljningssignalen. INTERN — den säger åt agenten att lämna vidare, och
// innehåller med flit ingen formulering någon kan klistra in till en kund. Att
// skriva en säljmening är inte vad det här projektet gör (§12, coach-inramningen),
// och en färdig mening är precis vad som råkar skickas.
//
// Bara `opportunity` renderas. "De har det redan" och "CRM matchade inte" lagras
// för mätningen men är inget agenten måste agera på mitt i ärendet, och ett block
// som syns på varje notis slutar läsas.
//
// Rutan visas UNDER svaret: den ändrar vad agenten gör med kontot efteråt, inte
// vad svaret säger.
function upsellEl(r) {
  var u = r.upsell;
  if (!u || u.status !== "opportunity") return null;
  var opps = Array.isArray(u.opportunities) ? u.opportunities : [];
  if (!opps.length) return null;

  var box = el("div", "nv-upsell");
  box.appendChild(set(el("div", "nv-upsellh"), "💡 The customer asked for something the account does not have"));
  var ul = el("ul", "nv-upsellist");
  opps.forEach(function (o) {
    var li = document.createElement("li");
    li.appendChild(set(el("b", ""), o.product || o.capability || "—"));
    if (o.evidence) {
      li.appendChild(set(el("span", "nv-upquote"), "“" + o.evidence + "”"));
    }
    if (o.agentNote) li.appendChild(set(el("span", "nv-upnote"), o.agentNote));
    ul.appendChild(li);
  });
  box.appendChild(ul);
  box.appendChild(set(el("p", "nv-upfoot"),
    "Hand this to sales/CSM AFTER you have answered the support question — do not " +
    "turn the reply into a pitch. Confirm in the CRM first: an account can hold a " +
    "product this check did not see."));
  return box;
}
